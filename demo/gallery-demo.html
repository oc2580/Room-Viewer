d comes with a certificate of authenticity. And since his death in 2025, no new signed prints can be made. The supply of this edition is fixed, and it will not grow.","edition":"Signed limited edition (from the 2014 Red Room imagery), offered individually","medium":"Giclée","signed":true,"imageSizeCm":"","mountSizeCm":"","framedSizeCm":"","reviewNotes":"Edition size and dimensions not in product copy - add for provenance panel and view-in-room. Mature theme; suggest only including for collectors who've shown interest in the Red Room works.","estDurationSec":70,"themes":"After dark","audioUrl":"../audio/jack-vettriano-print-heaven-or-hell.mp3"}},{"productId":"a067f80c-d8df-40e2-072d-149be9a2c08f","title":"Lucky Seven","price":535,"inStock":true,"ribbon":"","media":"5f58c4_79eb88fd128a4dbe92d7e7c969443a4d~mv2.jpg","slug":"jack-vettriano-print-lucky-seven","hasOptions":true,"story":{"_id":"story-a067f80c-d8df-40e2-072d-149be9a2c08f","status":"approved","transcript":"Lucky Seven. A gambler's title, the kind Vettriano loved, with its suggestion of chance, of risk, and of an evening that might turn either way.\n\nGames, wagers and risk recur all through his work, from card tables to dance halls. But his figures rarely seem to be playing for money. The stakes are emotional. And the number seven, traditionally the lucky one, gives the title a hopeful ring, one his paintings seldom let us take entirely at face value.\n\nIt is a smaller image, and it suits a study, a dressing room, or a group of his prints hung together. It is also one of the more accessible signed editions in our collection, a sensible place to begin, or a thoughtful gift for someone who already loves his work.\n\nThe edition is just one hundred prints and ten Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper. An edition of one hundred is small by the standards of his published prints, and now that no new signed editions can ever be produced, its supply is fixed.","edition":"Signed limited edition of 100 + 10 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":"25 x 21","mountSizeCm":"47.5 x 42","framedSizeCm":"57.9 x 52.4","reviewNotes":"","estDurationSec":72,"themes":"Style & society","audioUrl":"../audio/jack-vettriano-print-lucky-seven.mp3"}},{"productId":"e80713f0-af3f-f323-8d35-9b15a3da16b8","title":"Lunchtime Lovers","price":1400,"inStock":true,"ribbon":"Framed","media":"5f58c4_b863172b6fda4dc991799adb60318092~mv2.jpg","slug":"jack-vettriano-print-lunchtime-lovers","hasOptions":false,"story":{"_id":"story-e80713f0-af3f-f323-8d35-9b15a3da16b8","status":"approved","transcript":"Lunchtime Lovers. Few of Vettriano's titles are quite so suggestive.\n\nIt conjures the stolen hour in the middle of the working day. The arrangement kept secret from colleagues and from partners. The thrill of meeting when no one is watching, and the clock ticking back towards the office.\n\nSecret liaisons run all through his work, and he never painted them with judgement. He treated them with a novelist's curiosity about what people actually feel: excitement, guilt and longing, in equal measure. That is why his pictures feel so human. Nobody in them is simply a villain or a victim.\n\nThis is one of the images collectors associate most closely with his narrative style: a whole short story in a single frame. It belongs in a private room, a study or a bedroom.\n\nThe edition is one hundred and twenty-five prints and fifteen Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper, and this example is framed. Its value reflects not only the size of the edition, but the enduring demand for this image.","edition":"Signed limited edition of 125 + 15 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":"39 x 31","mountSizeCm":"62 x 52","framedSizeCm":"","reviewNotes":"","estDurationSec":71,"themes":"Romance, After dark","audioUrl":"../audio/jack-vettriano-print-lunchtime-lovers.mp3"}},{"productId":"4b8795fc-5beb-54ff-8595-2a6f3ef27a0a","title":"Night Calls - Artist Proof 1/10","price":4000,"inStock":true,"ribbon":"Artist Proof 1/10","media":"d9cb8c_010e947063a34593b1bc1db6e2657cb2~mv2.png","slug":"jack-vettriano-print-night-calls-artist-proof","hasOptions":false,"story":{"_id":"story-4b8795fc-5beb-54ff-8595-2a6f3ef27a0a","status":"approved","transcript":"Night Calls belongs to the after-dark side of Vettriano's work: the telephone, the late hour, the closed door, and something private about to happen.\n\nThe title suggests a call that should not be made, or an arrangement made under cover of night. This is Vettriano at his most noir. Low light, a heavy sense of mood, and a story told through glances and gestures rather than spelled out.\n\nBut the print in front of you is something rarer than the image alone. It is not from the main edition. It is an Artist's Proof, and it is numbered one of ten.\n\nArtist's Proofs are the small group of prints traditionally set aside from an edition for the artist himself. They are among the most sought-after prints a collector can own. The main edition of Night Calls was limited to one hundred prints, which means only ten proofs exist in the world, and this is the first of them.\n\nIt is signed and numbered by Jack Vettriano, on museum etching paper, and comes with its certificate of authenticity. For a serious collector of his work, a proof numbered one is a very special thing.","edition":"Artist's Proof numbered 1 of 10 (main edition 100), signed","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":"39 x 31.5","mountSizeCm":"62 x 53.5","framedSizeCm":"73 x 64.5","reviewNotes":"","estDurationSec":77,"themes":"After dark, Rare editions","audioUrl":"../audio/jack-vettriano-print-night-calls-artist-proof.mp3"}},{"productId":"678c5ed0-7d61-d6cc-ce57-e5ea1a613a32","title":"Night-Time Rituals","price":1450,"inStock":true,"ribbon":"","media":"5f58c4_32988047f7e14ec0b2a3e134d39f5594~mv2.jpg","slug":"jack-vettriano-print-night-time-rituals","hasOptions":false,"story":{"_id":"story-678c5ed0-7d61-d6cc-ce57-e5ea1a613a32","status":"approved","transcript":"Night-Time Rituals explores a theme Vettriano returned to all through his career: the private habits and ceremonies that come with the evening.\n\nDressing. Undressing. Pouring a drink. Waiting for a knock at the door. In his paintings these ordinary acts become charged and theatrical, lit as though for a film. The word ritual suggests something familiar, repeated many times. But it also suggests something with its own rules, and that tension lies at the heart of his intimate interiors.\n\nThis painting belongs to the more sensual strand of his work, and it is best enjoyed close up, in a private room: a bedroom, or a dressing room.\n\nIt is also a Premium Limited Edition, which means it is presented very differently from a paper print. It is reproduced at the exact size of the original painting, board mounted and finished by hand with three coats of lacquer, for a satin surface closer to canvas than paper. It arrives in the same style of frame Vettriano used for his originals, with no border and no glass, and each one is signed and numbered by him in silver pen. A premium edition is the closest a print can come to the presence of the original canvas.","edition":"Premium limited edition, original size (12 x 15 in), signed in silver pen","medium":"Giclée, board mounted, hand-embellished with 3 coats of lacquer, no glass","signed":true,"imageSizeCm":"30.5 x 38.1","mountSizeCm":"","framedSizeCm":"","reviewNotes":"Edition size not in product copy - add for provenance panel.","estDurationSec":82,"themes":"After dark, Rare editions","audioUrl":"../audio/jack-vettriano-print-night-time-rituals.mp3"}},{"productId":"fc67cb0b-4d3b-2a1d-9c05-224107d4562a","title":"On Parade","price":3750,"inStock":true,"ribbon":"Rare Print - Studio Proof","media":"5f58c4_ac038f6343464d01b9ac08b5e242578a~mv2.jpg","slug":"jack-vettriano-print-on-parade","hasOptions":false,"story":{"_id":"story-fc67cb0b-4d3b-2a1d-9c05-224107d4562a","status":"approved","transcript":"On Parade shows Vettriano's gift for the dramatic entrance.\n\nA woman in a striking red jacket steps through a doorway. The whole painting is about that moment of arrival: the confidence of the pose, the strong colour against a darker setting, and the unmistakable sense that she knows exactly the effect she is having. The title says it all. Display, performance, and the pleasure of being seen.\n\nRed was one of Vettriano's most powerful tools. He often used it to draw the eye to a single figure in an otherwise restrained palette, and On Parade is one of the boldest examples of that. You notice her first, and you keep coming back to her.\n\nThis is a picture with real presence. It is a large print, and it makes a natural focal point for a hallway, a dining room, or any wall where you want a painting to make a statement.\n\nThe edition was published in 2008, limited to two hundred and fifty, each signed and numbered by Jack Vettriano. Editions from nearly two decades ago are increasingly hard to find in good condition. This example comes framed, in a dark frame that suits the drama of the image.","edition":"Signed limited edition giclée of 250, published 2008 (this example listed as a Studio Proof), dark frame","medium":"Giclée","signed":true,"imageSizeCm":"63.5 x 50.5","mountSizeCm":"88.5 x 73.5","framedSizeCm":"","reviewNotes":"Ribbon says 'Studio Proof' but copy describes the 250 edition - Studio to confirm which this example is before recording.","estDurationSec":80,"themes":"Style & society, Rare editions","audioUrl":"../audio/jack-vettriano-print-on-parade.mp3"}},{"productId":"66203236-7c4d-8fb8-5267-f840f9188863","title":"Pincer Movement","price":1500,"inStock":true,"ribbon":"Framed","media":"d9cb8c_d591cc5bc06a4a939f9d03b83f9679cd~mv2.jpg","slug":"jack-vettriano-print-pincer-movement","hasOptions":false,"story":{"_id":"story-66203236-7c4d-8fb8-5267-f840f9188863","status":"approved","transcript":"Pincer Movement borrows its title from military strategy: the manoeuvre in which an opponent is surrounded from two sides at once.\n\nVettriano applies the idea, with typical wit, to the battlefield of romance and seduction. His titles often cast relationships as games, or campaigns, and this one suggests a carefully planned approach. But as in any campaign, the outcome is far from certain. Who is surrounding whom? And who will surrender first?\n\nIt is a later image, published in 2012, and its clever title and strong composition make it a real talking point. Hang it in a living room or a study, and wait for your guests to ask about the name.\n\nThe edition is one of the smaller runs among his signed prints: just one hundred, plus ten Artist's Proofs, each signed and numbered by Jack Vettriano, on heavyweight museum etching paper. This example is framed and ready to hang.","edition":"Signed limited edition giclée of 100 + 10 Artist's Proofs, published 2012","medium":"Giclée on 350gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":"51 x 42","framedSizeCm":"","reviewNotes":"","estDurationSec":60,"themes":"Romance","audioUrl":"../audio/jack-vettriano-print-pincer-movement.mp3"}},{"productId":"101027d8-6821-fb1d-bd79-5f04309a0e84","title":"Portrait In Black and Pearl","price":2100,"inStock":true,"ribbon":"","media":"5f58c4_d113ab92ed6f45848cb6119921a06b4a~mv2.jpg","slug":"jack-vettriano-print-portrait-in-black-and-pearl","hasOptions":false,"story":{"_id":"story-101027d8-6821-fb1d-bd79-5f04309a0e84","status":"approved","transcript":"Portrait in Black and Pearl is one of Vettriano's most elegant single-figure paintings.\n\nA woman in a cloche hat and a fur collar, pictured with all the poise of a society portrait from the nineteen-twenties or thirties, the era whose fashions and manners he so loved to recreate. The black and the pearl of the title set the palette: restrained, polished and glamorous, with her face as the point of focus.\n\nVettriano painted many women, but his formal portraits have a particular stillness compared with his narrative scenes. There is no second figure here, and no implied drama. Just presence, and style.\n\nIt was first shown in 2010, at his exhibition Days of Wine and Roses in Kirkcaldy, and published that same year in an edition of two hundred and fifty, with twenty-five Artist's Proofs, each signed and numbered by Jack Vettriano.\n\nWe have a single example, supplied framed. Framed examples from an edition more than fifteen years old do not come up often. It suits a formal room, a dining room or a bedroom, and it pairs beautifully with his other portraits of women.","edition":"Signed limited edition of 250 + 25 Artist's Proofs, published 2010, supplied framed","medium":"350gsm museum etching paper","signed":true,"imageSizeCm":"36 x 29","mountSizeCm":"58.5 x 50","framedSizeCm":"69.5 x 60.5","reviewNotes":"","estDurationSec":74,"themes":"Portraits, Style & society","audioUrl":"../audio/jack-vettriano-print-portrait-in-black-and-pearl.mp3"}},{"productId":"987c56d4-d78b-993a-7733-a56bfce5ef29","title":"The Missing Man II","price":2750,"inStock":true,"ribbon":"Premium Limited Edition","media":"5f58c4_ac158f2439694be1a04913f9104c5052~mv2.jpg","slug":"jack-vettriano-print-the-missing-man-ii","hasOptions":false,"story":{"_id":"story-987c56d4-d78b-993a-7733-a56bfce5ef29","status":"approved","transcript":"The Missing Man II returns to one of Vettriano's best-known titles.\n\nThe original Missing Man, published as a silkscreen in 1998, is one of his classic beach scenes. This second painting comes back to the idea at its heart: absence. Someone who should be there, and is not. And the people left behind, waiting, or wondering.\n\nIt is a wonderful device, and Vettriano used it brilliantly. With a single title, an ordinary gathering becomes a mystery. We find ourselves scanning the picture for the one person we cannot see, and asking where he has gone, and why.\n\nThe Missing Man II was released on the twenty-fifth of September 2020, as part of a celebration of Jack Vettriano's greatest works. It is reproduced at the full size of the original painting, thirty by twenty-four inches, board mounted and finished by hand with three coats of lacquer for a satin surface. It comes in the same style of frame as an original, with no border and no glass.\n\nThe edition is just seventy-five, plus five Artist's Proofs, each signed and numbered by Vettriano in silver pen. It has the scale to anchor a room, and the story to hold your attention for years.","edition":"Premium limited edition of 75 + 5 Artist's Proofs, original size (30 x 24 in), signed in silver pen, released 25 Sept 2020","medium":"Giclée, board mounted, hand-embellished with 3 coats of lacquer, no glass","signed":true,"imageSizeCm":"76.2 x 61","mountSizeCm":"","framedSizeCm":"","reviewNotes":"","estDurationSec":80,"themes":"By the sea, Rare editions","audioUrl":"../audio/jack-vettriano-print-the-missing-man-ii.mp3"}},{"productId":"3ac11ed9-6f5b-89f1-b126-6e52ba6fdde8","title":"Yesterday's Dreams","price":2750,"inStock":true,"ribbon":"Framed","media":"5f58c4_5ebd9cd8417141ff8c95d7d954ab7100~mv2.jpeg","slug":"jack-vettriano-print-yesterdays-dreams","hasOptions":false,"story":{"_id":"story-3ac11ed9-6f5b-89f1-b126-6e52ba6fdde8","status":"approved","transcript":"Yesterday's Dreams. It is a reflective, bittersweet title, and it sums up so much of Vettriano's appeal.\n\nHis paintings are steeped in memory and nostalgia: for a style of dressing, of dancing and of romance that belongs to another era, and for the hopes people once had for themselves. This title suggests someone looking back on a life, or a love, and wondering quietly what became of it.\n\nIt is a contemplative picture rather than a dramatic one, and it invites a second look, and then a third.\n\nThis is a Premium Limited Edition, reproduced at the full size of the original painting, twenty-four by twenty inches. It is board mounted and finished by hand with three coats of lacquer, giving a satin surface much closer to canvas than paper, and it is presented in the same style of frame used for his original work, with no glass. The edition is tiny: just seventy-five prints and seven Artist's Proofs, each signed and numbered by Vettriano in silver pen. At this size, it holds a living room or dining room with ease.","edition":"Premium limited edition of 75 + 7 Artist's Proofs, signed in silver pen; original-size, board-mounted, hand-lacquered","medium":"Giclée, board mounted, hand-embellished with 3 coats of lacquer, no glass","signed":true,"imageSizeCm":"61 x 50.8","mountSizeCm":"","framedSizeCm":"","reviewNotes":"Framed size not in product copy - confirm for view-in-room.","estDurationSec":72,"themes":"Quiet moments, Rare editions","audioUrl":"../audio/jack-vettriano-print-yesterdays-dreams.mp3"}},{"productId":"e0762be1-68d4-cddc-5262-9407895d4949","title":"The Red Room Collection","price":7995,"inStock":true,"ribbon":"","media":"d9cb8c_095555575adf44ccbdd8686c1ea59bea~mv2.jpg","slug":"jack-vettriano-the-red-room-collection","hasOptions":false,"story":{"_id":"story-e0762be1-68d4-cddc-5262-9407895d4949","status":"approved","transcript":"The Red Room Collection is a folio of five of Jack Vettriano's most daring images, published together for the first time as signed limited editions in 2014.\n\nThe five are Devotion; The Great Poet; Heaven or Hell: the Sweetest Choice; 'Round Midnight; and Scarlet Ribbons. Together they represent the most private side of his art, built around desire, around power, and around the theatre of seduction.\n\nVettriano never shied away from sensuality, and these are the paintings where he went furthest. They are not for every wall. But for the collector who appreciates this side of his work, they are among the most compelling pictures he ever made.\n\nWhat makes this a significant piece is that it is the complete folio. Owning all five together gives you the series exactly as Vettriano intended it to be seen, and complete sets are considerably scarcer than single prints from the series.\n\nThe edition is limited to one hundred and fifty sets, plus thirty Artist's Proofs, each print signed and numbered by Jack Vettriano, on Hahnemühle museum etching paper. Framed identically and hung as a group, they transform a private room.","edition":"Folio of five signed giclées, edition of 150 sets + 30 Artist's Proofs, published 2014","medium":"Giclée on 300gsm Hahnemühle museum etching paper (x5)","signed":true,"imageSizeCm":"30 x 24.5","mountSizeCm":"41 x 34.5","framedSizeCm":"65 x 58.5","reviewNotes":"Product copy says 'Price on application' but listing is priced at GBP 7,995 - Studio to reconcile. Mature theme. View-in-room should show five frames.","estDurationSec":75,"themes":"After dark, Rare editions","audioUrl":"../audio/jack-vettriano-the-red-room-collection.mp3"}},{"productId":"0a3569c2-6e81-5aee-c7ad-4bf5de982c0e","title":"Just The Way It Is","price":1200,"inStock":true,"ribbon":"Framed","media":"d9cb8c_f3b937540d4f46f1a8566f03f1db6e77~mv2.jpg","slug":"just-the-way-it-is","hasOptions":false,"story":{"_id":"story-0a3569c2-6e81-5aee-c7ad-4bf5de982c0e","status":"approved","transcript":"Just the Way It Is. The title says it all.\n\nThis is one of Vettriano's frank, unadorned figure studies: a nude woman seated on a chair, painted without pretence and without apology. The seated nude is one of the oldest subjects in Western painting, and Vettriano takes his place in that long tradition, bringing to it his own clean lines and his cinematic way with light.\n\nWhat is striking is the calm. This is a confident image rather than a provocative one. The figure is presented simply as she is, just the way it is, and there is a quiet dignity in that directness.\n\nIt is printed on Hahnemühle mould-made paper. Hahnemühle has been making paper in Germany since the sixteenth century, and the fine, gently textured surface suits the soft tones of the figure particularly well.\n\nThe edition is three hundred and fifty prints and forty Artist's Proofs, each signed and numbered by Jack Vettriano. This example is framed, and it belongs in a bedroom or a private study.","edition":"Signed limited edition giclée of 350 + 40 Artist's Proofs","medium":"Giclée on 350gsm Hahnemühle mould-made paper","signed":true,"imageSizeCm":"","mountSizeCm":"40 x 48.5","framedSizeCm":"","reviewNotes":"Nude figure study - consider audience.","estDurationSec":68,"themes":"After dark","audioUrl":"../audio/just-the-way-it-is.mp3"}},{"productId":"9a04f59e-107f-15c8-6245-d14ad579638e","title":"Love Italia","price":1250,"inStock":false,"ribbon":"Artist Proof","media":"5f58c4_b1dedfc984a24ad3a104ce47d0eff8ee~mv2.jpeg","slug":"love-italia","hasOptions":false,"story":{"_id":"story-9a04f59e-107f-15c8-6245-d14ad579638e","status":"approved","transcript":"Love Italia is Vettriano on holiday.\n\nA couple ride a white scooter. She wears a white dress with a red sash, he wears a blazer, and behind them stands a large red number seven. It is one of his brightest and most carefree images, full of sunshine and holiday romance.\n\nSo much of Vettriano's world happens at night, in smoky bars and dimly lit rooms, under heavy skies. Love Italia is the other side of him: playful, colourful, and unashamedly joyful. The white scooter, the flash of red, the sense of movement: you can almost feel the warm air.\n\nAnd notice the seven. It appears elsewhere in his work too, the lucky number, and here it seems to promise that luck is on this couple's side.\n\nThis is an Artist's Proof, from an edition of one hundred and seventy-five prints with just twenty proofs set aside, signed by Jack Vettriano. Artist's Proofs are prized for their scarcity. It is a compact image, and it brings a burst of Mediterranean light to any room.","edition":"Artist's Proof from an edition of 175 + 20 Artist's Proofs, signed","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":"20 x 25.5","mountSizeCm":"41 x 48.5","framedSizeCm":"","reviewNotes":"","estDurationSec":69,"themes":"Romance, Rare editions","audioUrl":"../audio/love-italia.mp3"}},{"productId":"8f9b8973-a31f-d686-52b7-e23fe81e1715","title":"Mad Dogs","price":950,"inStock":false,"ribbon":"Framed","media":"d9cb8c_4415413e386447cca6505430d205a980~mv2.jpg","slug":"mad-dogs","hasOptions":false,"story":{"_id":"story-8f9b8973-a31f-d686-52b7-e23fe81e1715","status":"approved","transcript":"Mad Dogs is one of the paintings that made Jack Vettriano's name.\n\nHe painted it in 1991, early in his professional career. Fashionably dressed figures with umbrellas stand on a beach, in strong, dramatic light. The title comes from Noël Coward's famous quip, that only mad dogs and Englishmen go out in the midday sun, and the painting shares Coward's wit: people determined to keep up appearances, whatever the weather.\n\nIt is witty, stylish and beautifully composed, everything that made his early beach paintings so loved. Years later, it was chosen for the major retrospective of his work at Kelvingrove Art Gallery and Museum in Glasgow, and it remains one of the images collectors ask us for most often.\n\nThis signed edition is limited to three hundred and fifty prints, with forty Artist's Proofs, each signed and numbered by Jack Vettriano, on Hahnemühle mould-made paper. It is a wonderful way to own a signed version of one of his most celebrated paintings. And it belongs on a bright wall.","edition":"Signed limited edition giclée of 350 + 40 Artist's Proofs","medium":"Giclée on 350gsm Hahnemühle mould-made paper","signed":true,"imageSizeCm":"","mountSizeCm":"40 x 48.5","framedSizeCm":"","reviewNotes":"A separate POA listing exists for signed/AP Mad Dogs (8fce8fa9) - not in this list as it has no price.","estDurationSec":68,"themes":"By the sea","audioUrl":"../audio/mad-dogs.mp3"}},{"productId":"667b4ae6-0803-2adc-8fd5-cc8480831b3e","title":"Man of Mystery","price":610,"inStock":true,"ribbon":"","media":"d9cb8c_d6acf807a2234fa9b75fdf3d82d29de2~mv2.jpg","slug":"man-of-mystery","hasOptions":true,"story":{"_id":"story-667b4ae6-0803-2adc-8fd5-cc8480831b3e","status":"approved","transcript":"Man of Mystery. A woman in a white robe takes a drink from a man's hand.\n\nWe see the gesture, but not the story behind it. And that is exactly the point. The man remains a mystery, to us, and perhaps to her as well. Is this a moment of trust, or of temptation? Vettriano will not tell us.\n\nHe was a master of the half-told story, and this painting rests entirely on a single, charged moment. Everything is in the hands: the glass offered, the glass taken.\n\nThe white of her robe against the darker surroundings gives the picture a strong, clear focus. Your eye goes straight to her, and then to the hand reaching into the frame.\n\nThis is a limited edition of two hundred and fifty giclée prints, each signed and numbered by Jack Vettriano, presented in a generous mount that gives it real presence on the wall. Like all his signed editions, its supply is now fixed. It is a favourite with collectors who love the more intimate, narrative side of his work.","edition":"Signed limited edition giclée of 250","medium":"Giclée","signed":true,"imageSizeCm":"","mountSizeCm":"62.2 x 73","framedSizeCm":"","reviewNotes":"","estDurationSec":71,"themes":"After dark","audioUrl":"../audio/man-of-mystery.mp3"}},{"productId":"83b1e547-40bc-1f9f-241b-8a3566643bff","title":"Master of Ceremonies","price":465,"inStock":true,"ribbon":"","media":"5f58c4_ff0c14e69c21426e97bd68e769980042~mv2.gif","slug":"master-of-ceremonies","hasOptions":true,"story":{"_id":"story-83b1e547-40bc-1f9f-241b-8a3566643bff","status":"approved","transcript":"Master of Ceremonies. The figure who runs the evening.\n\nThe compère. The host. The man who decides when the music starts, and who is introduced to whom. Vettriano was fascinated by social ritual, at the dance hall, the bar, the formal dinner, and the people who orchestrate these occasions have a natural place in his world.\n\nThe title carries his familiar note of theatre, as though this scene were one act in a much longer performance, and we have walked in partway through.\n\nThe painting belongs to the strand of his work that celebrates evening wear, ceremony, and a wonderfully old-fashioned sense of occasion. It is a natural choice for a dining room, or anywhere you entertain, and it sits well with his other dance-hall and nightlife images.\n\nThe edition is just one hundred prints and ten Artist's Proofs, one of the smaller runs among his signed releases, each signed and numbered by Jack Vettriano. It is also one of the most accessible signed Vettriano editions we offer.","edition":"Signed limited edition of 100 + 10 Artist's Proofs","medium":"Giclée","signed":true,"imageSizeCm":"32.3 x 39","mountSizeCm":"60 x 55.3","framedSizeCm":"","reviewNotes":"","estDurationSec":67,"themes":"Style & society","audioUrl":"../audio/master-of-ceremonies.mp3"}},{"productId":"3f71056b-811b-92a9-2813-edbf795db4ae","title":"Model In Westwood","price":560,"inStock":true,"ribbon":"","media":"d9cb8c_50fdec76f0e34a44b2aebeb98fddf767~mv2.jpg","slug":"model-in-westwood","hasOptions":true,"story":{"_id":"story-3f71056b-811b-92a9-2813-edbf795db4ae","status":"approved","transcript":"Model in Westwood brings fashion to the forefront.\n\nClothes were always central to Vettriano's art. The cut of a suit, the line of a dress, the way a stocking or a glove catches the light: in his paintings, what people wear tells you who they are, or who they want to be. Here, the clothes are the subject, and the title names them.\n\nThis painting belongs to his series of studio and model pictures, which explore the relationship between the painter, his sitter, and the costume. The model becomes a figure of style and attitude, posed and aware of being looked at.\n\nIt was published in 2015, one of his later editions, in an edition of two hundred and fifty prints and twenty-five Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper.\n\nIt is one of the most accessible signed editions we offer, and with its stylish subject, it is a wonderful choice for a bedroom, a dressing room, or a study.","edition":"Signed limited edition giclée of 250 + 25 Artist's Proofs, published 2015","medium":"Giclée on 300gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":"41 x 49","framedSizeCm":"62.7 x 72.7","reviewNotes":"","estDurationSec":66,"themes":"Style & society","audioUrl":"../audio/model-in-westwood.mp3"}},{"productId":"7e368157-4957-88d1-3f93-666715d69add","title":"Morning News","price":1250,"inStock":false,"ribbon":"","media":"d9cb8c_ab2342c0409e4f15b0167e71d7db2ece~mv2.jpg","slug":"morning-news","hasOptions":false,"story":{"_id":"story-7e368157-4957-88d1-3f93-666715d69add","status":"approved","transcript":"Morning News. A woman in a blue dress reads the morning paper at an outdoor café table, a classic car parked beside her.\n\nIt is a picture of pure, unhurried pleasure. Coffee, the newspaper, the morning sun, and a beautiful car waiting at the kerb. If so many of Vettriano's paintings are about the drama of the night, this one is about the calm of the morning after, when there is nowhere to be and nothing to hurry for.\n\nAnd yet, he is Vettriano. We cannot help wondering what she is reading, whose car it is, and whether the news on the page has anything to do with her.\n\nMorning News was first shown in 2010, in Days of Wine and Roses, the exhibition at Kirkcaldy Museum and Art Gallery. That was the gallery where, as a young man, he had taught himself to paint. The original painting has since sold.\n\nThis limited edition giclée was published in 2012, each print signed and numbered by Jack Vettriano.","edition":"Signed limited edition giclée, published 2012","medium":"Giclée","signed":true,"imageSizeCm":"35.6 x 27.9","mountSizeCm":"","framedSizeCm":"","reviewNotes":"Edition size not in product copy - add for provenance panel.","estDurationSec":67,"themes":"Style & society, Quiet moments","audioUrl":"../audio/morning-news.mp3"}},{"productId":"592c3959-942c-7952-4c3c-76266258f6d7","title":"Narcissistic Bathers","price":660,"inStock":true,"ribbon":"","media":"5f58c4_75fab7a521ab43908efb49d8026c0eb0~mv2.jpg","slug":"narcissistic-bathers","hasOptions":true,"story":{"_id":"story-592c3959-942c-7952-4c3c-76266258f6d7","status":"approved","transcript":"Narcissistic Bathers is one of the most significant Vettriano releases of recent years, and not only because of the image.\n\nIt belongs to a small group of previously unreleased editions that Jack Vettriano signed by hand before his death in March 2025. That makes it one of the very last editions anywhere to carry his original pencil signature. When it was released in September 2026, there was never any doubt that collectors would take notice.\n\nThe title is pure Vettriano: knowing, a little provocative, suggesting figures more absorbed in themselves, and in how they look, than in anything around them. Bathers by the sea are one of the oldest subjects in painting. Vettriano brings his own theatrical, cinematic sense of style to it, and turns a simple seaside scene into something charged with self-regard and quiet drama.\n\nThe edition is limited to one hundred and twenty-five prints and fifteen Artist's Proofs, each signed and numbered. Signed editions released after an artist's death are rare by definition. There will be no more of them.","edition":"Signed limited edition of 125 + 15 Artist's Proofs (hand-signed before March 2025, released Sept 2026)","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":"38 x 31","mountSizeCm":"61 x 52","framedSizeCm":"71.8 x 62.8","reviewNotes":"Cannot ship to EU or Northern Ireland (GPSR) - director should check collector location.","estDurationSec":69,"themes":"By the sea, Final editions","audioUrl":"../audio/narcissistic-bathers.mp3"}},{"productId":"e67c8c86-4494-ad8c-c1cb-5a410b5c8130","title":"Night Calls","price":560,"inStock":true,"ribbon":"","media":"d9cb8c_010e947063a34593b1bc1db6e2657cb2~mv2.png","slug":"night-calls","hasOptions":true,"story":{"_id":"story-e67c8c86-4494-ad8c-c1cb-5a410b5c8130","status":"approved","transcript":"Night Calls belongs to the after-dark side of Vettriano's work.\n\nThe telephone. The late hour. The closed door. Together, they set the scene for something private. The title alone suggests a call that should not be made, or an arrangement made under cover of night.\n\nThese interiors are where his love of film noir shows most clearly: the low light, the strong sense of mood, and a story told through glances and gestures rather than spelled out. He gives us the atmosphere, and lets us write the plot.\n\nIt is a picture for the collector who prefers the darker, more cinematic strand of his work to the sunlit beaches, and it brings real atmosphere to a wall.\n\nThe edition is just one hundred prints and ten Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper. An edition of one hundred is small by the standards of his published prints, and now that no new signed editions can be made, the supply is fixed. If you are looking for something rarer still, we also hold an Artist's Proof of this same image.","edition":"Signed limited edition of 100 + 10 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":"39 x 31.5","mountSizeCm":"62 x 53.5","framedSizeCm":"73 x 64.5","reviewNotes":"","estDurationSec":74,"themes":"After dark","audioUrl":"../audio/night-calls.mp3"}},{"productId":"119a373c-23b7-06af-3613-192d5db80225","title":"Night Geometry","price":1650,"inStock":true,"ribbon":"","media":"d9cb8c_f83c6aca56b24f4db858675b42a8ee37~mv2.jpg","slug":"night-geometry","hasOptions":false,"story":{"_id":"story-119a373c-23b7-06af-3613-192d5db80225","status":"approved","transcript":"Night Geometry is one of Vettriano's most cinematic compositions.\n\nA couple embrace beside a window at night. And the title asks us to notice something we might otherwise only feel: how carefully the whole picture has been built. The lines of the window, the angles of the two bodies, the play of light and shadow, all fit together like a film set, lit and framed for a single shot.\n\nVettriano often spoke of the influence of film noir on his work, and here the debt is plain to see. This is a love scene composed like a frame from a black-and-white thriller, but in his own rich colour.\n\nIt captures a private moment, set against the city outside, a theme that runs through his night-time interiors: two people, and the whole world held at bay beyond the glass. The mood is sophisticated and urban, and it suits a living room or a bedroom.\n\nEach print in the edition is signed and numbered by Jack Vettriano, and like all his signed editions, the supply is now fixed. We can tell you the edition number of the example we hold.","edition":"Signed and numbered limited edition (example-specific)","medium":"Giclée","signed":true,"imageSizeCm":"","mountSizeCm":"","framedSizeCm":"","reviewNotes":"Product copy says 'Price on application' but the listing is priced at GBP 1,650 - Studio to reconcile. Edition number/size of the held example needed for provenance panel.","estDurationSec":75,"themes":"After dark, Romance","audioUrl":"../audio/night-geometry.mp3"}},{"productId":"ef7cc510-0dab-e2a7-caad-07113ec75267","title":"Night In The City","price":1450,"inStock":true,"ribbon":"Framed","media":"d9cb8c_4c32b6d5143d44e6a5a0ed843f885d24~mv2.jpg","slug":"night-in-the-city","hasOptions":false,"story":{"_id":"story-ef7cc510-0dab-e2a7-caad-07113ec75267","status":"approved","transcript":"Night in the City. A couple in a room high above the city, the lights of the streets spread out beyond the window.\n\nIt is one of Vettriano's most atmospheric urban paintings, and it combines two things he did brilliantly: the intimacy of a private room, and the scale and glamour of the city at night.\n\nThe view is part of the story. It reminds us of the world this couple have shut out, or the life they have stepped away from, just for this evening. Down there are the streets, the traffic, everyone else. Up here, there are only the two of them.\n\nThe painting has the polished, cinematic quality of his finest night scenes, and its moody palette makes it a striking presence in a living room, a bedroom or a study.\n\nIt was published in 2006 as a limited edition giclée, each print signed and numbered by Jack Vettriano. The image is a generous size, which suits the panoramic feel of the composition, and this example is framed. Twenty years on, the edition is well established, and good examples are increasingly sought after.","edition":"Signed limited edition giclée, published 2006","medium":"Giclée","signed":true,"imageSizeCm":"51 x 40.5","mountSizeCm":"","framedSizeCm":"","reviewNotes":"Edition size not in product copy - add for provenance panel.","estDurationSec":74,"themes":"After dark, Romance","audioUrl":"../audio/night-in-the-city.mp3"}},{"productId":"b0afab77-2ad4-3ad3-abd9-59ddd1593e83","title":"Queen of the Waltzers","price":535,"inStock":true,"ribbon":"","media":"5f58c4_55c1e37592944c458d17c1471d5eaa7f~mv2.jpg","slug":"queen-of-the-waltzers","hasOptions":true,"story":{"_id":"story-b0afab77-2ad4-3ad3-abd9-59ddd1593e83","status":"approved","transcript":"Queen of the Waltzers. It is one of Vettriano's most evocative titles.\n\nThe Waltzers is the classic fairground ride: spinning cars, loud music, coloured lights. And the title conjures the young woman who rules it, the one everyone notices as the cars whirl past.\n\nIt is a title rooted in the working-class Scotland Vettriano came from, where the dance hall and the fair were where people went to see, and to be seen. He often said that his paintings drew on memory, and on the social world of his youth in Fife, and titles like this carry that sense of time and place.\n\nThere is warmth in this picture, and more than a hint of nostalgia. For anyone who remembers the fair coming to town, it will strike a chord.\n\nThe edition is one hundred and twenty-five prints and fifteen Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper. It is a compact image, easy to place in almost any room, and one of the most approachable signed editions in our collection.","edition":"Signed limited edition of 125 + 15 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":"20.6 x 25","mountSizeCm":"42.6 x 49","framedSizeCm":"53 x 59.4","reviewNotes":"","estDurationSec":70,"themes":"Style & society","audioUrl":"../audio/queen-of-the-waltzers.mp3"}},{"productId":"368a3d1b-b3e4-1a93-bd0c-11bb58b3ea4a","title":"Scorched","price":1150,"inStock":false,"ribbon":"Artist Proof","media":"d9cb8c_9470a57e16df4e17b2c48739db3f9737~mv2.jpg","slug":"scorched","hasOptions":false,"story":{"_id":"story-368a3d1b-b3e4-1a93-bd0c-11bb58b3ea4a","status":"approved","transcript":"Scorched. A woman in a black swimsuit lies stretched out on the sand, under a hot sky.\n\nIt is one of Vettriano's simplest beach images, and one of his most striking. There is no second figure, no story to untangle, no umbrella or dance partner. Just a single figure, the sand, and the heat. And the title, one word, tells you exactly how that sun feels.\n\nHe grew up on the Fife coast, and the beach was his great stage. Here, he strips that stage right back to its essentials, and the result is bold, graphic, and utterly confident.\n\nThe original oil was painted in 2012, and it was chosen for Jack Vettriano: A Retrospective, at Kelvingrove Art Gallery and Museum in Glasgow, in 2013 and 2014. The original has since sold.\n\nThis print is an Artist's Proof, from an edition of two hundred and fifty prints, published in 2013, with just twenty-five proofs. It is signed by Jack Vettriano, and printed on heavyweight museum etching paper.","edition":"Artist's Proof from a signed edition of 250 + 25 Artist's Proofs, published 2013","medium":"Giclée on 350gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":"46.8 x 42.8","framedSizeCm":"","reviewNotes":"","estDurationSec":67,"themes":"By the sea, Rare editions","audioUrl":"../audio/scorched.mp3"}},{"productId":"77c9e91e-6db4-4241-c6f5-90a9093257cb","title":"Summer Days Triptych","price":125,"inStock":true,"ribbon":"","media":"5f58c4_99cc3daa2d474c3ab1bfab43a030deb4~mv2.jpg","slug":"summer-days-triptych","hasOptions":true,"story":{"_id":"story-77c9e91e-6db4-4241-c6f5-90a9093257cb","status":"approved","transcript":"The Summer Days Triptych brings together three of Vettriano's early beach paintings: Green and Blue, Pink and Saffron, and Trailing Toes, all painted in 1993.\n\nEach shows women by the sea in summer dresses, walking or resting on the sand, parasols raised against the sun. Together they make one of his most relaxed and joyful groups of work, closer in mood to a sunny afternoon than to the noir tension of his interiors.\n\nThey were painted in the early nineteen-nineties, as his reputation was growing fast, and they show his early fascination with colour, with costume, and with the shoreline as a stage. The dresses give the series its palette, and the titles take their names straight from those colours. Seen side by side, the three images read like scenes from the same long summer's day.\n\nThe triptych has been released as a Special Open Edition, three high-quality giclées on museum etching paper. Framed identically and hung in a row, as a triptych is meant to be seen, they make a wonderful first Vettriano, a lovely gift, or the heart of a summer room.","edition":"Special Open Edition set of three giclées (unsigned, unnumbered)","medium":"Giclée on 300gsm museum etching paper (x3)","signed":false,"imageSizeCm":"25.5 x 21","mountSizeCm":"","framedSizeCm":"","reviewNotes":"Open edition, no COA listed - script avoids implying signature or limitation. View-in-room should show three panels side by side.","estDurationSec":74,"themes":"By the sea","audioUrl":"../audio/summer-days-triptych.mp3"}},{"productId":"add3fd82-1318-149d-ba4a-9a175a326907","title":"The Billy Boys","price":765,"inStock":true,"ribbon":"Artist Proof Available","media":"5f58c4_19f3f740afce4661bc8030d094fee24f~mv2.jpeg","slug":"the-billy-boys","hasOptions":true,"story":{"_id":"story-add3fd82-1318-149d-ba4a-9a175a326907","status":"approved","transcript":"The Billy Boys. A short, punchy title, the kind Vettriano favoured when he wanted us to bring our own story to the picture.\n\nHis work is full of figures who carry themselves with style and swagger. Sharp suits, a certain set of the shoulders, the confidence of men who know they are being watched. Titles like this one add a harder, more down-to-earth edge to the elegance he is famous for. These are not drawing-room gentlemen. They are the lads from the dance hall, dressed up for the night.\n\nIt is one of the larger signed prints on paper in our collection, with real presence on a wall. It works as a single statement piece in a living room, a study or a hallway, or alongside his other larger signed editions.\n\nThe edition is two hundred and seventy-five prints and thirty Artist's Proofs, each signed and numbered by Jack Vettriano, on heavyweight museum etching paper, and an Artist's Proof is available for the collector who wants the rarer example.","edition":"Signed limited edition of 275 + 30 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":"40.6 x 50.8","mountSizeCm":"63.7 x 71.8","framedSizeCm":"74.3 x 82.4","reviewNotes":"Product copy has little on the painting itself - Studio may want to add a line from the blog post.","estDurationSec":68,"themes":"Style & society","audioUrl":"../audio/the-billy-boys.mp3"}},{"productId":"015d1a01-b566-9aa7-1d0a-c067ba3d5b67","title":"The Blue Gown","price":560,"inStock":true,"ribbon":"","media":"5f58c4_c1d01f6e87ad4c7e84a62a733029981d~mv2.jpg","slug":"the-blue-gown-1","hasOptions":true,"story":{"_id":"story-015d1a01-b566-9aa7-1d0a-c067ba3d5b67","status":"approved","transcript":"The Blue Gown is one of Vettriano's most intimate compositions.\n\nA woman stands before a mirror, holding a blue gown. She is caught in a private moment of choosing, or perhaps of deciding whether to go out at all. The rich blue of the dress against the darker tones of the room gives the picture its focus, and the mirror adds the layer of looking, and of being looked at, that runs through so much of his work.\n\nVettriano returned again and again to the dressing room and the boudoir, where his figures prepare for an evening whose outcome we never see. These pictures are less about glamour than about anticipation. The Blue Gown is one of the finest examples, and it has become one of the most popular images in our collection.\n\nThe edition is one hundred and twenty-five prints and fifteen Artist's Proofs, each signed and numbered by Jack Vettriano. It is a generous size for a living room or bedroom wall, without overpowering the space, and it can be supplied framed by the publisher. As a first Vettriano, or as an addition to an established collection, it is a beautiful choice.","edition":"Signed limited edition of 125 + 15 Artist's Proofs","medium":"Giclée","signed":true,"imageSizeCm":"39 x 31","mountSizeCm":"61.5 x 52","framedSizeCm":"71.7 x 62.4","reviewNotes":"See note on the framed Blue Gown listing about differing descriptions.","estDurationSec":78,"themes":"Quiet moments, Style & society","audioUrl":"../audio/the-blue-gown-1.mp3"}},{"productId":"d2bec85f-f3a5-f0c6-3c79-d923258b03cd","title":"The Blue Gown (framed)","price":850,"inStock":false,"ribbon":"Framed","media":"5f58c4_df27f3dad3f041aa90200d4be86e378a~mv2.jpeg","slug":"the-blue-gown","hasOptions":false,"story":{"_id":"story-d2bec85f-f3a5-f0c6-3c79-d923258b03cd","status":"approved","transcript":"The Blue Gown. A woman in a blue ball gown before a mirror, studying herself, before the evening ahead.\n\nIt is a private, expectant moment, and Vettriano paints it in his richest, most cinematic light. The deep blue of the gown glows against the darker room, and the mirror adds the layer of looking, and of being looked at, that runs through so much of his work.\n\nHe returned often to the dressing room, where his figures prepare for an evening whose outcome we never see. These pictures are less about glamour than about anticipation: the breath held before the door opens. The Blue Gown is one of the finest of them, and one of the most popular images in our collection.\n\nThe edition is one hundred and twenty-five prints and fifteen Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper. This example comes framed, ready for a bedroom or a dressing-room wall.","edition":"Signed limited edition of 125 + 15 Artist's Proofs, framed","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":"37.5 x 31","mountSizeCm":"69.5 x 52","framedSizeCm":"","reviewNotes":"The two Blue Gown listings describe the composition differently (back to viewer at mirror vs holding gown before mirror) and give slightly different sizes - Studio to confirm before recording.","estDurationSec":63,"themes":"Quiet moments, Style & society","audioUrl":"../audio/the-blue-gown.mp3"}},{"productId":"a6b2c741-0dbb-a817-052a-f1f70053af3b","title":"The Contemplation Series","price":1685,"inStock":false,"ribbon":"","media":"d9cb8c_49eccc559f914397b8a59f919fb84ce3~mv2.jpg","slug":"the-contemplation-series","hasOptions":false,"story":{"_id":"story-a6b2c741-0dbb-a817-052a-f1f70053af3b","status":"approved","transcript":"The Contemplation Series is not one print, but five, and together they tell you a great deal about the later Vettriano.\n\nThe set brings together Baby, Bye Bye; Black on Blonde; Edinburgh Afternoon; Model in Westwood; and The Very Thought of You. All five were published for the first time as signed limited editions in 2015, and as the name suggests, they share a mood: atmospheric, reflective, and quietly thought-provoking.\n\nThese are not his dramatic noir scenes. They are moments of pause. A woman at a window after a farewell. A study in black against fair hair. An afternoon in Edinburgh. A model, posed and aware of being looked at. And a title borrowed from a love song. Hung together, they read like five chapters from the same novel.\n\nWhat makes this set special for a collector is that the five prints come with matching edition numbers. Each is signed and numbered by Jack Vettriano, from an edition of two hundred and fifty, on Hahnemühle museum etching paper. A matched set like this is far harder to assemble than five individual prints, and it makes a remarkable wall.","edition":"Set of five signed giclées with matching edition numbers, edition of 250 + 25 Artist's Proofs, published 2015","medium":"Giclée on 300gsm Hahnemühle museum etching paper (x5)","signed":true,"imageSizeCm":"31 x 39","mountSizeCm":"41 x 49","framedSizeCm":"","reviewNotes":"Five-piece set - view-in-room should show five sheets.","estDurationSec":75,"themes":"Quiet moments","audioUrl":"../audio/the-contemplation-series.mp3"}},{"productId":"8b4517a2-0a5a-84b2-fec5-f62d4389857b","title":"The Devoted Dressmaker","price":625,"inStock":true,"ribbon":"Framed","media":"d9cb8c_03e2bf6a115944a09c07a54fd0948124~mv2.jpg","slug":"the-devoted-dressmaker","hasOptions":false,"story":{"_id":"story-8b4517a2-0a5a-84b2-fec5-f62d4389857b","status":"approved","transcript":"The Devoted Dressmaker turns to a figure who stands behind the scenes of so much of Vettriano's work.\n\nHis paintings are full of beautiful clothes, from evening gowns to tailored suits. And the dressmaker is the person who makes all of that glamour possible. The title is affectionate, and a little mysterious. Devoted to her craft? Or devoted to the person she is dressing?\n\nClothing was never just decoration for Vettriano. The cut of a dress, a stocking seam, a pair of gloves: these tell us who his characters are, and what they want. This painting puts that lifelong fascination with dress right at its centre.\n\nIt was released on the twenty-third of November 2018, one of the later editions published in his lifetime, as a signed limited edition of one hundred and twenty-five prints and fifteen Artist's Proofs, each signed and numbered by Jack Vettriano.\n\nIt is a small, intimate image, on museum etching paper, and this example comes framed. It belongs in a bedroom, a dressing room, or a study, and it brings a more recent image to any collection.","edition":"Signed limited edition of 125 + 15 Artist's Proofs, released 23 November 2018","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":"20.5 x 25.5","mountSizeCm":"41.5 x 48","framedSizeCm":"","reviewNotes":"Product copy says 'Price on application' but listing is priced at GBP 625 - Studio to reconcile.","estDurationSec":73,"themes":"Style & society","audioUrl":"../audio/the-devoted-dressmaker.mp3"}},{"productId":"6fc5b2cb-7077-bb23-6eca-6d47dc0c21eb","title":"The Last Great Romantic","price":445,"inStock":false,"ribbon":"","media":"5f58c4_180e70410c9144689b0b1a2239089013~mv2.jpeg","slug":"the-last-great-romantic","hasOptions":true,"story":{"_id":"story-6fc5b2cb-7077-bb23-6eca-6d47dc0c21eb","status":"approved","transcript":"The Last Great Romantic. A man in a fedora kisses a woman in a yellow dress, in a doorway by the sea.\n\nIf you had to choose a single picture to sum up the mood of Vettriano's work, you could do far worse than this. The style: the hat, the dress, the sea beyond. The longing. And a kiss that feels like the final scene of a film, the moment before the credits roll.\n\nThe title could describe the man in the painting. Some would say it describes the painter, too. Vettriano spent a career painting romance, never quite innocent and never quite simple, and always with a sense that it might be the last of its kind.\n\nThe yellow dress is a beautiful touch, a burst of warmth against the doorway and the sea, drawing the eye straight to the embrace.\n\nThe edition is small, one hundred and fifteen prints and fifteen Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper. It is a lovely, intimate size, and it makes a perfect gift for the romantic in your life.","edition":"Signed limited edition of 115 + 15 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":"30.5 x 25.5","mountSizeCm":"53.5 x 46.5","framedSizeCm":"","reviewNotes":"","estDurationSec":74,"themes":"Romance, By the sea","audioUrl":"../audio/the-last-great-romantic.mp3"}},{"productId":"0d4dfd33-07f0-70a1-1635-96e4fe3d98de","title":"The Letter","price":2950,"inStock":false,"ribbon":"Premium Limited Edition","media":"5f58c4_f5f12947ce9d438a8cf70dd26c7fc6bc~mv2_d_1920_1519_s_2.jpg","slug":"the-letter","hasOptions":false,"story":{"_id":"story-0d4dfd33-07f0-70a1-1635-96e4fe3d98de","status":"approved","transcript":"The Letter. A woman lies on a chaise longue in a quiet room. Beside her, on the floor, a letter has fallen.\n\nWhat did it say? Was it the letter she had been waiting for, or the one she had dreaded? Has she read it and let it fall, or is she not yet ready to pick it up? Vettriano gives us every clue except the one that matters, and that is exactly why the picture stays with you.\n\nIt is a scene of complete stillness, and yet something has clearly just happened. That was his particular gift: the quiet room in the moments after the drama.\n\nThe Letter was chosen for a premium signed edition celebrating Jack Vettriano's greatest works, released on the thirteenth of September 2019. It is reproduced at the full size of the original painting, thirty by twenty-four inches, board mounted and finished by hand with three coats of lacquer for a satin surface. It arrives in the same style of frame used for his original work, with no border and no glass.\n\nThe edition is tiny: just fifty, plus five Artist's Proofs, each signed and numbered by Vettriano in silver pen.","edition":"Premium limited edition of 50 + 5 Artist's Proofs, original size (30 x 24 in), signed in silver pen, released 13 Sept 2019","medium":"Giclée, board mounted, hand-embellished with 3 coats of lacquer, no glass","signed":true,"imageSizeCm":"76.2 x 61","mountSizeCm":"","framedSizeCm":"83 x 98","reviewNotes":"Framed size (83 x 98) reads portrait while image size (30 x 24) reads landscape-ambiguous - confirm orientation for view-in-room.","estDurationSec":78,"themes":"Quiet moments, Rare editions","audioUrl":"../audio/the-letter.mp3"}},{"productId":"10a47393-e4b1-4471-4ae6-59b3f27645f6","title":"The Look Of Love","price":850,"inStock":true,"ribbon":"","media":"d9cb8c_3cef4be386e847fbac35b0cca69a3beb~mv2.jpg","slug":"the-look-of-love","hasOptions":true,"story":{"_id":"story-10a47393-e4b1-4471-4ae6-59b3f27645f6","status":"approved","transcript":"The Look of Love takes its title from the Burt Bacharach song, made famous by Dusty Springfield, and it shares that song's mood exactly: longing, and romance, and a little ache.\n\nVettriano often found his titles in the music of the nineteen-fifties and sixties. They give his paintings a nostalgic, cinematic quality, as though each one had its own soundtrack. Here, the title asks us to read every glance and every gesture as a sign of love: love given, or love withheld.\n\nPlay the song in your head as you look, and the picture comes alive in a different way.\n\nIt is one of the larger signed prints on paper in our collection, with real presence, and it belongs in a living room or a bedroom, where it can be enjoyed every day.\n\nThe Look of Love was published in 2010 as a limited edition giclée of two hundred and fifty prints, plus twenty-five Artist's Proofs, each signed and numbered by Jack Vettriano, on heavyweight museum etching paper.","edition":"Signed limited edition giclée of 250 + 25 Artist's Proofs, published 2010","medium":"Giclée on 350gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":"64 x 54.5","framedSizeCm":"","reviewNotes":"","estDurationSec":67,"themes":"Romance","audioUrl":"../audio/the-look-of-love.mp3"}},{"productId":"0a7b5641-6bc2-6654-605d-1ee7fc46b7d3","title":"The Runaways","price":535,"inStock":true,"ribbon":"Artist Proof Available","media":"5f58c4_df575f96926145418a46d4de108138db~mv2.jpg","slug":"the-runaways","hasOptions":true,"story":{"_id":"story-0a7b5641-6bc2-6654-605d-1ee7fc46b7d3","status":"approved","transcript":"The Runaways. A title full of escape.\n\nVettriano's paintings are crowded with people caught between one life and another. Arriving at a hotel. Leaving a party. Slipping away together from somewhere they really ought to be. This title gives the image that same feeling, of a story already well under way, and of two people who have chosen each other over everything else.\n\nWhere are they running from? And will anyone come after them? As ever, he leaves the ending to us.\n\nIt is a compact image, which makes it one of the easiest Vettriano prints to place: on a narrow wall, a landing, a hallway, or as part of a group with his other small-format editions.\n\nThe edition is one hundred and seventy-five prints and twenty Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper, and an Artist's Proof is available. Smaller signed editions like this are often where collectors begin, and they remain a lovely way to add another Vettriano story to a growing collection.","edition":"Signed limited edition of 175 + 20 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":"21 x 25.5","mountSizeCm":"42 x 48.5","framedSizeCm":"52.6 x 59.1","reviewNotes":"","estDurationSec":68,"themes":"Romance","audioUrl":"../audio/the-runaways.mp3"}},{"productId":"551c0ac5-2f75-32a2-4ce7-b02f856223f6","title":"The Sailor's Toy","price":535,"inStock":true,"ribbon":"","media":"5f58c4_fbb003e6cfb04dbfb11a9d44d1794f9d~mv2.png","slug":"the-sailor-s-toy","hasOptions":true,"story":{"_id":"story-551c0ac5-2f75-32a2-4ce7-b02f856223f6","status":"approved","transcript":"The Sailor's Toy is one of the newest images in the Vettriano canon, published after the artist's death in March 2025 as an official posthumous edition.\n\nListen to the title for a moment. It has that wry, double-edged quality Vettriano loved: a hint of a story between two people, and no promise about who is playing with whom. That is how his best work operates. A single moment, staged as carefully as a film still, where the clothes, the setting and the body language suggest far more than they ever show.\n\nBecause the artist can no longer sign, each print in this edition of just one hundred is numbered and embossed with the official stamp of the Estate of Jack Vettriano. That stamp, with the edition number and the certificate of authenticity, records exactly where your print sits in the run.\n\nIt is a smaller, intimate format, printed on heavy museum etching paper, and it rewards being seen up close: a study, a hallway, a bedroom wall. And for a collector already building a Vettriano wall, it is a quiet way to add one of the very last images to be released.","edition":"Posthumous limited edition of 100, numbered and embossed with the Estate stamp","medium":"300gsm museum etching paper","signed":false,"imageSizeCm":"25.5 x 20.4","mountSizeCm":"48 x 42.4","framedSizeCm":"58.4 x 52.8","reviewNotes":"","estDurationSec":77,"themes":"Final editions","audioUrl":"../audio/the-sailor-s-toy.mp3"}},{"productId":"43c31f09-d23a-1ff1-4363-b5df66a06876","title":"The Sparrow And The Hawk","price":765,"inStock":true,"ribbon":"","media":"d9cb8c_671ab01dcc4244fa857920f64c033375~mv2.jpg","slug":"the-sparrow-and-the-hawk","hasOptions":true,"story":{"_id":"story-43c31f09-d23a-1ff1-4363-b5df66a06876","status":"approved","transcript":"The Sparrow and the Hawk is one of Vettriano's most theatrical paintings.\n\nA masked man and a woman, in a richly furnished room, beside a desk and a classical bust. The title casts them as predator and prey. But look again, and it is not at all clear which of them is which.\n\nMasks, disguise and role-play run all through his later work, and this is one of the most memorable examples. It has the feel of a scene from a period drama, or a masquerade, where everyone is playing a part, and the real game is happening beneath the costume.\n\nThe setting is sumptuous, and the sense of narrative is strong, which makes it a natural focal point. It belongs in a living room, a library, or a dining room: anywhere a painting with a story can hold its own, and start a conversation.\n\nIt was published in 2013, in an edition of two hundred and fifty prints and twenty-five Artist's Proofs, each signed and numbered by Jack Vettriano, on a heavier museum etching paper than many of his editions. With its generous mount, it has considerable presence on the wall.","edition":"Signed limited edition giclée of 250 + 25 Artist's Proofs, published 2013","medium":"Giclée on 350gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":"84.5 x 73.7","framedSizeCm":"95.1 x 84.3","reviewNotes":"","estDurationSec":77,"themes":"After dark","audioUrl":"../audio/the-sparrow-and-the-hawk.mp3"}},{"productId":"343c13e9-3175-bc44-820a-e806954c3769","title":"The Tuiga Collection","price":1500,"inStock":false,"ribbon":"","media":"d9cb8c_c017248f26144dbc90c43b8df94e523d~mv2.jpg","slug":"the-tuiga-collection","hasOptions":false,"story":{"_id":"story-343c13e9-3175-bc44-820a-e806954c3769","status":"approved","transcript":"The Tuiga Collection takes us to Monaco, and to the sea.\n\nIn 2009, Vettriano held an exhibition at the Monaco Yacht Club called Homage à Tuiga. It was inspired by the centenary of the club's world-famous yacht, Tuiga. This set of four prints brings together images from that exhibition: Below Deck; Masthead; Ship of Dreams; and Sunshine and Champagne.\n\nIt is a side of Vettriano many people do not know. Instead of Scottish beaches and smoky bars, here is the glamour of the Riviera, classic sailing, and long, sunlit days on the water. And yet the titles are pure Vettriano: Ship of Dreams, Sunshine and Champagne. There is romance on board, as there always is in his world.\n\nFor a collector, the set has real rarity. It is limited to just seventy-five, plus seven Artist's Proofs, each print signed by Jack Vettriano, and published in 2009.\n\nFramed together, the four make a beautiful group, perfect for a study, a coastal home, or for anyone who loves the sea.","edition":"Set of four signed giclées, edition of 75 + 7 Artist's Proofs, published 2009","medium":"Giclée (x4)","signed":true,"imageSizeCm":"28.7 x 24","mountSizeCm":"50 x 40","framedSizeCm":"55 x 45","reviewNotes":"Four-piece set - view-in-room should show four frames.","estDurationSec":67,"themes":"By the sea","audioUrl":"../audio/the-tuiga-collection.mp3"}},{"productId":"f343f2b8-1f83-72df-6394-d9793dd261c7","title":"The Very Thought of You","price":560,"inStock":true,"ribbon":"","media":"d9cb8c_0781c741aecf40118504a651358e8316~mv2.jpg","slug":"the-very-thought-of-you","hasOptions":true,"story":{"_id":"story-f343f2b8-1f83-72df-6394-d9793dd261c7","status":"approved","transcript":"The Very Thought of You takes its title from the 1934 Ray Noble song, later recorded by Nat King Cole and so many others.\n\nIt is a song about being utterly consumed by thoughts of someone, and Vettriano's painting carries that same dreamy, romantic mood. His love of the great popular standards runs right through his titles. It is as if each painting comes with its own soundtrack, and here you can almost hear it playing.\n\nPublished in 2015, this is one of his later editions, from a period when his work often became more intimate and gentle. It is a natural fit for a bedroom or a sitting room, and it makes a beautiful gift for someone you think of in just that way.\n\nThe edition is two hundred and fifty prints and twenty-five Artist's Proofs, each signed and numbered by Jack Vettriano, printed on heavy museum etching paper. It is one of the most accessible signed editions in our collection.","edition":"Signed limited edition giclée of 250 + 25 Artist's Proofs, published 2015","medium":"Giclée on 300gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":"41 x 49","framedSizeCm":"62.7 x 72.7","reviewNotes":"","estDurationSec":65,"themes":"Romance","audioUrl":"../audio/the-very-thought-of-you.mp3"}},{"productId":"5c84030c-4049-7b96-b391-5e2bff25120c","title":"The Weight","price":950,"inStock":false,"ribbon":"","media":"d9cb8c_90c6b434ee1c4cf5a29bb0ba16a561cf~mv2.jpg","slug":"the-weight","hasOptions":true,"story":{"_id":"story-5c84030c-4049-7b96-b391-5e2bff25120c","status":"approved","transcript":"The Weight is a self-portrait, and it is one of the most personal paintings Jack Vettriano ever made.\n\nThe artist sits on the edge of a bed in his waistcoat, head bowed, as if carrying something heavy. There is no glamour here, no dance floor, no seduction. Only a man alone with his thoughts. For a painter so often associated with the stylish surfaces of other people's lives, it is a remarkably honest image of his own.\n\nThe painting was shown in his exhibition Days of Wine and Roses in 2010, and the original is now on long-term display at the Scottish National Portrait Gallery in Edinburgh. That is a rare honour, and it tells you how seriously this picture is regarded.\n\nThis edition was published in 2010: two hundred and fifty prints and twenty-five Artist's Proofs, each signed and numbered by the artist. For a collector who wants to understand the man behind the paintings, there is no more revealing image.","edition":"Signed limited edition giclée of 250 + 25 Artist's Proofs, published 2010","medium":"Giclée on 350gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":"41.5 x 49","framedSizeCm":"","reviewNotes":"","estDurationSec":65,"themes":"Portraits","audioUrl":"../audio/the-weight.mp3"}},{"productId":"1a8307f9-8f0b-d118-731f-6bb8d4385f17","title":"Waltzers","price":300,"inStock":false,"ribbon":"","media":"d9cb8c_ca0b7269784648a2aa11428f3ac3996a~mv2.jpg","slug":"waltzers","hasOptions":true,"story":{"_id":"story-1a8307f9-8f0b-d118-731f-6bb8d4385f17","status":"approved","transcript":"Waltzers. Couples dance beneath the trees on a summer night, the women in pale evening gowns, the men in dark suits.\n\nThis is one of Vettriano's most romantic outdoor scenes, all movement and starlight. Dancing runs right through his work. He painted it on beaches, in ballrooms and in quiet rooms, and it stood, for him, for a kind of elegance and courtship that belongs to another era.\n\nHere, the contrast does the work: pale gowns against dark suits, figures turning against the night. You can almost feel the warmth of the evening and hear the music drifting between the trees.\n\nThe edition was published in 2014: three hundred and fifty prints and thirty-five Artist's Proofs, each signed and numbered by Jack Vettriano. It is a compact, joyful image, and a lovely way to bring some of that summer-night romance into a home.","edition":"Signed limited edition giclée of 350 + 35 Artist's Proofs, published 2014","medium":"Giclée on 300gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":"34.3 x 41","framedSizeCm":"","reviewNotes":"","estDurationSec":57,"themes":"Romance","audioUrl":"../audio/waltzers.mp3"}},{"productId":"1be66a27-fa93-4a54-eef3-87f10a625ca1","title":"Wicked Games","price":895,"inStock":true,"ribbon":"","media":"5f58c4_0a2d3bbe8fd64c8cb90652076d40cedc~mv2.jpg","slug":"wicked-games","hasOptions":true,"story":{"_id":"story-1be66a27-fa93-4a54-eef3-87f10a625ca1","status":"approved","transcript":"Wicked Games was published in November 2020, and it is one of the later signed editions released in Vettriano's lifetime.\n\nThe title, borrowed from the language of pop songs and film, sets up exactly the kind of story he loved to tell: a game of attraction and power between two people, played by rules only they understand. We are not told who is winning. That is left, as always, to us.\n\nHis later work kept the cinematic glamour of his earlier paintings, but it often became more intimate and pared back, and you can feel that here. It is a stylish, compact image, at home in a bedroom, a dressing room or a study.\n\nThe edition is small: just one hundred prints and ten Artist's Proofs, each signed and numbered by Jack Vettriano. That makes it relatively scarce. And for a collection weighted towards his better-known images of the 1990s, it adds real range: a glimpse of the artist in his final years.","edition":"Signed limited edition giclée of 100 + 10 Artist's Proofs, published 27 November 2020","medium":"Giclée on 300gsm museum etching paper","signed":true,"imageSizeCm":"32.5 x 39","mountSizeCm":"55.5 x 60","framedSizeCm":"","reviewNotes":"","estDurationSec":65,"themes":"After dark","audioUrl":"../audio/wicked-games.mp3"}},{"productId":"7c4eeb6e-5e03-a00d-6ca3-6de25a181359","title":"Young Hearts","price":560,"inStock":true,"ribbon":"","media":"5f58c4_5076f2c86f664688827f4fa6dd11b480~mv2.png","slug":"young-hearts","hasOptions":true,"story":{"_id":"story-7c4eeb6e-5e03-a00d-6ca3-6de25a181359","status":"approved","transcript":"Young Hearts takes Vettriano back to the setting he made his own: the beach.\n\nHe grew up on the Fife coast, and the shoreline returns again and again in his paintings, as a stage where people dress up, dance, or simply wait beneath skies that seem to be holding their breath. Here a couple stand together by the sea, and the mood is not the dark, noir tension of his interiors but something gentler: romance, and a touch of nostalgia.\n\nThe title points to first love, or at least the memory of it. This is the kind of picture people buy because it reminds them of someone, which is perhaps why his beach paintings have always been among his most loved.\n\nYoung Hearts is an official posthumous edition, released after the artist's death in 2025, limited to one hundred prints and ten Studio Proofs. In place of a signature, each one is numbered and embossed with the stamp of the Estate of Jack Vettriano, and it comes with a certificate of authenticity.","edition":"Posthumous limited edition of 100 + 10 Studio Proofs, numbered and embossed with the Estate stamp","medium":"300gsm museum etching paper","signed":false,"imageSizeCm":"39 x 30.7","mountSizeCm":"61.5 x 52","framedSizeCm":"71.7 x 62.4","reviewNotes":"","estDurationSec":69,"themes":"By the sea, Romance, Final editions","audioUrl":"../audio/young-hearts.mp3"}}],"tours":[{"_id":"tour-0","slug":"by-the-sea","title":"By the sea","intro":"Vettriano grew up on the Fife coast, and the shoreline became his favourite stage. A walk through his beach paintings, from first love to bathers in the sun.","productIds":["77c9e91e-6db4-4241-c6f5-90a9093257cb","7c4eeb6e-5e03-a00d-6ca3-6de25a181359","592c3959-942c-7952-4c3c-76266258f6d7","987c56d4-d78b-993a-7733-a56bfce5ef29"],"status":"live","sortOrder":0},{"_id":"tour-1","slug":"final-editions","title":"The final editions","intro":"Prints released after the artist’s death in March 2025: the last editions to carry his own pencil signature, and the official Estate-stamped posthumous prints.","productIds":["551c0ac5-2f75-32a2-4ce7-b02f856223f6","7c4eeb6e-5e03-a00d-6ca3-6de25a181359","592c3959-942c-7952-4c3c-76266258f6d7"],"status":"live","sortOrder":1},{"_id":"tour-2","slug":"after-dark","title":"After dark","intro":"Telephones at midnight, betrayals and private rituals: the cinematic, noir side of Vettriano’s work.","productIds":["e67c8c86-4494-ad8c-c1cb-5a410b5c8130","667b4ae6-0803-2adc-8fd5-cc8480831b3e","29120bb5-682a-d9a4-3247-2f5d9632fa4d","43c31f09-d23a-1ff1-4363-b5df66a06876","1be66a27-fa93-4a54-eef3-87f10a625ca1","0a3569c2-6e81-5aee-c7ad-4bf5de982c0e"],"status":"live","sortOrder":2},{"_id":"tour-3","slug":"first-signed","title":"Your first signed Vettriano","intro":"Every print in this tour is signed by the artist, in stock and under £800. A good place to begin a collection.","productIds":["666d1c91-4127-d060-1a59-6daf4adf5260","83b1e547-40bc-1f9f-241b-8a3566643bff","bb248dbd-e5bf-2282-bebb-4c1bd4470188","a067f80c-d8df-40e2-072d-149be9a2c08f","b0afab77-2ad4-3ad3-abd9-59ddd1593e83","0a7b5641-6bc2-6654-605d-1ee7fc46b7d3"],"status":"live","sortOrder":3},{"_id":"tour-4","slug":"rare-and-remarkable","title":"Rare and remarkable","intro":"Silkscreens, Artist’s Proofs and Premium editions reproduced at the size of the original painting.","productIds":["678c5ed0-7d61-d6cc-ce57-e5ea1a613a32","44e7f6a7-0958-1a2a-5051-b06c4e2d018d","ef6e2e1e-5830-185f-b28b-17685b88f636","b8929944-7a73-9987-1462-daaaa6ad10a5","3f7de79f-e526-8bf4-ca05-5717d4559504","987c56d4-d78b-993a-7733-a56bfce5ef29"],"status":"live","sortOrder":4}]};
