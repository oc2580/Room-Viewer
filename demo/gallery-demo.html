.stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.stat .muted { display: block; }
.barcell { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.bar { height: 6px; border-radius: 0 3px 3px 0; background: var(--accent); min-width: 2px; }
.pick { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--soft); }
.pick img { width: 44px; height: 54px; object-fit: cover; border-radius: 3px; background: var(--line); }
.picker { max-height: 420px; overflow: auto; }
.themes { display: flex; flex-wrap: wrap; gap: 6px 12px; }
.themes label { font-size: 13px; display: inline-flex; gap: 5px; align-items: center; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; display: none; z-index: 10; max-width: calc(100% - 32px); }
.toast.show { display: block; }
audio { height: 32px; vertical-align: middle; max-width: 100%; }
.empty { padding: 14px 0; color: var(--muted); }
@media (max-width: 860px) { .grid2, .grid3, .cols { grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr 1fr; } .app { padding: 14px; } }
`;

class JvConsole extends HTMLElement {
  static get observedAttributes() { return ['rpc-result', 'ready']; }

  constructor() {
    super();
    this.root = this.attachShadow({ mode: 'open' });
    if (!Object.prototype.hasOwnProperty.call(this, 'rpcHandler')) this.rpcHandler = null;
    this.pending = new Map();
    this.s = {
      tab: 'leads', leads: [], requests: [], catalogue: [], tours: [], insights: null, days: 30,
      lead: null, tour: null, storyFilter: 'all', storyQuery: '', openStory: null, reqFilter: 'waiting', pickQuery: '',
    };
  }

  connectedCallback() {
    this.root.innerHTML = `<style>${STYLE}</style><div class="app" id="app"><p class="muted">Loading…</p></div><div class="toast" id="toast" role="status"></div>`;
    this.root.addEventListener('click', (e) => this.onClick(e));
    this.root.addEventListener('input', (e) => this.onInput(e));
    this.root.addEventListener('change', (e) => this.onInput(e));
    this.root.addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr.click')) { e.preventDefault(); this.onClick(e); }
    });
    queueMicrotask(() => { if (this.rpcHandler || this.hasAttribute('ready')) this.refreshAll(); });
  }

  attributeChangedCallback(name, _o, value) {
    if (name === 'ready' && value !== null && this.isConnected && !this.loaded) this.refreshAll();
    if (name !== 'rpc-result' || !value) return;
    const res = JSON.parse(value);
    const p = this.pending.get(res.id);
    if (!p) return;
    this.pending.delete(res.id);
    if (res.ok) p.resolve(res.result); else p.reject(new Error(res.error || 'Request failed'));
  }

  rpc(method, ...args) {
    if (this.rpcHandler) return this.rpcHandler(method, args);
    const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    return new Promise((resolve, reject) => {
      this.pending.set(id, { resolve, reject });
      this.dispatchEvent(new CustomEvent('jv-rpc', { detail: { id, method, args }, bubbles: true, composed: true }));
      setTimeout(() => { if (this.pending.delete(id)) reject(new Error('Timed out. Please try again.')); }, 120000);
    });
  }

  toast(msg) {
    const t = this.root.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(this.tt);
    this.tt = setTimeout(() => t.classList.remove('show'), 3500);
  }

  async run(btn, fn, okMsg) {
    if (btn) btn.disabled = true;
    try {
      const out = await fn();
      if (okMsg) this.toast(okMsg);
      return out;
    } catch (err) {
      this.toast(err.message);
      return undefined;
    } finally {
      if (btn && btn.isConnected) btn.disabled = false;
    }
  }

  async refreshAll() {
    this.loaded = true;
    try {
      const [leads, requests, catalogue, tours, insights] = await Promise.all([
        this.rpc('listLeads'), this.rpc('listRequests', ''), this.rpc('listCatalogue'), this.rpc('listTours'), this.rpc('getInsights', this.s.days),
      ]);
      Object.assign(this.s, { leads, requests, catalogue, tours, insights });
    } catch (err) {
      this.toast(err.message);
    }
    this.render();
  }

  byId(id) { return this.s.catalogue.find((p) => p.productId === id); }

  waiting() { return this.s.requests.filter((r) => r.status === 'pending' || r.status === 'accepted'); }

  // ---------- rendering ----------
  render() {
    const s = this.s;
    const w = this.waiting().length;
    const tabs = [['leads', 'Leads'], ['requests', 'Requests'], ['tours', 'Tours'], ['stories', 'Story library'], ['insights', 'Insights']];
    let view;
    if (s.tab === 'leads') view = s.lead ? this.leadHtml() : this.leadsHtml();
    else if (s.tab === 'requests') view = this.requestsHtml();
    else if (s.tab === 'tours') view = s.tour ? this.tourEditorHtml() : this.toursHtml();
    else if (s.tab === 'stories') view = this.storiesHtml();
    else view = this.insightsHtml();
    this.root.getElementById('app').innerHTML = `
      <h1>Gallery</h1>
      <p class="sub">Who is looking at what, the requests waiting for you, and the stories and tours visitors see.</p>
      <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab ${s.tab === k ? 'on' : ''}" role="tab" aria-selected="${s.tab === k}" data-tab="${k}">${l}${k === 'requests' && w ? `<span class="count">${w}</span>` : ''}</button>`).join('')}</div>
      <div>${view}</div>`;
  }

  // ----- leads -----
  leadsHtml() {
    const rows = this.s.leads.map((l) => {
      const [cls, label] = heat(l.score);
      return `<tr class="click" data-lead="${esc(l._id)}" tabindex="0">
        <td><strong>${esc(l.name)}</strong><div class="muted">${esc(l.email)}${l.phone ? ` · ${esc(l.phone)}` : ''}</div></td>
        <td><span class="chip ${cls}" title="Engagement score ${l.score}">${label}</span></td>
        <td><span class="chip ${esc(l.status)}">${esc(LEAD_STATUSES[l.status] || l.status)}</span></td>
        <td class="num">${l.pending ? `<span class="chip pending">${l.pending} waiting</span>` : l.requests}</td>
        <td class="num">${l.shortlist}</td>
        <td class="num">${l.storiesPlayed}</td>
        <td>${stamp(l.lastSeenAt)}</td>
      </tr>`;
    }).join('');
    return `<div class="card scroll">${this.s.leads.length ? `<table>
      <thead><tr><th>Visitor</th><th>Interest</th><th>Status</th><th class="num">Requests</th><th class="num">Shortlisted</th><th class="num">Stories heard</th><th>Last seen</th></tr></thead>
      <tbody>${rows}</tbody></table>` : '<p class="empty">No leads yet. Visitors become leads when they reserve a print, make an offer or ask a question.</p>'}</div>
      <p class="muted">Interest is ranked from what visitors do in the gallery: listening to stories, viewing prints on their wall, shortlisting and sending requests. Activity is only recorded for visitors who accept analytics cookies.</p>`;
  }

  suggestion(d) {
    const accepted = d.requests.find((r) => r.status === 'accepted');
    if (accepted) return `They accepted your counter-offer of ${money(accepted.counterPrice)} for ${esc(accepted.printTitle)}. Confirm the sale and send an invoice.`;
    const pending = d.requests.find((r) => r.status === 'pending');
    if (pending) return `Reply to their ${pending.type === 'hold' ? 'reservation request' : pending.type} about ${esc(pending.printTitle)}.`;
    const top = d.prints.find((p) => p.viewInRoom || p.audioMaxPct >= 100) || d.prints[0];
    if (top) return `Most interest is in ${esc(top.title)}${top.viewInRoom ? `, which they put on their wall ${top.viewInRoom} time${top.viewInRoom === 1 ? '' : 's'}` : ''}. A call about framing or a private price could help them decide.`;
    return 'Thank them for their enquiry and ask what they are looking for.';
  }

  leadHtml() {
    const d = this.s.lead;
    const l = d.lead;
    const [cls, label] = heat(d.score);
    return `<div class="row spread" style="margin-bottom:12px"><button class="b" data-back-lead>← All leads</button>
      <div class="row"><label class="muted" for="leadStatus">Status</label><select class="t" style="width:auto" id="leadStatus">${Object.entries(LEAD_STATUSES).map(([k, v]) => `<option value="${k}" ${l.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>
      <div class="card"><div class="row spread"><div><h2 style="margin:0">${esc(l.name)}</h2>
        <div class="muted">${esc(l.email)}${l.phone ? ` · ${esc(l.phone)}` : ''} · first seen ${stamp(l.firstSeenAt)} · last seen ${stamp(l.lastSeenAt)}</div></div>
        <span class="chip ${cls}">${label} · score ${d.score}</span></div></div>
      <div class="next"><strong>Suggested next step:</strong> ${this.suggestion(d)}</div>
      <div class="cols">
        <div>
          <div class="card"><h2>Requests</h2>${d.requests.map((r) => this.requestCardHtml({ ...r, leadName: l.name, leadEmail: l.email, leadPhone: l.phone }, true)).join('') || '<p class="empty">No requests.</p>'}</div>
          <div class="card scroll"><h2>What they looked at</h2>${d.prints.length ? `<table><thead><tr><th>Print</th><th class="num">Time</th><th class="num">Story</th><th class="num">On wall</th><th class="num">Basket</th></tr></thead><tbody>
            ${d.prints.map((p) => `<tr><td>${esc(p.title)}</td><td class="num">${mins(p.dwellSec)}</td><td class="num">${p.audioPlays ? `${p.audioMaxPct || 0}%` : '-'}</td><td class="num">${p.viewInRoom || '-'}</td><td class="num">${p.basket || '-'}</td></tr>`).join('')}
            </tbody></table>` : '<p class="empty">No activity recorded (they may not have accepted analytics cookies).</p>'}
            ${d.tours.length ? `<p class="muted">Tours started: ${esc(d.tours.map((slug) => (this.s.tours.find((t) => t.slug === slug) || { title: slug }).title).join(', '))}</p>` : ''}
          </div>
        </div>
        <div>
          <div class="card"><h2>Shortlist</h2>${d.shortlist.length ? d.shortlist.map((p) => `<div class="row spread" style="padding:6px 0;border-bottom:1px solid var(--soft)"><span>${esc(p.title)}</span><span class="muted">${p.price ? money(p.price) : ''}</span></div>`).join('') : '<p class="empty">Nothing shortlisted.</p>'}</div>
          <div class="card"><h2>Notes</h2><textarea class="t" id="leadNotes" placeholder="Calls, preferences, framing, budget">${esc(l.notes || '')}</textarea>
            <div style="margin-top:8px"><button class="b primary" data-save-notes>Save notes</button></div></div>
        </div>
      </div>`;
  }

  // ----- requests -----
  requestCardHtml(r, compact) {
    const kind = { hold: '48-hour reservation', question: 'Question', offer: 'Offer', shortlist: 'Shortlist enquiry' }[r.type];
    const share = r.offerPrice && r.listPrice ? ` (${pct(r.offerPrice / r.listPrice)} of ${money(r.listPrice)})` : '';
    const prints = r.type === 'shortlist' ? (r.productIds || []).map((id) => (this.byId(id) || { title: 'Removed print' }).title).join(', ') : '';
    const id = esc(r._id);
    let actions = '';
    if (r.status === 'pending' || r.status === 'accepted') {
      actions = `<label class="f" for="reply-${id}">Reply${r.type === 'question' || r.type === 'shortlist' ? '' : ' (optional)'}: shown in their gallery and emailed</label>
        <textarea class="t" id="reply-${id}"></textarea>
        ${r.type === 'offer' && r.status === 'pending' ? `<label class="f" for="counter-${id}">Counter-offer (£), between their offer and the list price</label><input class="t" type="number" id="counter-${id}" style="max-width:200px" min="${(r.offerPrice || 0) + 5}" step="5">` : ''}
        <div class="row" style="margin-top:8px">
          ${r.type === 'hold' ? `<button class="b gold" data-respond="${id}" data-action="confirm">Confirm 48-hour reservation</button><button class="b danger" data-respond="${id}" data-action="decline">Decline</button>` : ''}
          ${r.type === 'offer' && r.status === 'pending' ? `<button class="b gold" data-respond="${id}" data-action="confirm">Accept ${money(r.offerPrice)}</button><button class="b" data-respond="${id}" data-action="counter">Send counter-offer</button><button class="b danger" data-respond="${id}" data-action="decline">Decline</button>` : ''}
          ${r.status === 'accepted' ? `<button class="b gold" data-respond="${id}" data-action="confirm">Confirm sale at ${money(r.counterPrice)}</button>` : ''}
          ${r.type === 'question' || r.type === 'shortlist' ? `<button class="b gold" data-respond="${id}" data-action="answer">Send reply</button>` : ''}
        </div>`;
    } else if (r.reply || r.counterPrice) {
      actions = `<p class="muted" style="margin:6px 0 0">${r.counterPrice ? `Counter-offer ${money(r.counterPrice)}. ` : ''}${r.reply ? `Your reply: ${esc(r.reply)}` : ''}</p>`;
    }
    return `<div class="card" style="${compact ? 'margin:10px 0;box-shadow:none' : ''}">
      <div class="row spread"><div><strong>${kind}${r.type === 'offer' ? ` · ${money(r.offerPrice)}${share}` : ''}</strong> · ${esc(r.printTitle)}</div>
        <div class="row"><span class="chip ${esc(r.status)}">${esc(r.status === 'accepted' ? 'counter accepted' : r.status.replace(/_/g, ' '))}</span><span class="muted">${stamp(r._createdDate)}</span></div></div>
      ${compact ? '' : `<div class="muted">${esc(r.leadName)} · ${esc(r.leadEmail)}${r.leadPhone ? ` · ${esc(r.leadPhone)}` : ''} · <button class="b" style="padding:2px 8px" data-lead="${esc(r.leadId)}">View lead</button></div>`}
      ${prints ? `<p class="muted" style="margin:6px 0 0">Prints: ${esc(prints)}</p>` : ''}
      ${r.message ? `<p style="margin:8px 0 0">${esc(r.message)}</p>` : ''}
      ${r.type === 'hold' && r.status === 'confirmed' && r.holdExpiresAt ? `<p class="muted">Reserved until ${stamp(r.holdExpiresAt)}; released automatically after that.</p>` : ''}
      ${actions}
    </div>`;
  }

  requestsHtml() {
    const f = this.s.reqFilter;
    const list = f === 'waiting' ? this.waiting() : this.s.requests;
    return `<div class="row spread"><h2>Requests</h2>
      <div class="row"><button class="b ${f === 'waiting' ? 'primary' : ''}" data-req-filter="waiting">Waiting for you</button><button class="b ${f === 'all' ? 'primary' : ''}" data-req-filter="all">All</button></div></div>
      ${list.map((r) => this.requestCardHtml(r, false)).join('') || '<div class="card empty">Nothing waiting. Reservations, offers and questions from the gallery appear here.</div>'}`;
  }

  // ----- tours -----
  toursHtml() {
    const stats = new Map(((this.s.insights && this.s.insights.tours) || []).map((t) => [t.slug, t]));
    const rows = this.s.tours.map((t) => {
      const st = stats.get(t.slug) || { starts: 0, completes: 0 };
      return `<tr class="click" data-tour="${esc(t._id)}" tabindex="0"><td><strong>${esc(t.title)}</strong><div class="muted">${esc(t.intro).slice(0, 110)}</div></td>
        <td><span class="chip ${esc(t.status)}">${t.status === 'live' ? 'Live' : 'Draft'}</span></td>
        <td class="num">${t.productIds.length}</td><td class="num">${st.starts}</td><td class="num">${st.starts ? pct(st.completes / st.starts) : '-'}</td></tr>`;
    }).join('');
    return `<div class="row spread"><h2>Guided tours</h2><button class="b primary" data-new-tour>New tour</button></div>
      <div class="card scroll">${this.s.tours.length ? `<table><thead><tr><th>Tour</th><th>Status</th><th class="num">Prints</th><th class="num">Started (${this.s.days} days)</th><th class="num">Finished</th></tr></thead><tbody>${rows}</tbody></table>`
        : '<p class="empty">No tours yet. Import the starter content from the Story library, or create one.</p>'}</div>`;
  }

  tourEditorHtml() {
    const t = this.s.tour;
    const inTour = new Set(t.productIds);
    const q = this.s.pickQuery.toLowerCase();
    const approved = this.s.catalogue.filter((p) => p.story && p.story.status === 'approved');
    const picks = approved.filter((p) => !inTour.has(p.productId) && (!q || p.title.toLowerCase().includes(q) || (p.story.themes || '').toLowerCase().includes(q)));
    return `<div class="row spread" style="margin-bottom:12px"><button class="b" data-back-tour>← All tours</button>
      <div class="row">${t._id ? `<span class="chip ${esc(t.status)}">${t.status === 'live' ? 'Live' : 'Draft'}</span>
        <button class="b ${t.status === 'live' ? '' : 'gold'}" data-tour-status="${t.status === 'live' ? 'draft' : 'live'}">${t.status === 'live' ? 'Unpublish' : 'Publish'}</button>
        <button class="b danger" data-delete-tour>${this.confirmDelete ? 'Confirm delete' : 'Delete'}</button>` : ''}
        <button class="b primary" data-save-tour>Save tour</button></div></div>
      <div class="card"><label class="f" for="tTitle">Title</label><input class="t" id="tTitle" value="${esc(t.title)}">
        <label class="f" for="tIntro">Introduction (shown before the tour starts)</label><textarea class="t" id="tIntro">${esc(t.intro || '')}</textarea></div>
      <div class="cols">
        <div class="card"><h2>In this tour (${t.productIds.length}/${MAX_TOUR_PRINTS})</h2>
          ${t.productIds.map((id, i) => { const p = this.byId(id) || { title: 'Removed print', image: '' }; return `<div class="pick"><img src="${esc(p.image)}" alt=""><div><strong>${i + 1}. ${esc(p.title)}</strong><div class="muted">${money(p.price)}${p.story && p.story.status !== 'approved' ? ' · story not approved, hidden from visitors' : ''}</div></div>
            <div class="row"><button class="b" data-tmove="${i}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Move up">↑</button><button class="b" data-tmove="${i}" data-dir="1" ${i === t.productIds.length - 1 ? 'disabled' : ''} aria-label="Move down">↓</button><button class="b danger" data-tremove="${i}">Remove</button></div></div>`; }).join('') || '<p class="empty">Add prints from the list.</p>'}
          <p class="muted">Stories play in this order, with a short pause between prints.</p></div>
        <div class="card"><div class="row spread"><h2>Add prints</h2><input class="t" style="max-width:200px" placeholder="Search title or theme" data-pick-query value="${esc(this.s.pickQuery)}"></div>
          <div class="picker">${picks.map((p) => `<div class="pick"><img src="${esc(p.image)}" alt="" loading="lazy"><div><strong>${esc(p.title)}</strong><div class="muted">${money(p.price)} · ${esc(p.story.themes || 'no theme')}${p.inStock ? '' : ' · sold out'}</div></div>
            <button class="b" data-tadd="${esc(p.productId)}" ${t.productIds.length >= MAX_TOUR_PRINTS ? 'disabled' : ''}>Add</button></div>`).join('') || '<p class="empty">No matching approved prints.</p>'}</div></div>
      </div>`;
  }

  // ----- story library -----
  storyChip(p) {
    const st = p.story;
    if (!st) return '<span class="chip none">No story</span>';
    if (st.status === 'removed') return '<span class="chip removed">Hidden</span>';
    if (st.status === 'draft') return '<span class="chip draft">Draft, not on show</span>';
    return st.audioCurrent ? '<span class="chip approved">On show with audio</span>' : '<span class="chip warn">On show, no audio yet</span>';
  }

  storiesHtml() {
    const s = this.s;
    const q = s.storyQuery.toLowerCase();
    const status = (p) => (p.story ? p.story.status : 'none');
    const counts = { all: 0, approved: 0, draft: 0, none: 0, removed: 0 };
    for (const p of s.catalogue) { counts[status(p)] += 1; if (status(p) !== 'removed') counts.all += 1; }
    const list = s.catalogue
      .filter((p) => (s.storyFilter === 'all' ? status(p) !== 'removed' : status(p) === s.storyFilter))
      .filter((p) => !q || p.title.toLowerCase().includes(q));
    const tab = (k, label) => `<button class="b ${s.storyFilter === k ? 'primary' : ''}" data-story-filter="${k}">${label} (${counts[k]})</button>`;
    const rows = list.map((p) => {
      const st = p.story;
      const open = s.openStory === p.productId;
      return `<tr><td><strong>${esc(p.title)}</strong><div class="muted">${money(p.price)}${p.inStock ? '' : ' · sold out'}${st && st.themes ? ` · ${esc(st.themes)}` : ''}</div></td>
        <td>${this.storyChip(p)}</td>
        <td class="num">${st && st.estDurationSec ? `${st.estDurationSec}s` : '-'}</td>
        <td>${st && st.audioUrl ? `<audio controls preload="none" src="${esc(st.audioUrl)}"></audio>${st.audioCurrent ? '' : '<div class="muted">Script changed since recording</div>'}` : '-'}</td>
        <td>${st ? `<button class="b" data-open-story="${esc(p.productId)}">${open ? 'Close' : 'Edit'}</button>` : `<button class="b" data-add-story="${esc(p.productId)}">Add to gallery</button>`}</td>
      </tr>${open && st ? `<tr><td colspan="5">${this.storyEditorHtml(p)}</td></tr>` : ''}`;
    }).join('');
    return `${s.catalogue.length && !s.catalogue.some((p) => p.story) ? `<div class="card" style="background:#fbf4e6;border-color:#f0dfbd"><div class="row spread"><div><strong>Import the starter content</strong><div class="muted">68 curator scripts with themes, and five guided tours. Everything arrives as a draft for you to check, approve and publish.</div></div><button class="b gold" data-import>Import</button></div></div>` : ''}
      <div class="row spread"><h2>Story library</h2><input class="t" style="max-width:240px" placeholder="Search prints" data-story-query value="${esc(s.storyQuery)}"></div>
      <div class="row" style="margin-bottom:12px">${tab('all', 'All')}${tab('approved', 'On show')}${tab('draft', 'Drafts')}${tab('none', 'No story yet')}${tab('removed', 'Hidden')}</div>
      <p class="muted">A print appears in the gallery once its story is approved. Hide a print to take it out of the gallery and tours; its story is kept and can be restored.</p>
      <div class="card scroll"><table><thead><tr><th>Print</th><th>In the gallery</th><th class="num">Length</th><th>Audio</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="empty">Nothing here.</td></tr>'}</tbody></table></div>`;
  }

  storyEditorHtml(p) {
    const st = p.story;
    const id = esc(st._id);
    const themes = String(st.themes || '').split(',').map((x) => x.trim());
    return `<div style="padding:8px 0 14px">
      ${st.reviewNotes ? `<div class="note"><strong>Review notes:</strong> ${esc(st.reviewNotes)}</div>` : ''}
      <label class="f">Voice-over script (about 150-200 words; paragraphs become natural pauses)</label>
      <textarea class="t script" data-story="${id}" data-sfield="transcript">${esc(st.transcript)}</textarea>
      <label class="f">Themes (used for gallery filters and tours)</label>
      <div class="themes">${THEMES.map((t) => `<label><input type="checkbox" data-theme-box="${id}" value="${esc(t)}" ${themes.includes(t) ? 'checked' : ''}> ${esc(t)}</label>`).join('')}</div>
      <div class="grid3">
        <div><label class="f">Edition</label><input class="t" data-story="${id}" data-sfield="edition" value="${esc(st.edition)}"></div>
        <div><label class="f">Medium</label><input class="t" data-story="${id}" data-sfield="medium" value="${esc(st.medium)}"></div>
        <div><label class="f">Signed by the artist</label><select class="t" data-story="${id}" data-sfield="signed"><option value="true" ${st.signed ? 'selected' : ''}>Yes</option><option value="false" ${st.signed ? '' : 'selected'}>No</option></select></div>
        <div><label class="f">Image size (cm)</label><input class="t" data-story="${id}" data-sfield="imageSizeCm" value="${esc(st.imageSizeCm)}"></div>
        <div><label class="f">Mount size (cm)</label><input class="t" data-story="${id}" data-sfield="mountSizeCm" value="${esc(st.mountSizeCm)}"></div>
        <div><label class="f">Framed size (cm)</label><input class="t" data-story="${id}" data-sfield="framedSizeCm" value="${esc(st.framedSizeCm)}"></div>
      </div>
      <label class="f">Review notes</label><input class="t" data-story="${id}" data-sfield="reviewNotes" value="${esc(st.reviewNotes)}">
      <div class="row" style="margin-top:12px">
        <button class="b primary" data-save-story="${id}">Save</button>
        ${st.status === 'draft' ? `<button class="b gold" data-story-status="${id}" data-status="approved">Approve and show in gallery</button>` : ''}
        ${st.status === 'approved' ? `<button class="b gold" data-gen-audio="${id}">${st.audioUrl ? 'Regenerate audio' : 'Generate audio'}</button>` : ''}
        ${st.status !== 'removed' ? `<button class="b" data-claude="${id}">${this.confirmClaude === id ? 'Replace script with a new draft?' : 'Draft with Claude'}</button>` : ''}
        ${st.status === 'removed' ? `<button class="b" data-story-status="${id}" data-status="draft">Restore</button>` : `<button class="b danger" data-story-status="${id}" data-status="removed">Hide from gallery</button>`}
      </div>
      <p class="muted">Approve only after checking every fact against the product page. Editing an approved script takes it out of the gallery until you approve it again, and its audio must be regenerated.</p>
    </div>`;
  }

  // ----- insights -----
  insightsHtml() {
    const d = this.s.insights;
    if (!d) return '<p class="empty">No data yet.</p>';
    const max = Math.max(1, ...d.prints.map((p) => p.dwellSec));
    return `<div class="row spread"><h2>Insights</h2><select class="t" style="width:auto" id="days" aria-label="Period">${[7, 30, 90].map((n) => `<option value="${n}" ${d.days === n ? 'selected' : ''}>Last ${n} days</option>`).join('')}</select></div>
      <div class="stats">
        <div class="stat"><span class="muted">Visitors</span><b>${d.visitors}</b><span class="muted">${d.sessions} visits</span></div>
        <div class="stat"><span class="muted">Stories played</span><b>${d.storiesPlayed}</b></div>
        <div class="stat"><span class="muted">Added to basket</span><b>${d.basketAdds}</b></div>
        <div class="stat"><span class="muted">New leads</span><b>${d.newLeads}</b><span class="muted">${pct(d.leadRate)} of visitors · ${d.requests} requests</span></div>
      </div>
      <div class="card scroll"><h2>Prints by attention</h2><p class="muted" style="margin:-6px 0 8px">Ranked by time viewed, with each request counting as ten minutes.</p>${d.prints.length ? `<table><thead><tr><th>Print</th><th class="num">Time viewed</th><th class="num">Opened</th><th class="num">Stories finished</th><th class="num">On a wall</th><th class="num">Shortlisted</th><th class="num">Basket</th><th class="num">Requests</th></tr></thead><tbody>
        ${d.prints.slice(0, 25).map((p) => `<tr><td>${esc(p.title)}</td>
          <td class="num"><div class="barcell" title="${esc(p.title)}: ${mins(p.dwellSec)} viewed"><div class="bar" style="width:${Math.round((p.dwellSec / max) * 90)}px"></div><span>${mins(p.dwellSec)}</span></div></td>
          <td class="num">${p.opens}</td><td class="num">${p.audioPlays ? `${p.audioCompletes} of ${p.audioPlays}` : '-'}</td><td class="num">${p.viewInRoom}</td><td class="num">${p.shortlists}</td><td class="num">${p.basket}</td><td class="num">${p.requests}</td></tr>`).join('')}
        </tbody></table>` : '<p class="empty">Nothing recorded in this period.</p>'}</div>
      <div class="card scroll"><h2>Tours</h2><table><thead><tr><th>Tour</th><th class="num">Started</th><th class="num">Finished</th><th class="num">Completion</th></tr></thead><tbody>
        ${d.tours.map((t) => `<tr><td>${esc(t.title)}</td><td class="num">${t.starts}</td><td class="num">${t.completes}</td><td class="num">${t.starts ? pct(t.completes / t.starts) : '-'}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="muted">Viewing, listening and basket figures cover visitors who accepted analytics cookies. Leads and requests are counted for everyone.</p>`;
  }

  // ---------- events ----------
  async openLead(id) {
    const detail = await this.run(null, () => this.rpc('getLeadDetail', id));
    if (!detail) return;
    this.s.tab = 'leads';
    this.s.lead = detail;
    this.render();
  }

  async reloadAfterRequest() {
    const [requests, leads] = await Promise.all([this.rpc('listRequests', ''), this.rpc('listLeads')]);
    Object.assign(this.s, { requests, leads });
    if (this.s.lead) await this.openLead(this.s.lead.lead._id); else this.render();
  }

  collectStoryChanges(storyId) {
    const changes = {};
    this.root.querySelectorAll(`[data-story="${CSS.escape(storyId)}"]`).forEach((el) => {
      changes[el.dataset.sfield] = el.dataset.sfield === 'signed' ? el.value === 'true' : el.value;
    });
    const boxes = [...this.root.querySelectorAll(`[data-theme-box="${CSS.escape(storyId)}"]`)];
    if (boxes.length) changes.themes = boxes.filter((b) => b.checked).map((b) => b.value).join(', ');
    return changes;
  }

  onInput(e) {
    const t = e.target;
    if ('pickQuery' in t.dataset && e.type === 'input') { this.s.pickQuery = t.value; this.renderKeepFocus(t); }
    else if ('storyQuery' in t.dataset && e.type === 'input') { this.s.storyQuery = t.value; this.renderKeepFocus(t); }
    else if (t.id === 'tTitle') this.s.tour.title = t.value;
    else if (t.id === 'tIntro') this.s.tour.intro = t.value;
    else if (t.id === 'leadStatus' && e.type === 'change') {
      this.run(null, () => this.rpc('updateLead', this.s.lead.lead._id, { status: t.value }), 'Status updated').then((saved) => {
        if (saved) { this.s.lead.lead.status = saved.status; this.rpc('listLeads').then((leads) => { this.s.leads = leads; }); }
      });
    } else if (t.id === 'days' && e.type === 'change') {
      this.s.days = Number(t.value);
      this.run(null, () => this.rpc('getInsights', this.s.days)).then((ins) => { if (ins) { this.s.insights = ins; this.render(); } });
    }
  }

  renderKeepFocus(input) {
    const key = Object.keys(input.dataset)[0];
    const pos = input.selectionStart;
    this.render();
    const el = this.root.querySelector(`[data-${key.replace(/[A-Z]/g, (c) => `-${c.toLowerCase()}`)}]`);
    if (el) { el.focus(); el.setSelectionRange(pos, pos); }
  }

  async onClick(e) {
    const row = e.target.closest('tr[data-lead], tr[data-tour]');
    const b = e.target.closest('button') || row;
    if (!b) return;
    const d = b.dataset;
    const s = this.s;
    if (d.deleteTour === undefined) this.confirmDelete = false;
    if (d.claude === undefined) this.confirmClaude = null;
    if (d.tab) { s.tab = d.tab; s.lead = null; s.tour = null; this.render(); }
    else if (d.lead) this.openLead(d.lead);
    else if ('backLead' in d) { s.lead = null; this.render(); }
    else if ('saveNotes' in d) {
      const notes = this.root.getElementById('leadNotes').value;
      const saved = await this.run(b, () => this.rpc('updateLead', s.lead.lead._id, { notes }), 'Notes saved');
      if (saved) s.lead.lead.notes = saved.notes;
    } else if (d.reqFilter) { s.reqFilter = d.reqFilter; this.render(); }
    else if (d.respond) {
      const reply = (this.root.getElementById(`reply-${d.respond}`) || {}).value || '';
      const counter = (this.root.getElementById(`counter-${d.respond}`) || {}).value || '';
      if (d.action === 'counter' && !counter) { this.toast('Enter the counter-offer amount first.'); return; }
      const saved = await this.run(b, () => this.rpc('respondToRequest', d.respond, d.action, reply, Number(counter) || null),
        { confirm: 'Confirmed. The visitor has been told.', decline: 'Declined. The visitor has been told.', answer: 'Reply sent', counter: 'Counter-offer sent' }[d.action]);
      if (saved) await this.reloadAfterRequest();
    } else if (d.tour && row) {
      const t = s.tours.find((x) => x._id === d.tour);
      s.tour = { ...t, productIds: [...t.productIds] };
      s.pickQuery = '';
      this.render();
    } else if ('newTour' in d) { s.tour = { title: '', intro: '', productIds: [], status: 'draft' }; s.pickQuery = ''; this.render(); }
    else if ('backTour' in d) { s.tour = null; this.render(); }
    else if (d.tadd) { s.tour.productIds.push(d.tadd); this.render(); }
    else if (d.tremove) { s.tour.productIds.splice(Number(d.tremove), 1); this.render(); }
    else if (d.tmove) {
      const i = Number(d.tmove); const j = i + Number(d.dir);
      [s.tour.productIds[i], s.tour.productIds[j]] = [s.tour.productIds[j], s.tour.productIds[i]];
      this.render();
    } else if ('saveTour' in d) {
      const saved = await this.run(b, () => this.rpc('saveTour', { _id: s.tour._id, title: s.tour.title, intro: s.tour.intro, productIds: s.tour.productIds }), 'Tour saved');
      if (saved) { s.tours = await this.rpc('listTours'); s.tour = s.tours.find((t) => t._id === saved._id); s.tour = { ...s.tour, productIds: [...s.tour.productIds] }; this.render(); }
    } else if (d.tourStatus) {
      const saved = await this.run(b, () => this.rpc('setTourStatus', s.tour._id, d.tourStatus), d.tourStatus === 'live' ? 'Tour is live in the gallery' : 'Tour unpublished');
      if (saved) { s.tours = await this.rpc('listTours'); s.tour.status = saved.status; this.render(); }
    } else if ('deleteTour' in d) {
      if (!this.confirmDelete) { this.confirmDelete = true; this.render(); return; }
      this.confirmDelete = false;
      const ok = await this.run(b, () => this.rpc('deleteTour', s.tour._id), 'Tour deleted');
      if (ok) { s.tours = await this.rpc('listTours'); s.tour = null; this.render(); }
    } else if ('import' in d) {
      const res = await this.run(b, () => this.rpc('importStarterContent'));
      if (res) {
        [s.catalogue, s.tours] = await Promise.all([this.rpc('listCatalogue'), this.rpc('listTours')]);
        this.toast(`Imported ${res.stories} stories and ${res.tours} tours as drafts${res.audio ? `; added recorded narration to ${res.audio} existing stories` : ''}`);
        this.render();
      }
    } else if (d.storyFilter) { s.storyFilter = d.storyFilter; this.render(); }
    else if (d.openStory) { s.openStory = s.openStory === d.openStory ? null : d.openStory; this.render(); }
    else if (d.addStory) {
      const saved = await this.run(b, () => this.rpc('addStory', d.addStory), 'Added. Write or draft its story, then approve it.');
      if (saved) { s.catalogue = await this.rpc('listCatalogue'); s.openStory = saved.productId; s.storyFilter = 'all'; this.render(); }
    } else if (d.saveStory) {
      const saved = await this.run(b, () => this.rpc('saveStory', d.saveStory, this.collectStoryChanges(d.saveStory)), 'Story saved');
      if (saved) { s.catalogue = await this.rpc('listCatalogue'); this.render(); }
    } else if (d.storyStatus) {
      if (d.status === 'approved' && !(await this.run(b, () => this.rpc('saveStory', d.storyStatus, this.collectStoryChanges(d.storyStatus))))) return;
      const saved = await this.run(b, () => this.rpc('setStoryStatus', d.storyStatus, d.status),
        { approved: 'Approved. The print is now in the gallery.', removed: 'Hidden from the gallery', draft: 'Restored as a draft' }[d.status]);
      if (saved) { s.catalogue = await this.rpc('listCatalogue'); if (d.status === 'removed') s.openStory = null; this.render(); }
    } else if (d.genAudio) {
      b.textContent = 'Generating… (about 20 seconds)';
      const saved = await this.run(b, () => this.rpc('generateStoryAudio', d.genAudio), 'Audio ready');
      if (saved) s.catalogue = await this.rpc('listCatalogue');
      this.render();
    } else if (d.claude) {
      const st = this.s.catalogue.find((p) => p.story && p.story._id === d.claude).story;
      if (st.transcript && this.confirmClaude !== d.claude) { this.confirmClaude = d.claude; this.render(); return; }
      this.confirmClaude = null;
      b.textContent = 'Drafting…';
      const saved = await this.run(b, () => this.rpc('draftStoryWithClaude', d.claude), 'Draft ready. Check every fact before approving.');
      if (saved) s.catalogue = await this.rpc('listCatalogue');
      this.render();
    }
  }
}

<script>
const SEED = {"prints":[{"productId":"c9db2862-864f-6419-290a-b982bd8c4b56","title":"Afternoon Reverie","price":560,"inStock":true,"ribbon":"","media":"d9cb8c_e18604e4efea4a1c84588410fa697f2b~mv2.jpg","slug":"afternoon-reverie","hasOptions":true,"story":{"_id":"story-c9db2862-864f-6419-290a-b982bd8c4b56","status":"approved","transcript":"Afternoon Reverie has a gentle, unhurried title: an afternoon spent drifting into a daydream.\n\nReverie is a recurring mood in Vettriano's work. He often caught people in the pause between events, lost in thought, or lost in each other. These quieter paintings show a different side of an artist best known for drama and seduction, and many collectors will tell you they are the ones most rewarding to live with.\n\nThis is a calm, restful image. It belongs in a bedroom, a sitting room or a study, and it sits beautifully alongside his other contemplative pictures.\n\nThe edition is limited to two hundred and fifty prints and twenty-five Artist's Proofs, each signed and numbered by Jack Vettriano. It is printed on a heavier museum etching paper than many of his editions, which gives the image real depth. For anyone beginning a collection, it is one of the most approachable ways to own a signed Vettriano.","edition":"Signed limited edition of 250 + 25 Artist's Proofs","medium":"350gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":"52.7 x 59","framedSizeCm":"63.3 x 69.6","reviewNotes":"","estDurationSec":62,"themes":"Quiet moments","audioUrl":"../audio/afternoon-reverie.mp3"}},{"productId":"599277a8-f61e-53fb-a52d-6aa976e4aa10","title":"Baby, Bye Bye","price":1200,"inStock":true,"ribbon":"Framed","media":"d9cb8c_243a7ad3632a453d875d7f86dd219bb7~mv2.jpg","slug":"baby-bye-bye","hasOptions":false,"story":{"_id":"story-599277a8-f61e-53fb-a52d-6aa976e4aa10","status":"approved","transcript":"Baby, Bye Bye. A woman in a robe stands at a window, a mug in her hand, looking out.\n\nIt is the morning after, or perhaps the morning of a departure. The title, with its echo of a pop-song farewell, tells us that someone has gone, or is about to. There is no drama here, no evening dress, no dance floor. Just a quiet, domestic moment that anyone who has ever said goodbye will recognise.\n\nThat is what makes it one of Vettriano's most relatable images. Painted in his later period, when his work became more intimate and understated, it shows how much he could say with very little: a pose, a window, the light of the morning.\n\nIt was published in 2015, a limited edition of two hundred and fifty prints and twenty-five Artist's Proofs, each signed and numbered by Jack Vettriano. As one of his later signed releases, it belongs to a body of work that is now complete. This example comes framed, ready for a bedroom, a kitchen or a sitting room.","edition":"Signed limited edition giclée of 250 + 25 Artist's Proofs, published 2015","medium":"Giclée on 300gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":"41 x 49","framedSizeCm":"","reviewNotes":"Ribbon says Framed - confirm framed dimensions for view-in-room.","estDurationSec":70,"themes":"Quiet moments","audioUrl":"../audio/baby-bye-bye.mp3"}},{"productId":"982ee5ac-b3bc-c002-0d8c-ae494544c7ec","title":"Beautiful Dreamer","price":995,"inStock":true,"ribbon":"","media":"d9cb8c_79d66098d55243cc9f91e9c19b4419cf~mv2.jpg","slug":"beautiful-dreamer","hasOptions":true,"story":{"_id":"story-982ee5ac-b3bc-c002-0d8c-ae494544c7ec","status":"approved","transcript":"Beautiful Dreamer. A woman in a black dress stands beside a window, lost in her own thoughts.\n\nThe title comes from Stephen Foster's famous nineteenth-century song, and Vettriano uses it with real tenderness. Many of his finest paintings are quiet portraits of women alone: waiting, remembering, daydreaming. This is one of the most admired of them all. The light from the window and the stillness of the pose give it a calm, reflective mood that stays with you.\n\nIt is a large print, and that matters. At this scale its atmosphere can fill a wall, in a bedroom, a living room, or a quiet reading space.\n\nThe edition is printed on Hahnemühle mould-made paper. Hahnemühle has been making paper in Germany since the sixteenth century, and its soft surface gives Vettriano's colours an almost painterly finish. Each print is signed and numbered by the artist, from an edition of four hundred and ninety-five, and for its scale and quality it is one of the most impressive works on paper in our collection.","edition":"Signed limited edition of 495 + 50 Artist's Proofs","medium":"310gsm Hahnemühle mould-made paper","signed":true,"imageSizeCm":"","mountSizeCm":"78.8 x 96","framedSizeCm":"","reviewNotes":"","estDurationSec":69,"themes":"Quiet moments","audioUrl":"../audio/beautiful-dreamer.mp3"}},{"productId":"f4a4ec85-bf96-4e83-9408-1ba168758012","title":"Betrayal – First Kiss","price":795,"inStock":false,"ribbon":"","media":"5f58c4_b096d740836245958ba1536b9bee5c42~mv2.jpg","slug":"betrayal-first-kiss","hasOptions":true,"story":{"_id":"story-f4a4ec85-bf96-4e83-9408-1ba168758012","status":"approved","transcript":"Betrayal: First Kiss. A man and a woman share a first kiss in a softly lit room, wall lights glowing on either side of them.\n\nThis painting belongs to a small group Vettriano made on the theme of betrayal, alongside Betrayal: No Turning Back, and Contemplation of Betrayal. Taken together, they read almost like the frames of a film. And this is where the story begins.\n\nNotice how much the title changes what you see. Without it, this is a tender, romantic moment. With it, the same kiss carries a shadow: somewhere outside this room, someone is about to be hurt. That tension between beauty and consequence is the very heart of Vettriano's work.\n\nThe edition is small, just one hundred prints and ten Artist's Proofs, each signed and numbered by Jack Vettriano. For a collector, the real pleasure is in the series: hung together, the Betrayal paintings tell their story in full.","edition":"Signed limited edition of 100 + 10 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":"39 x 32.2","mountSizeCm":"","framedSizeCm":"","reviewNotes":"","estDurationSec":61,"themes":"After dark, Romance","audioUrl":"../audio/betrayal-first-kiss.mp3"}},{"productId":"10071409-8d27-c900-ff44-740f51894d86","title":"Betrayal – No Turning Back","price":795,"inStock":false,"ribbon":"","media":"d9cb8c_2c8e59309340415fa182d6852c079eea~mv2.jpg","slug":"betrayal-no-turning-back","hasOptions":true,"story":{"_id":"story-10071409-8d27-c900-ff44-740f51894d86","status":"approved","transcript":"Betrayal: No Turning Back. A man in a dark suit holds a woman close in a dim room, her dress slipping from her shoulder.\n\nIf First Kiss is where the story begins, this is the moment it becomes irreversible. The title leaves no room for doubt. A line has been crossed, and both of them know it.\n\nVettriano was a master of this kind of moment: not the event itself, but the instant just before or just after, when everything is still charged. The dim light, the dark suit, the closeness of the figures: every element is staged with the precision of a film still.\n\nThe original oil on canvas was painted in 2001 and shown that year at the International Art and Design Fair in New York. It has since sold. This print, from an edition of only one hundred, plus ten Artist's Proofs, is signed and numbered by the artist, and it is the natural companion to Betrayal: First Kiss.","edition":"Signed limited edition of 100 + 10 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":"39 x 32.2","mountSizeCm":"","framedSizeCm":"","reviewNotes":"","estDurationSec":65,"themes":"After dark","audioUrl":"../audio/betrayal-no-turning-back.mp3"}},{"productId":"bb248dbd-e5bf-2282-bebb-4c1bd4470188","title":"Birdy","price":535,"inStock":true,"ribbon":"Artist Proof Available","media":"5f58c4_2561da219628494ea3ba3cd449cdea2b~mv2.jpg","slug":"birdy","hasOptions":true,"story":{"_id":"story-bb248dbd-e5bf-2282-bebb-4c1bd4470188","status":"approved","transcript":"Birdy. An affectionate, slightly old-fashioned term of endearment, the kind of word that belongs to the dance halls and pubs of the post-war years Vettriano so loved to evoke.\n\nHis titles often borrow from everyday speech, from songs and films, and they give his paintings a conversational, personal quality. It is as if we are being let in on a private nickname, something said quietly between two people.\n\nBirdy is a small, intimate image, and it is a natural fit for the kind of wall many collectors build over time: a gathering of his smaller prints, mixing portraits and narrative scenes. It holds its own alone, and it sits beautifully in a group.\n\nThe edition is a modest one, one hundred and twenty-five prints and fifteen Artist's Proofs, each signed and numbered by Jack Vettriano and printed on museum etching paper. An Artist's Proof is also available. As a first signed Vettriano, or a thoughtful gift for a collector who already loves his work, it is a lovely choice.","edition":"Signed limited edition of 125 + 15 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":"20 x 25","mountSizeCm":"41 x 48.5","framedSizeCm":"51 x 58.5","reviewNotes":"","estDurationSec":68,"themes":"Style & society","audioUrl":"../audio/birdy.mp3"}},{"productId":"692a583f-4949-f362-a009-1fb93b4128d1","title":"Black On Blonde","price":560,"inStock":true,"ribbon":"","media":"d9cb8c_79648ca3a37f4f26b9ac5cb48204549f~mv2.jpg","slug":"black-on-blonde","hasOptions":true,"story":{"_id":"story-692a583f-4949-f362-a009-1fb93b4128d1","status":"approved","transcript":"Black on Blonde. It reads almost like a colour note, or a cocktail order, and that blend of style and suggestion is pure Vettriano.\n\nBlack clothing against fair hair is a contrast he returned to again and again, especially in his portraits of women. Here he puts that idea front and centre, and the title is the clue. This is a study in elegance, in contrast, and in attitude.\n\nIt was published in 2015, alongside several other editions in the same format, and it belongs to his later work: assured, pared back, and very sure of its effect.\n\nThe edition is two hundred and fifty prints and twenty-five Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper. Its moderate size makes it versatile, in a bedroom, a hallway or a study. And as one of the most accessible signed editions in our collection, it is a natural place for a new collector to begin.","edition":"Signed limited edition giclée of 250 + 25 Artist's Proofs, published 2015","medium":"Giclée on 300gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":"41 x 49","framedSizeCm":"62.7 x 72.7","reviewNotes":"","estDurationSec":63,"themes":"Style & society","audioUrl":"../audio/black-on-blonde.mp3"}},{"productId":"061496dd-2eb6-986f-8fa1-635b5ed3b854","title":"Cocktails & Broken Hearts","price":995,"inStock":false,"ribbon":"Silkscreen","media":"5f58c4_f4ebadb23e004c5a9ac94f6e50de7788~mv2.jpg","slug":"cocktails-broken-hearts","hasOptions":true,"story":{"_id":"story-061496dd-2eb6-986f-8fa1-635b5ed3b854","status":"approved","transcript":"Cocktails and Broken Hearts. A late-night bar, its figures gathered at the counter in low, smoky light.\n\nThe title does the rest. It hints at the stories behind the drinks: who is waiting for whom, who has been let down, and who is about to be. Vettriano never spells it out. He sets the scene, dims the lights, and lets us eavesdrop.\n\nThe original oil on canvas was painted in 1998 and shown that year in Between Darkness and Dawn, one of his exhibitions. It was chosen again, years later, for Jack Vettriano: A Retrospective, at Kelvingrove Art Gallery and Museum in Glasgow, in 2013 and 2014. That tells you how highly it was regarded.\n\nThis edition is a silkscreen, published in 2003, limited to two hundred and seventy-five, each signed and numbered by Jack Vettriano. Silkscreens are built up colour by colour, by hand, and they have a depth and intensity all of their own. At seventy by fifty-six centimetres, it is a substantial image, made for an evening room.","edition":"Signed silkscreen, edition of 275, published 2003","medium":"Silkscreen","signed":true,"imageSizeCm":"70 x 56","mountSizeCm":"","framedSizeCm":"","reviewNotes":"Source copy is brief; script stays close to it.","estDurationSec":68,"themes":"After dark, Rare editions","audioUrl":"../audio/cocktails-broken-hearts.mp3"}},{"productId":"d495a8f8-0228-f488-cd01-729da205fb03","title":"Contemplation of Betrayal","price":795,"inStock":false,"ribbon":"","media":"5f58c4_7972d2f3184f41a39f044e2b65830549~mv2.jpg","slug":"contemplation-of-betrayal","hasOptions":true,"story":{"_id":"story-d495a8f8-0228-f488-cd01-729da205fb03","status":"approved","transcript":"Contemplation of Betrayal is the quietest painting in Vettriano's betrayal sequence, and perhaps the most telling.\n\nIt is dusk, by a window. A man in a dark suit leans in to kiss a woman's cheek. She has a glass in her hand, and she is looking away.\n\nAlongside Betrayal – First Kiss and Betrayal – No Turning Back, this is the third chapter of the story, and its mood is entirely different. There is no embrace here, no line yet crossed. This is the moment of hesitation, before the decision. Everything depends on which way she turns.\n\nThat was Vettriano's great skill: finding the instant when a story could still go either way, and holding it there for us. Her averted gaze tells us more than any embrace could.\n\nThe edition is small, one hundred prints and ten Artist's Proofs, each signed and numbered by Jack Vettriano. For a collector drawn to the betrayal paintings, it completes the trilogy, and for many it is the most compelling of the three.","edition":"Signed limited edition of 100 + 10 Artist's Proofs (APs +25%)","medium":"Giclée","signed":true,"imageSizeCm":"","mountSizeCm":"","framedSizeCm":"","reviewNotes":"No sizes in product copy - add for view-in-room.","estDurationSec":68,"themes":"After dark, Quiet moments","audioUrl":"../audio/contemplation-of-betrayal.mp3"}},{"productId":"26a63353-95f9-3e81-604b-e8cca3006324","title":"Dancer For Money","price":3500,"inStock":false,"ribbon":"Premium Limited Edition","media":"d9cb8c_a915f3923cbc488c9e4ced2059fde84e~mv2_d_2746_3109_s_4_2.jpg","slug":"dancer-for-money","hasOptions":false,"story":{"_id":"story-26a63353-95f9-3e81-604b-e8cca3006324","status":"approved","transcript":"Dancer for Money. The title is blunt, and deliberately so.\n\nVettriano was drawn throughout his career to the world of performers, dancers and the people who watch them: the glamour on the surface, and the transaction underneath. The title tells us exactly which side of that world we are looking at, and leaves us to feel what we will about it.\n\nIt was chosen as one of the paintings for a premium signed edition celebrating Jack Vettriano's greatest works, and that tells you how it is regarded.\n\nThis premium edition is presented very differently from a paper print. It is reproduced at the full size of the original painting, twenty-four by twenty inches, as a high-quality giclée, board mounted and finished by hand with three coats of lacquer for a satin surface. It arrives in the same style of frame used for his original work, with no border and no glass, ready to hang.\n\nThe edition is tiny: just fifty, plus five proofs, each signed and numbered by Vettriano in silver pen in the corner of the image.","edition":"Premium limited edition of 50 + 5, original size (24 x 20 in), signed in silver pen","medium":"Giclée, board mounted, hand-embellished with 3 coats of lacquer, no glass","signed":true,"imageSizeCm":"61 x 50.8","mountSizeCm":"","framedSizeCm":"","reviewNotes":"Source copy has almost no detail about the painting itself - Studio may wish to add a line from the blog post.","estDurationSec":71,"themes":"After dark, Rare editions","audioUrl":"../audio/dancer-for-money.mp3"}},{"productId":"73436e8f-6e6a-7fb1-36a6-d2fe34e69c5e","title":"Days of Wine and Roses","price":695,"inStock":false,"ribbon":"Framed","media":"d9cb8c_02fe3d8e49094b1094c8f1719bec75fd~mv2.jpg","slug":"days-of-wine-and-roses","hasOptions":false,"story":{"_id":"story-73436e8f-6e6a-7fb1-36a6-d2fe34e69c5e","status":"approved","transcript":"Days of Wine and Roses. A woman in a sun hat and a floral dress sits alone at a restaurant table, laid with a white cloth and flowers. Behind her, the blinds are half drawn.\n\nIs she waiting for someone? Has someone just left? Vettriano does not say. The table is set for a celebration, and yet she is alone, and the title, borrowed from a phrase about the fleeting nature of pleasure, gives the scene a gentle note of melancholy.\n\nThis painting gave its name to Vettriano's 2010 exhibition at Kirkcaldy Galleries. For him that was a homecoming of sorts. Kirkcaldy's gallery was where, as a young man, he had taught himself to paint by studying the pictures on its walls. The same exhibition introduced Night Calls, Portrait in Black and Pearl, Morning News and The Weight.\n\nThe edition was published in 2010, two hundred and fifty prints plus twenty-five Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper.","edition":"Signed limited edition giclée of 250 + 25 Artist's Proofs, published 2010","medium":"Giclée on 350gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":"64 x 54.5","framedSizeCm":"","reviewNotes":"","estDurationSec":66,"themes":"Quiet moments","audioUrl":"../audio/days-of-wine-and-roses.mp3"}},{"productId":"0820eab4-1380-e3b8-53f4-007939b89335","title":"Dr Connolly I Presume","price":3500,"inStock":false,"ribbon":"Customer Sale","media":"5f58c4_90af829bb14a47cc9894d708414d3a81~mv2.webp","slug":"dr-connolly-i-presume","hasOptions":false,"story":{"_id":"story-0820eab4-1380-e3b8-53f4-007939b89335","status":"approved","transcript":"Dr Connolly, I Presume is a portrait of a Scottish legend by a Scottish legend.\n\nJack Vettriano was one of three artists, alongside John Byrne and Rachel Maclean, commissioned to portray the comedian Billy Connolly. Their portraits were reproduced as enormous murals in Glasgow, celebrating one of the city's most beloved sons.\n\nVettriano's answer was characteristically his own. Connolly stands in a long coat on a beach, the setting Vettriano returned to throughout his career, and the title borrows the most famous line of Victorian exploration with a wink. It is a portrait with all the style and theatre of his figure paintings, and a real sense of affection for its subject.\n\nThis edition was published in 2017, limited to one hundred giclée prints, each signed and numbered by Jack Vettriano. It is a small, jewel-like image, and as a meeting of two great Scottish personalities it holds a particular place in any collection of his work.","edition":"Signed and numbered giclée, edition of 100, published 2017","medium":"Giclée","signed":true,"imageSizeCm":"20 x 25","mountSizeCm":"41 x 47.5","framedSizeCm":"","reviewNotes":"Product copy mentions both a 1994 'World Tour of Scotland' series and the People's Palace murals - Studio to confirm the commission history before recording. Script keeps to the safest facts.","estDurationSec":63,"themes":"Portraits","audioUrl":"../audio/dr-connolly-i-presume.mp3"}},{"productId":"374bdc00-545e-43b9-4d82-b6df5693ac56","title":"Edinburgh Afternoon","price":560,"inStock":true,"ribbon":"","media":"d9cb8c_8ce4c467da9a46b8a37551372c5dcdfc~mv2.jpg","slug":"edinburgh-afternoon","hasOptions":true,"story":{"_id":"story-374bdc00-545e-43b9-4d82-b6df5693ac56","status":"approved","transcript":"Edinburgh Afternoon brings Vettriano's world home, to the Scottish capital.\n\nEdinburgh is closely tied to his story. It was at the Royal Scottish Academy, in 1988, that a self-taught painter from Fife submitted two pictures to the annual exhibition, and saw both of them sell on the very first day. That was the moment his career began.\n\nMost of his paintings take place in imagined settings: a bar, a ballroom, a beach that could be anywhere. So a title that names a real city gives this image a rare sense of place, and it has become a favourite with collectors who know and love Edinburgh.\n\nAnd the afternoon of the title sets a slower, more relaxed mood than his night scenes. This is Vettriano in daylight.\n\nThe edition is two hundred and fifty prints and twenty-five Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper. It makes a wonderful gift for anyone with a connection to the city, and it is an approachable first signed Vettriano.","edition":"Signed limited edition of 250 + 25 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":"52.1 x 62.1","framedSizeCm":"62.7 x 72.7","reviewNotes":"","estDurationSec":68,"themes":"Quiet moments","audioUrl":"../audio/edinburgh-afternoon.mp3"}},{"productId":"56263ef1-c0c1-e770-2926-ad8bf52a5700","title":"Evening of Ritual","price":1250,"inStock":true,"ribbon":"","media":"5f58c4_e53e0622d0484ea3be83ad7823f88fe5~mv2.jpg","slug":"evening-of-ritual","hasOptions":false,"story":{"_id":"story-56263ef1-c0c1-e770-2926-ad8bf52a5700","status":"approved","transcript":"Evening of Ritual returns to one of Vettriano's favourite themes: the formalities, and the private ceremonies, of the night.\n\nIn his world the evening has its own codes. Codes of dress, of behaviour, and of what is left unsaid. His figures seem to follow them with great care. The title suggests a scene that has been played many times before, where everyone knows their part. And yet there is always the possibility that tonight, this evening, will turn out differently.\n\nIt is one of the most atmospheric images in our collection, and it rewards a place where it can be looked at often: a living room, a study, a bedroom. It is the kind of picture that seems to change with the light, and with your mood.\n\nThe edition is one of the smallest among his signed releases, just one hundred prints and ten Artist's Proofs, each signed and numbered by Jack Vettriano. Small editions like this are always the first to become hard to find, all the more so now that no new signed prints can ever be made.","edition":"Signed limited edition of 100 + 10 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":"39 x 31","mountSizeCm":"62 x 52","framedSizeCm":"","reviewNotes":"","estDurationSec":72,"themes":"After dark, Style & society","audioUrl":"../audio/evening-of-ritual.mp3"}},{"productId":"29120bb5-682a-d9a4-3247-2f5d9632fa4d","title":"Exit Eden","price":765,"inStock":true,"ribbon":"Artist Proof Available","media":"d9cb8c_185e67220fda410288efaa50f480c177~mv2.png","slug":"exit-eden","hasOptions":true,"story":{"_id":"story-29120bb5-682a-d9a4-3247-2f5d9632fa4d","status":"approved","transcript":"Exit Eden is one of Vettriano's most literary titles. It draws on the oldest story of temptation and loss there is: the expulsion from the Garden of Eden.\n\nIn his hands that ancient idea becomes modern and personal. It is about the moment innocence ends, or the moment a relationship crosses a line that cannot be uncrossed. So many of his paintings deal with desire and its consequences. This is the one whose title says so outright.\n\nIt is also one of the larger images among his signed editions on paper, more than fifty centimetres across, and it has real presence on a wall. Above a fireplace, or as the focal point of a living room, it holds the eye.\n\nThe edition is one hundred and seventy-five prints and twenty Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper, and an Artist's Proof is available. For a collector who wants a statement piece on paper, without moving up to the premium board-mounted editions, it is a compelling choice.","edition":"Signed limited edition of 175 + 20 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":"51.5 x 40.5","mountSizeCm":"74.5 x 61.5","framedSizeCm":"85.5 x 72.5","reviewNotes":"","estDurationSec":69,"themes":"After dark","audioUrl":"../audio/exit-eden.mp3"}},{"productId":"a40f6c22-3067-f84d-275c-025fd182f1ad","title":"Fetish","price":1100,"inStock":false,"ribbon":"Framed","media":"d9cb8c_dc36eec07ec54b98a6737c63ec2d4274~mv2.jpg","slug":"fetish","hasOptions":false,"story":{"_id":"story-a40f6c22-3067-f84d-275c-025fd182f1ad","status":"approved","transcript":"Fetish is Vettriano up close.\n\nA man in a dark suit draws on a cigarette. Across the foreground stretches a woman's stockinged leg. That is all we are given, and it is more than enough.\n\nThis is one of his charged, close-cropped studies of desire, where what is half-seen says as much as anything shown. He was a master of the edge of the frame, of letting the viewer's imagination complete the picture. Here, the cropping is the story. We see the man, his composure, his cigarette. Of her, we see only what he sees.\n\nIt is a bold, cinematic image, very much from the noir side of his work, and it belongs in a private space: a study, a dressing room, a bedroom.\n\nThe edition was published in 2016, one hundred and seventy-five prints and twenty Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper. This example comes mounted and framed, ready to hang.","edition":"Signed limited edition giclée of 175 + 20 Artist's Proofs, published 2016, mounted and framed","medium":"Giclée on 300gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":"48.5 x 41","framedSizeCm":"","reviewNotes":"","estDurationSec":64,"themes":"After dark","audioUrl":"../audio/fetish.mp3"}},{"productId":"d26ba0eb-cb70-bee6-57b1-a424fcabb39b","title":"Heat Wave","price":565,"inStock":true,"ribbon":"Artist Proof Available","media":"5f58c4_8eeccfe2338b4d0bab3acbf03a809c40~mv2.png","slug":"heat-wave","hasOptions":true,"story":{"_id":"story-d26ba0eb-cb70-bee6-57b1-a424fcabb39b","status":"approved","transcript":"Heat Wave. The kind of sultry, airless day that slows everything down.\n\nA woman holds a cold bottle to her forehead against the heat. It is the simplest of gestures, and Vettriano turns it into a whole study of mood and atmosphere. His summer paintings are rarely just about the weather. The heat becomes a backdrop for restlessness, for boredom, or for temptation, and the stillness of the scene leaves plenty of room for the imagination.\n\nThe palette is strong and warm, and there is a relaxed sensuality to it. It suits a living room or a bedroom, and it pairs beautifully with his beach and summer pictures.\n\nThe edition is one hundred and seventy-five prints and twenty Artist's Proofs, each signed and numbered by Jack Vettriano, and an Artist's Proof is available. It is printed on museum etching paper and set in a generous mount, which gives the image space to breathe and real presence on the wall.","edition":"Signed limited edition of 175 + 20 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":"39 x 31","mountSizeCm":"72 x 62","framedSizeCm":"","reviewNotes":"","estDurationSec":64,"themes":"Quiet moments","audioUrl":"../audio/heat-wave.mp3"}},{"productId":"c6b56789-4c97-b603-b4c5-e0e4b92ad350","title":"Her Secret Life","price":950,"inStock":false,"ribbon":"Framed","media":"d9cb8c_daa3f4fa391a4f4eabc024784b298017~mv2.jpg","slug":"her-secret-life","hasOptions":false,"story":{"_id":"story-c6b56789-4c97-b603-b4c5-e0e4b92ad350","status":"approved","transcript":"Her Secret Life. A woman in a black dress makes a call from a seaside phone box, bunting fluttering in the breeze outside.\n\nWho is on the other end of the line? That is the question the title asks, and it is the question Vettriano wants us to carry away with us. The bunting suggests a holiday, a seaside town in its best clothes. And she has slipped away from it all, to make one private call.\n\nIt is a perfect example of how he worked. A single, ordinary moment, a phone box on a promenade, becomes a whole hidden story, simply by giving it the right title and the right light. We are not told what her secret is. We are only told that she has one.\n\nThe painting was shown in Love, Devotion and Surrender, Vettriano's exhibition of June 2006.\n\nThis framed edition was published in 2006, limited to two hundred and ninety-five giclée prints, each signed and numbered by Jack Vettriano.","edition":"Signed limited edition giclée of 295, published 2006, framed","medium":"Giclée","signed":true,"imageSizeCm":"50.8 x 40.6","mountSizeCm":"","framedSizeCm":"","reviewNotes":"","estDurationSec":66,"themes":"By the sea","audioUrl":"../audio/her-secret-life.mp3"}},{"productId":"e722c9b0-b96b-e8ca-4f56-907a2d4b691b","title":"In Thoughts Of You","price":300,"inStock":false,"ribbon":"","media":"d9cb8c_e2045db04b06478ca78f364f22a211a2~mv2.jpg","slug":"in-thoughts-of-you","hasOptions":true,"story":{"_id":"story-e722c9b0-b96b-e8ca-4f56-907a2d4b691b","status":"approved","transcript":"In Thoughts of You. A woman in black sits on a white-draped chair, before a tall window, lost in thought.\n\nIt is one of Vettriano's stillest images. Nothing is happening, and that is precisely the point. The black of her dress against the white of the chair, the height of the window, the quiet of the room: everything draws us towards her, and towards whoever it is she is thinking of. The title addresses that person directly. In thoughts of you.\n\nVettriano painted many women alone like this, waiting, remembering, daydreaming, and these quiet portraits are among the most loved of all his work. They are pictures people choose to live with every day.\n\nThis image has been released in more than one limited edition over the years. This one is printed on Hahnemühle mould-made paper, whose soft surface suits the gentle tones of the scene, in an edition of three hundred and fifty, plus forty Artist's Proofs, each signed and numbered by Jack Vettriano. It is an intimate size, perfect for a bedroom or a reading corner.","edition":"Signed limited edition giclée of 350 + 40 Artist's Proofs","medium":"Giclée on 300gsm Hahnemühle mould-made paper","signed":true,"imageSizeCm":"","mountSizeCm":"34 x 40","framedSizeCm":"","reviewNotes":"","estDurationSec":71,"themes":"Quiet moments","audioUrl":"../audio/in-thoughts-of-you.mp3"}},{"productId":"14fccf88-569f-1ea9-41eb-beb4fd4008a4","title":"Jack Vettriano Portrait by Ian McIlgorm","price":375,"inStock":false,"ribbon":"","media":"d9cb8c_c2a32d522e0143a585bf62910dad1a82~mv2.jpg","slug":"jack-vettriano-portrait-by-ian-mcilgorm","hasOptions":true,"story":{"_id":"story-14fccf88-569f-1ea9-41eb-beb4fd4008a4","status":"approved","transcript":"This piece turns the camera around. For once, Jack Vettriano is not the one creating the image. He is the subject.\n\nThe portrait was made by the acclaimed photographer Ian McIlgorm, during a sitting at the artist's London home. It is a rare, direct encounter with the man behind some of the most recognisable paintings of our time: the self-taught painter from Fife whose cinematic scenes of romance and intrigue found an audience around the world.\n\nThe photograph was shortlisted for the prestigious Taylor Wessing Photographic Portrait Prize in November 2017, and was subsequently exhibited at the National Portrait Gallery in London.\n\nThe edition is tiny: just fifty numbered giclée prints, and each one is signed by both of them, the photographer and the artist. That double signature makes it unusual in any collection of Vettriano's work. For a collector who already owns his paintings, it is a wonderful way to bring the artist himself into the room.","edition":"Limited edition of 50 giclée prints, signed by both Jack Vettriano and Ian McIlgorm","medium":"Giclée on 300gsm museum etching paper","signed":true,"imageSizeCm":"52.5 x 34","mountSizeCm":"77.5 x 57","framedSizeCm":"","reviewNotes":"Photograph of the artist by Ian McIlgorm, not a Vettriano painting - script reflects this.","estDurationSec":63,"themes":"Portraits","audioUrl":"../audio/jack-vettriano-portrait-by-ian-mcilgorm.mp3"}},{"productId":"b8929944-7a73-9987-1462-daaaa6ad10a5","title":"An Imperfect Past","price":1750,"inStock":true,"ribbon":"Limited Edition Silkscreen","media":"d9cb8c_45e56363b13041af9a32244de5a74799~mv2.jpg","slug":"jack-vettriano-print-an-imperfect-past","hasOptions":false,"story":{"_id":"story-b8929944-7a73-9987-1462-daaaa6ad10a5","status":"approved","transcript":"An Imperfect Past brings together two of Vettriano's great loves: the cinema, and the femme fatale.\n\nA woman smokes beside a film projector. The machine suggests old films being replayed, and with them old memories, and the title hints at a history she would perhaps rather forget. It is moody and atmospheric, and it is one of his most admired noir-influenced images.\n\nWhat makes this particular print special is how it was made. This is a silkscreen. Rather than being printed in a single pass, the image is built up one colour at a time, each pushed by hand through its own fine screen. The result is a layered surface, with flat, intense colour that a giclée cannot quite reproduce, and it is why collectors seek out his silkscreens in particular.\n\nThe edition was published in 2003, two hundred and seventy-five prints on heavyweight French Arches paper, and it sold out many years ago. The example we hold is number two hundred and forty, signed and numbered by the artist. Sold-out silkscreens like this one rarely come back to market.","edition":"Signed silkscreen, edition of 275 + 25 Artist's Proofs, published 2003 - this example numbered 240/275","medium":"Silkscreen on 400gsm Velin Arches Blanc","signed":true,"imageSizeCm":"74 x 58","mountSizeCm":"90 x 75","framedSizeCm":"","reviewNotes":"","estDurationSec":72,"themes":"After dark, Rare editions","audioUrl":"../audio/jack-vettriano-print-an-imperfect-past.mp3"}},{"productId":"666d1c91-4127-d060-1a59-6daf4adf5260","title":"Angel","price":465,"inStock":true,"ribbon":"","media":"5f58c4_bff7583b29d244fca73ce19fe1e84fc7~mv2.jpeg","slug":"jack-vettriano-print-angel","hasOptions":true,"story":{"_id":"story-666d1c91-4127-d060-1a59-6daf4adf5260","status":"approved","transcript":"Angel. A single word, and the kind of title Vettriano chose when he wanted you to bring your own meaning to the picture.\n\nAngels, fallen and otherwise, appear more than once in his work. His collection Fallen Angels gave its name to one of his best-known books. In his hands, the word is rarely innocent. It carries affection, and a hint of irony too, and the figures he painted under such titles tend to be rather more complicated than their names suggest.\n\nAngel works beautifully on its own, or as part of a group of his figure studies. It is a moderate size, which makes it adaptable: a bedroom, a study, or a quieter corner of a living room where it can be looked at closely.\n\nThe edition is just one hundred prints and ten Artist's Proofs, one of the smaller runs among his signed releases, each signed and numbered by Jack Vettriano. As one of our more accessible signed editions, it is a lovely way into his work.","edition":"Signed limited edition of 100 + 10 Artist's Proofs","medium":"Giclée on fine art paper","signed":true,"imageSizeCm":"39 x 34","mountSizeCm":"61.5 x 55","framedSizeCm":"","reviewNotes":"","estDurationSec":68,"themes":"Style & society","audioUrl":"../audio/jack-vettriano-print-angel.mp3"}},{"productId":"44e7f6a7-0958-1a2a-5051-b06c4e2d018d","title":"Arrangement In Red, White and Blue","price":1495,"inStock":true,"ribbon":"Premium Limited Edition","media":"5f58c4_64540278538a4500bb7435b81fbcfc9b~mv2.jpg","slug":"jack-vettriano-print-arrangement-in-red-white-and-blue","hasOptions":false,"story":{"_id":"story-44e7f6a7-0958-1a2a-5051-b06c4e2d018d","status":"approved","transcript":"Arrangement in Red, White and Blue borrows its title from the language of fine art.\n\nPainters such as Whistler named their pictures in just this way, Arrangement in Grey and Black, treating them as harmonies of colour as much as portraits of people. Vettriano's title nods to that tradition with a knowing smile. The red, the white and the blue are the key to the whole composition, and the title invites you to look at the picture as a study in colour as well as a scene.\n\nThat palette gives the image a crisp, graphic quality. It is confident and contemporary, and it holds its own in a modern interior just as well as a traditional one.\n\nThis is a Premium Limited Edition, and it is presented very differently from a paper print. It is reproduced at the same size as the original painting, board mounted, then finished by hand with three coats of lacquer for a satin surface, closer to canvas than paper. It arrives in the same style of frame used for his original work, with no border and no glass. The edition is one hundred and twenty-five, plus fifteen Artist's Proofs, each signed and numbered by Vettriano in silver pen.","edition":"Premium limited edition of 125 + 15 Artist's Proofs, signed in silver pen; original-size, board-mounted, hand-lacquered","medium":"Giclée, board mounted, hand-embellished with 3 coats of lacquer, no glass","signed":true,"imageSizeCm":"38.1 x 30.5","mountSizeCm":"","framedSizeCm":"59.2 x 51.6","reviewNotes":"","estDurationSec":81,"themes":"Style & society, Rare editions","audioUrl":"../audio/jack-vettriano-print-arrangement-in-red-white-and-blue.mp3"}},{"productId":"3f7de79f-e526-8bf4-ca05-5717d4559504","title":"At Last, My Lovely","price":1750,"inStock":true,"ribbon":"Artist Proof","media":"d9cb8c_432afed5d17f48999f2abfc9d3e6b960~mv2.jpg","slug":"jack-vettriano-print-at-last-my-lovely","hasOptions":false,"story":{"_id":"story-3f7de79f-e526-8bf4-ca05-5717d4559504","status":"approved","transcript":"At Last, My Lovely. It has the warmth of a song lyric, and the relief of a long wait finally over.\n\nThis is a title about reunion: the person you have been waiting for, at last walking through the door. Vettriano's paintings so often hover between romance and melancholy. This one leans, quite openly, towards romance.\n\nThe print you are looking at is something special. It is an Artist's Proof. The edition comprised one hundred and twenty-five prints, plus just fifteen proofs, traditionally set aside for the artist himself. That scarcity is why collectors prize them, and this one is signed by Jack Vettriano and comes with its certificate of authenticity.\n\nIt is a compact image, printed on heavy museum etching paper, which makes it a lovely choice for a bedroom, or as a gift for someone who has been worth the wait. And it sits very comfortably within a group of his smaller prints.","edition":"Artist's Proof from an edition of 125 + 15 Artist's Proofs, signed","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":"20.5 x 25.5","mountSizeCm":"41.5 x 48.4","framedSizeCm":"","reviewNotes":"","estDurationSec":62,"themes":"Romance, Rare editions","audioUrl":"../audio/jack-vettriano-print-at-last-my-lovely.mp3"}},{"productId":"ef6e2e1e-5830-185f-b28b-17685b88f636","title":"Bird On The Wire","price":1650,"inStock":true,"ribbon":"Framed","media":"d9cb8c_19ae50643a36421ea13bfedbeaf2ebc8~mv2.jpg","slug":"jack-vettriano-print-bird-on-the-wire","hasOptions":false,"story":{"_id":"story-ef6e2e1e-5830-185f-b28b-17685b88f636","status":"approved","transcript":"Bird on the Wire takes its title from Leonard Cohen's celebrated song, a song about freedom, longing, and imperfect love.\n\nVettriano often borrowed his titles from music he admired. They add a second layer of meaning to the paintings, and invite you to bring the mood of the song to the image. Hum a few bars of Cohen as you look at this one, and you will see what he meant.\n\nThis is a statement piece. At ninety-seven by seventy-nine centimetres, it is one of the largest prints in our collection, with the presence to command a living-room wall, or the main wall of a hallway or a stairwell.\n\nAnd it is a silkscreen. Each colour was laid down separately, pushed by hand through its own fine screen, building a layered surface with flat, intense colour that a giclée cannot quite reproduce. It was published in 2003, in an edition of two hundred and seventy-five, plus thirty Artist's Proofs, each signed and numbered by Jack Vettriano, on heavyweight French Arches paper, much loved by printmakers.","edition":"Signed silkscreen, edition of 275 + 30 Artist's Proofs, published 2003","medium":"Silkscreen on 400gsm Velin Arches Blanc","signed":true,"imageSizeCm":"","mountSizeCm":"97 x 79","framedSizeCm":"","reviewNotes":"","estDurationSec":70,"themes":"Romance, Rare editions","audioUrl":"../audio/jack-vettriano-print-bird-on-the-wire.mp3"}},{"productId":"6e9e1a5d-ed72-99b5-23b7-711c4847ee51","title":"Bluebird at Bonneville","price":7350,"inStock":true,"ribbon":"Premium Limited Edition","media":"5f58c4_4a153cba72414f1c8201b36d0fdfee6b~mv2.jpeg","slug":"jack-vettriano-print-bluebird-at-bonneville","hasOptions":false,"story":{"_id":"story-6e9e1a5d-ed72-99b5-23b7-711c4847ee51","status":"approved","transcript":"Bluebird at Bonneville is one of Vettriano's most ambitious, and most distinctive, paintings.\n\nIt takes us to the golden age of the land speed record. Sir Malcolm Campbell brought his Blue Bird to the Bonneville Salt Flats in Utah, and in 1935 he became the first person to drive at more than three hundred miles an hour. Vettriano was fascinated by that era, its daring, its engineering, its glamour. And the vast white expanse of the salt flats gives this picture a scale and an openness that is rare in his work.\n\nIt is loved by motor-racing enthusiasts as much as by Vettriano collectors, and it has a companion in Pendine Beach, another of his paintings set at a famous land speed venue.\n\nThis premium edition was released as a celebration of his greatest works. It is reproduced at the full size of the original painting, twenty-four by forty inches, board mounted and finished by hand with three coats of lacquer, then framed exactly as an original would be, with no border and no glass. Just seventy-five were made, plus seven Artist's Proofs, each signed and numbered by Vettriano in silver pen. It is one of the most significant premium editions he ever released.","edition":"Premium limited edition of 75 + 7 Artist's Proofs, original size (24 x 40 in), signed in silver pen","medium":"Giclée, board mounted, hand-embellished with 3 coats of lacquer, no glass","signed":true,"imageSizeCm":"61 x 101.6","mountSizeCm":"","framedSizeCm":"","reviewNotes":"","estDurationSec":82,"themes":"Rare editions","audioUrl":"../audio/jack-vettriano-print-bluebird-at-bonneville.mp3"}},{"productId":"acd35c06-6607-fff2-fe55-ebeea69fa396","title":"Heaven Or Hell","price":1950,"inStock":true,"ribbon":"Framed","media":"d9cb8c_32d57889b5174aadaf1a29cc3f33a9b6~mv2.jpg","slug":"jack-vettriano-print-heaven-or-hell","hasOptions":false,"story":{"_id":"story-acd35c06-6607-fff2-fe55-ebeea69fa396","status":"approved","transcript":"Heaven or Hell comes from the most sensual chapter of Vettriano's work.\n\nIts full title is Heaven or Hell: the Sweetest Choice, and it belongs to the imagery of The Red Room Collection, a folio of five of his most daring paintings, published as signed limited editions in 2014. The title captures the dilemma at the heart of all of them: desire that promises bliss, and risks the consequences, in the very same moment.\n\nVettriano never shied away from sensuality, and the Red Room images are among his boldest. This is a picture for a private space, a bedroom or a dressing room, and for the collector who appreciates the more daring side of his art.\n\nThis is a rare signed limited edition, offered on its own, separately from the five-print folio, which is also in our collection. It is signed by Jack Vettriano an
