2.jpg","story":{"_id":"story-b0afab77-2ad4-3ad3-abd9-59ddd1593e83","status":"draft","transcript":"Queen of the Waltzers. It is one of Vettriano's most evocative titles.\n\nThe Waltzers is the classic fairground ride: spinning cars, loud music, coloured lights. And the title conjures the young woman who rules it, the one everyone notices as the cars whirl past.\n\nIt is a title rooted in the working-class Scotland Vettriano came from, where the dance hall and the fair were where people went to see, and to be seen. He often said that his paintings drew on memory, and on the social world of his youth in Fife, and titles like this carry that sense of time and place.\n\nThere is warmth in this picture, and more than a hint of nostalgia. For anyone who remembers the fair coming to town, it will strike a chord.\n\nThe edition is one hundred and twenty-five prints and fifteen Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper. It is a compact image, easy to place in almost any room, and one of the most approachable signed editions in our collection.","edition":"Signed limited edition of 125 + 15 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":[20.6,25],"mountSizeCm":[42.6,49],"framedSizeCm":[53,59.4],"reviewNotes":"","estDurationSec":70,"audioUrl":"","audioCurrent":false}},{"productId":"368a3d1b-b3e4-1a93-bd0c-11bb58b3ea4a","title":"Scorched","price":1150,"inStock":false,"ribbon":"Artist Proof","image":"https://static.wixstatic.com/media/d9cb8c_9470a57e16df4e17b2c48739db3f9737~mv2.jpg","story":{"_id":"story-368a3d1b-b3e4-1a93-bd0c-11bb58b3ea4a","status":"draft","transcript":"Scorched. A woman in a black swimsuit lies stretched out on the sand, under a hot sky.\n\nIt is one of Vettriano's simplest beach images, and one of his most striking. There is no second figure, no story to untangle, no umbrella or dance partner. Just a single figure, the sand, and the heat. And the title, one word, tells you exactly how that sun feels.\n\nHe grew up on the Fife coast, and the beach was his great stage. Here, he strips that stage right back to its essentials, and the result is bold, graphic, and utterly confident.\n\nThe original oil was painted in 2012, and it was chosen for Jack Vettriano: A Retrospective, at Kelvingrove Art Gallery and Museum in Glasgow, in 2013 and 2014. The original has since sold.\n\nThis print is an Artist's Proof, from an edition of two hundred and fifty prints, published in 2013, with just twenty-five proofs. It is signed by Jack Vettriano, and printed on heavyweight museum etching paper.","edition":"Artist's Proof from a signed edition of 250 + 25 Artist's Proofs, published 2013","medium":"Giclée on 350gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":[46.8,42.8],"framedSizeCm":"","reviewNotes":"","estDurationSec":67,"audioUrl":"","audioCurrent":false}},{"productId":"77c9e91e-6db4-4241-c6f5-90a9093257cb","title":"Summer Days Triptych","price":125,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/5f58c4_99cc3daa2d474c3ab1bfab43a030deb4~mv2.jpg","story":{"_id":"story-77c9e91e-6db4-4241-c6f5-90a9093257cb","status":"draft","transcript":"The Summer Days Triptych brings together three of Vettriano's early beach paintings: Green and Blue, Pink and Saffron, and Trailing Toes, all painted in 1993.\n\nEach shows women by the sea in summer dresses, walking or resting on the sand, parasols raised against the sun. Together they make one of his most relaxed and joyful groups of work, closer in mood to a sunny afternoon than to the noir tension of his interiors.\n\nThey were painted in the early nineteen-nineties, as his reputation was growing fast, and they show his early fascination with colour, with costume, and with the shoreline as a stage. The dresses give the series its palette, and the titles take their names straight from those colours. Seen side by side, the three images read like scenes from the same long summer's day.\n\nThe triptych has been released as a Special Open Edition, three high-quality giclées on museum etching paper. Framed identically and hung in a row, as a triptych is meant to be seen, they make a wonderful first Vettriano, a lovely gift, or the heart of a summer room.","edition":"Special Open Edition set of three giclées (unsigned, unnumbered)","medium":"Giclée on 300gsm museum etching paper (x3)","signed":false,"imageSizeCm":[25.5,21],"mountSizeCm":"","framedSizeCm":"","reviewNotes":"Open edition, no COA listed - script avoids implying signature or limitation. View-in-room should show three panels side by side.","estDurationSec":74,"audioUrl":"","audioCurrent":false}},{"productId":"add3fd82-1318-149d-ba4a-9a175a326907","title":"The Billy Boys","price":765,"inStock":true,"ribbon":"Artist Proof Available","image":"https://static.wixstatic.com/media/5f58c4_19f3f740afce4661bc8030d094fee24f~mv2.jpeg","story":{"_id":"story-add3fd82-1318-149d-ba4a-9a175a326907","status":"draft","transcript":"The Billy Boys. A short, punchy title, the kind Vettriano favoured when he wanted us to bring our own story to the picture.\n\nHis work is full of figures who carry themselves with style and swagger. Sharp suits, a certain set of the shoulders, the confidence of men who know they are being watched. Titles like this one add a harder, more down-to-earth edge to the elegance he is famous for. These are not drawing-room gentlemen. They are the lads from the dance hall, dressed up for the night.\n\nIt is one of the larger signed prints on paper in our collection, with real presence on a wall. It works as a single statement piece in a living room, a study or a hallway, or alongside his other larger signed editions.\n\nThe edition is two hundred and seventy-five prints and thirty Artist's Proofs, each signed and numbered by Jack Vettriano, on heavyweight museum etching paper, and an Artist's Proof is available for the collector who wants the rarer example.","edition":"Signed limited edition of 275 + 30 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":[40.6,50.8],"mountSizeCm":[63.7,71.8],"framedSizeCm":[74.3,82.4],"reviewNotes":"Product copy has little on the painting itself - Studio may want to add a line from the blog post.","estDurationSec":68,"audioUrl":"","audioCurrent":false}},{"productId":"015d1a01-b566-9aa7-1d0a-c067ba3d5b67","title":"The Blue Gown","price":560,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/5f58c4_c1d01f6e87ad4c7e84a62a733029981d~mv2.jpg","story":{"_id":"story-015d1a01-b566-9aa7-1d0a-c067ba3d5b67","status":"draft","transcript":"The Blue Gown is one of Vettriano's most intimate compositions.\n\nA woman stands before a mirror, holding a blue gown. She is caught in a private moment of choosing, or perhaps of deciding whether to go out at all. The rich blue of the dress against the darker tones of the room gives the picture its focus, and the mirror adds the layer of looking, and of being looked at, that runs through so much of his work.\n\nVettriano returned again and again to the dressing room and the boudoir, where his figures prepare for an evening whose outcome we never see. These pictures are less about glamour than about anticipation. The Blue Gown is one of the finest examples, and it has become one of the most popular images in our collection.\n\nThe edition is one hundred and twenty-five prints and fifteen Artist's Proofs, each signed and numbered by Jack Vettriano. It is a generous size for a living room or bedroom wall, without overpowering the space, and it can be supplied framed by the publisher. As a first Vettriano, or as an addition to an established collection, it is a beautiful choice.","edition":"Signed limited edition of 125 + 15 Artist's Proofs","medium":"Giclée","signed":true,"imageSizeCm":[39,31],"mountSizeCm":[61.5,52],"framedSizeCm":[71.7,62.4],"reviewNotes":"See note on the framed Blue Gown listing about differing descriptions.","estDurationSec":78,"audioUrl":"","audioCurrent":false}},{"productId":"d2bec85f-f3a5-f0c6-3c79-d923258b03cd","title":"The Blue Gown (framed)","price":850,"inStock":false,"ribbon":"Framed","image":"https://static.wixstatic.com/media/5f58c4_df27f3dad3f041aa90200d4be86e378a~mv2.jpeg","story":{"_id":"story-d2bec85f-f3a5-f0c6-3c79-d923258b03cd","status":"draft","transcript":"The Blue Gown. A woman in a blue ball gown before a mirror, studying herself, before the evening ahead.\n\nIt is a private, expectant moment, and Vettriano paints it in his richest, most cinematic light. The deep blue of the gown glows against the darker room, and the mirror adds the layer of looking, and of being looked at, that runs through so much of his work.\n\nHe returned often to the dressing room, where his figures prepare for an evening whose outcome we never see. These pictures are less about glamour than about anticipation: the breath held before the door opens. The Blue Gown is one of the finest of them, and one of the most popular images in our collection.\n\nThe edition is one hundred and twenty-five prints and fifteen Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper. This example comes framed, ready for a bedroom or a dressing-room wall.","edition":"Signed limited edition of 125 + 15 Artist's Proofs, framed","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":[37.5,31],"mountSizeCm":[69.5,52],"framedSizeCm":"","reviewNotes":"The two Blue Gown listings describe the composition differently (back to viewer at mirror vs holding gown before mirror) and give slightly different sizes - Studio to confirm before recording.","estDurationSec":63,"audioUrl":"","audioCurrent":false}},{"productId":"a6b2c741-0dbb-a817-052a-f1f70053af3b","title":"The Contemplation Series","price":1685,"inStock":false,"ribbon":"","image":"https://static.wixstatic.com/media/d9cb8c_49eccc559f914397b8a59f919fb84ce3~mv2.jpg","story":{"_id":"story-a6b2c741-0dbb-a817-052a-f1f70053af3b","status":"draft","transcript":"The Contemplation Series is not one print, but five, and together they tell you a great deal about the later Vettriano.\n\nThe set brings together Baby, Bye Bye; Black on Blonde; Edinburgh Afternoon; Model in Westwood; and The Very Thought of You. All five were published for the first time as signed limited editions in 2015, and as the name suggests, they share a mood: atmospheric, reflective, and quietly thought-provoking.\n\nThese are not his dramatic noir scenes. They are moments of pause. A woman at a window after a farewell. A study in black against fair hair. An afternoon in Edinburgh. A model, posed and aware of being looked at. And a title borrowed from a love song. Hung together, they read like five chapters from the same novel.\n\nWhat makes this set special for a collector is that the five prints come with matching edition numbers. Each is signed and numbered by Jack Vettriano, from an edition of two hundred and fifty, on Hahnemühle museum etching paper. A matched set like this is far harder to assemble than five individual prints, and it makes a remarkable wall.","edition":"Set of five signed giclées with matching edition numbers, edition of 250 + 25 Artist's Proofs, published 2015","medium":"Giclée on 300gsm Hahnemühle museum etching paper (x5)","signed":true,"imageSizeCm":[31,39],"mountSizeCm":[41,49],"framedSizeCm":"","reviewNotes":"Five-piece set - view-in-room should show five sheets.","estDurationSec":75,"audioUrl":"","audioCurrent":false}},{"productId":"8b4517a2-0a5a-84b2-fec5-f62d4389857b","title":"The Devoted Dressmaker","price":625,"inStock":true,"ribbon":"Framed","image":"https://static.wixstatic.com/media/d9cb8c_03e2bf6a115944a09c07a54fd0948124~mv2.jpg","story":{"_id":"story-8b4517a2-0a5a-84b2-fec5-f62d4389857b","status":"draft","transcript":"The Devoted Dressmaker turns to a figure who stands behind the scenes of so much of Vettriano's work.\n\nHis paintings are full of beautiful clothes, from evening gowns to tailored suits. And the dressmaker is the person who makes all of that glamour possible. The title is affectionate, and a little mysterious. Devoted to her craft? Or devoted to the person she is dressing?\n\nClothing was never just decoration for Vettriano. The cut of a dress, a stocking seam, a pair of gloves: these tell us who his characters are, and what they want. This painting puts that lifelong fascination with dress right at its centre.\n\nIt was released on the twenty-third of November 2018, one of the later editions published in his lifetime, as a signed limited edition of one hundred and twenty-five prints and fifteen Artist's Proofs, each signed and numbered by Jack Vettriano.\n\nIt is a small, intimate image, on museum etching paper, and this example comes framed. It belongs in a bedroom, a dressing room, or a study, and it brings a more recent image to any collection.","edition":"Signed limited edition of 125 + 15 Artist's Proofs, released 23 November 2018","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":[20.5,25.5],"mountSizeCm":[41.5,48],"framedSizeCm":"","reviewNotes":"Product copy says 'Price on application' but listing is priced at GBP 625 - Studio to reconcile.","estDurationSec":73,"audioUrl":"","audioCurrent":false}},{"productId":"6fc5b2cb-7077-bb23-6eca-6d47dc0c21eb","title":"The Last Great Romantic","price":445,"inStock":false,"ribbon":"","image":"https://static.wixstatic.com/media/5f58c4_180e70410c9144689b0b1a2239089013~mv2.jpeg","story":{"_id":"story-6fc5b2cb-7077-bb23-6eca-6d47dc0c21eb","status":"draft","transcript":"The Last Great Romantic. A man in a fedora kisses a woman in a yellow dress, in a doorway by the sea.\n\nIf you had to choose a single picture to sum up the mood of Vettriano's work, you could do far worse than this. The style: the hat, the dress, the sea beyond. The longing. And a kiss that feels like the final scene of a film, the moment before the credits roll.\n\nThe title could describe the man in the painting. Some would say it describes the painter, too. Vettriano spent a career painting romance, never quite innocent and never quite simple, and always with a sense that it might be the last of its kind.\n\nThe yellow dress is a beautiful touch, a burst of warmth against the doorway and the sea, drawing the eye straight to the embrace.\n\nThe edition is small, one hundred and fifteen prints and fifteen Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper. It is a lovely, intimate size, and it makes a perfect gift for the romantic in your life.","edition":"Signed limited edition of 115 + 15 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":[30.5,25.5],"mountSizeCm":[53.5,46.5],"framedSizeCm":"","reviewNotes":"","estDurationSec":74,"audioUrl":"","audioCurrent":false}},{"productId":"0d4dfd33-07f0-70a1-1635-96e4fe3d98de","title":"The Letter","price":2950,"inStock":false,"ribbon":"Premium Limited Edition","image":"https://static.wixstatic.com/media/5f58c4_f5f12947ce9d438a8cf70dd26c7fc6bc~mv2_d_1920_1519_s_2.jpg","story":{"_id":"story-0d4dfd33-07f0-70a1-1635-96e4fe3d98de","status":"draft","transcript":"The Letter. A woman lies on a chaise longue in a quiet room. Beside her, on the floor, a letter has fallen.\n\nWhat did it say? Was it the letter she had been waiting for, or the one she had dreaded? Has she read it and let it fall, or is she not yet ready to pick it up? Vettriano gives us every clue except the one that matters, and that is exactly why the picture stays with you.\n\nIt is a scene of complete stillness, and yet something has clearly just happened. That was his particular gift: the quiet room in the moments after the drama.\n\nThe Letter was chosen for a premium signed edition celebrating Jack Vettriano's greatest works, released on the thirteenth of September 2019. It is reproduced at the full size of the original painting, thirty by twenty-four inches, board mounted and finished by hand with three coats of lacquer for a satin surface. It arrives in the same style of frame used for his original work, with no border and no glass.\n\nThe edition is tiny: just fifty, plus five Artist's Proofs, each signed and numbered by Vettriano in silver pen.","edition":"Premium limited edition of 50 + 5 Artist's Proofs, original size (30 x 24 in), signed in silver pen, released 13 Sept 2019","medium":"Giclée, board mounted, hand-embellished with 3 coats of lacquer, no glass","signed":true,"imageSizeCm":[76.2,61],"mountSizeCm":"","framedSizeCm":[83,98],"reviewNotes":"Framed size (83 x 98) reads portrait while image size (30 x 24) reads landscape-ambiguous - confirm orientation for view-in-room.","estDurationSec":78,"audioUrl":"","audioCurrent":false}},{"productId":"10a47393-e4b1-4471-4ae6-59b3f27645f6","title":"The Look Of Love","price":850,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/d9cb8c_3cef4be386e847fbac35b0cca69a3beb~mv2.jpg","story":{"_id":"story-10a47393-e4b1-4471-4ae6-59b3f27645f6","status":"draft","transcript":"The Look of Love takes its title from the Burt Bacharach song, made famous by Dusty Springfield, and it shares that song's mood exactly: longing, and romance, and a little ache.\n\nVettriano often found his titles in the music of the nineteen-fifties and sixties. They give his paintings a nostalgic, cinematic quality, as though each one had its own soundtrack. Here, the title asks us to read every glance and every gesture as a sign of love: love given, or love withheld.\n\nPlay the song in your head as you look, and the picture comes alive in a different way.\n\nIt is one of the larger signed prints on paper in our collection, with real presence, and it belongs in a living room or a bedroom, where it can be enjoyed every day.\n\nThe Look of Love was published in 2010 as a limited edition giclée of two hundred and fifty prints, plus twenty-five Artist's Proofs, each signed and numbered by Jack Vettriano, on heavyweight museum etching paper.","edition":"Signed limited edition giclée of 250 + 25 Artist's Proofs, published 2010","medium":"Giclée on 350gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":[64,54.5],"framedSizeCm":"","reviewNotes":"","estDurationSec":67,"audioUrl":"","audioCurrent":false}},{"productId":"0a7b5641-6bc2-6654-605d-1ee7fc46b7d3","title":"The Runaways","price":535,"inStock":true,"ribbon":"Artist Proof Available","image":"https://static.wixstatic.com/media/5f58c4_df575f96926145418a46d4de108138db~mv2.jpg","story":{"_id":"story-0a7b5641-6bc2-6654-605d-1ee7fc46b7d3","status":"draft","transcript":"The Runaways. A title full of escape.\n\nVettriano's paintings are crowded with people caught between one life and another. Arriving at a hotel. Leaving a party. Slipping away together from somewhere they really ought to be. This title gives the image that same feeling, of a story already well under way, and of two people who have chosen each other over everything else.\n\nWhere are they running from? And will anyone come after them? As ever, he leaves the ending to us.\n\nIt is a compact image, which makes it one of the easiest Vettriano prints to place: on a narrow wall, a landing, a hallway, or as part of a group with his other small-format editions.\n\nThe edition is one hundred and seventy-five prints and twenty Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper, and an Artist's Proof is available. Smaller signed editions like this are often where collectors begin, and they remain a lovely way to add another Vettriano story to a growing collection.","edition":"Signed limited edition of 175 + 20 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":[21,25.5],"mountSizeCm":[42,48.5],"framedSizeCm":[52.6,59.1],"reviewNotes":"","estDurationSec":68,"audioUrl":"","audioCurrent":false}},{"productId":"551c0ac5-2f75-32a2-4ce7-b02f856223f6","title":"The Sailor's Toy","price":535,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/5f58c4_fbb003e6cfb04dbfb11a9d44d1794f9d~mv2.png","story":{"_id":"story-551c0ac5-2f75-32a2-4ce7-b02f856223f6","status":"draft","transcript":"The Sailor's Toy is one of the newest images in the Vettriano canon, published after the artist's death in March 2025 as an official posthumous edition.\n\nListen to the title for a moment. It has that wry, double-edged quality Vettriano loved: a hint of a story between two people, and no promise about who is playing with whom. That is how his best work operates. A single moment, staged as carefully as a film still, where the clothes, the setting and the body language suggest far more than they ever show.\n\nBecause the artist can no longer sign, each print in this edition of just one hundred is numbered and embossed with the official stamp of the Estate of Jack Vettriano. That stamp, with the edition number and the certificate of authenticity, records exactly where your print sits in the run.\n\nIt is a smaller, intimate format, printed on heavy museum etching paper, and it rewards being seen up close: a study, a hallway, a bedroom wall. And for a collector already building a Vettriano wall, it is a quiet way to add one of the very last images to be released.","edition":"Posthumous limited edition of 100, numbered and embossed with the Estate stamp","medium":"300gsm museum etching paper","signed":false,"imageSizeCm":[25.5,20.4],"mountSizeCm":[48,42.4],"framedSizeCm":[58.4,52.8],"reviewNotes":"","estDurationSec":77,"audioUrl":"","audioCurrent":false}},{"productId":"43c31f09-d23a-1ff1-4363-b5df66a06876","title":"The Sparrow And The Hawk","price":765,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/d9cb8c_671ab01dcc4244fa857920f64c033375~mv2.jpg","story":{"_id":"story-43c31f09-d23a-1ff1-4363-b5df66a06876","status":"draft","transcript":"The Sparrow and the Hawk is one of Vettriano's most theatrical paintings.\n\nA masked man and a woman, in a richly furnished room, beside a desk and a classical bust. The title casts them as predator and prey. But look again, and it is not at all clear which of them is which.\n\nMasks, disguise and role-play run all through his later work, and this is one of the most memorable examples. It has the feel of a scene from a period drama, or a masquerade, where everyone is playing a part, and the real game is happening beneath the costume.\n\nThe setting is sumptuous, and the sense of narrative is strong, which makes it a natural focal point. It belongs in a living room, a library, or a dining room: anywhere a painting with a story can hold its own, and start a conversation.\n\nIt was published in 2013, in an edition of two hundred and fifty prints and twenty-five Artist's Proofs, each signed and numbered by Jack Vettriano, on a heavier museum etching paper than many of his editions. With its generous mount, it has considerable presence on the wall.","edition":"Signed limited edition giclée of 250 + 25 Artist's Proofs, published 2013","medium":"Giclée on 350gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":[84.5,73.7],"framedSizeCm":[95.1,84.3],"reviewNotes":"","estDurationSec":77,"audioUrl":"","audioCurrent":false}},{"productId":"343c13e9-3175-bc44-820a-e806954c3769","title":"The Tuiga Collection","price":1500,"inStock":false,"ribbon":"","image":"https://static.wixstatic.com/media/d9cb8c_c017248f26144dbc90c43b8df94e523d~mv2.jpg","story":{"_id":"story-343c13e9-3175-bc44-820a-e806954c3769","status":"draft","transcript":"The Tuiga Collection takes us to Monaco, and to the sea.\n\nIn 2009, Vettriano held an exhibition at the Monaco Yacht Club called Homage à Tuiga. It was inspired by the centenary of the club's world-famous yacht, Tuiga. This set of four prints brings together images from that exhibition: Below Deck; Masthead; Ship of Dreams; and Sunshine and Champagne.\n\nIt is a side of Vettriano many people do not know. Instead of Scottish beaches and smoky bars, here is the glamour of the Riviera, classic sailing, and long, sunlit days on the water. And yet the titles are pure Vettriano: Ship of Dreams, Sunshine and Champagne. There is romance on board, as there always is in his world.\n\nFor a collector, the set has real rarity. It is limited to just seventy-five, plus seven Artist's Proofs, each print signed by Jack Vettriano, and published in 2009.\n\nFramed together, the four make a beautiful group, perfect for a study, a coastal home, or for anyone who loves the sea.","edition":"Set of four signed giclées, edition of 75 + 7 Artist's Proofs, published 2009","medium":"Giclée (x4)","signed":true,"imageSizeCm":[28.7,24],"mountSizeCm":[50,40],"framedSizeCm":[55,45],"reviewNotes":"Four-piece set - view-in-room should show four frames.","estDurationSec":67,"audioUrl":"","audioCurrent":false}},{"productId":"f343f2b8-1f83-72df-6394-d9793dd261c7","title":"The Very Thought of You","price":560,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/d9cb8c_0781c741aecf40118504a651358e8316~mv2.jpg","story":{"_id":"story-f343f2b8-1f83-72df-6394-d9793dd261c7","status":"draft","transcript":"The Very Thought of You takes its title from the 1934 Ray Noble song, later recorded by Nat King Cole and so many others.\n\nIt is a song about being utterly consumed by thoughts of someone, and Vettriano's painting carries that same dreamy, romantic mood. His love of the great popular standards runs right through his titles. It is as if each painting comes with its own soundtrack, and here you can almost hear it playing.\n\nPublished in 2015, this is one of his later editions, from a period when his work often became more intimate and gentle. It is a natural fit for a bedroom or a sitting room, and it makes a beautiful gift for someone you think of in just that way.\n\nThe edition is two hundred and fifty prints and twenty-five Artist's Proofs, each signed and numbered by Jack Vettriano, printed on heavy museum etching paper. It is one of the most accessible signed editions in our collection.","edition":"Signed limited edition giclée of 250 + 25 Artist's Proofs, published 2015","medium":"Giclée on 300gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":[41,49],"framedSizeCm":[62.7,72.7],"reviewNotes":"","estDurationSec":65,"audioUrl":"","audioCurrent":false}},{"productId":"5c84030c-4049-7b96-b391-5e2bff25120c","title":"The Weight","price":950,"inStock":false,"ribbon":"","image":"https://static.wixstatic.com/media/d9cb8c_90c6b434ee1c4cf5a29bb0ba16a561cf~mv2.jpg","story":{"_id":"story-5c84030c-4049-7b96-b391-5e2bff25120c","status":"draft","transcript":"The Weight is a self-portrait, and it is one of the most personal paintings Jack Vettriano ever made.\n\nThe artist sits on the edge of a bed in his waistcoat, head bowed, as if carrying something heavy. There is no glamour here, no dance floor, no seduction. Only a man alone with his thoughts. For a painter so often associated with the stylish surfaces of other people's lives, it is a remarkably honest image of his own.\n\nThe painting was shown in his exhibition Days of Wine and Roses in 2010, and the original is now on long-term display at the Scottish National Portrait Gallery in Edinburgh. That is a rare honour, and it tells you how seriously this picture is regarded.\n\nThis edition was published in 2010: two hundred and fifty prints and twenty-five Artist's Proofs, each signed and numbered by the artist. For a collector who wants to understand the man behind the paintings, there is no more revealing image.","edition":"Signed limited edition giclée of 250 + 25 Artist's Proofs, published 2010","medium":"Giclée on 350gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":[41.5,49],"framedSizeCm":"","reviewNotes":"","estDurationSec":65,"audioUrl":"","audioCurrent":false}},{"productId":"1a8307f9-8f0b-d118-731f-6bb8d4385f17","title":"Waltzers","price":300,"inStock":false,"ribbon":"","image":"https://static.wixstatic.com/media/d9cb8c_ca0b7269784648a2aa11428f3ac3996a~mv2.jpg","story":{"_id":"story-1a8307f9-8f0b-d118-731f-6bb8d4385f17","status":"draft","transcript":"Waltzers. Couples dance beneath the trees on a summer night, the women in pale evening gowns, the men in dark suits.\n\nThis is one of Vettriano's most romantic outdoor scenes, all movement and starlight. Dancing runs right through his work. He painted it on beaches, in ballrooms and in quiet rooms, and it stood, for him, for a kind of elegance and courtship that belongs to another era.\n\nHere, the contrast does the work: pale gowns against dark suits, figures turning against the night. You can almost feel the warmth of the evening and hear the music drifting between the trees.\n\nThe edition was published in 2014: three hundred and fifty prints and thirty-five Artist's Proofs, each signed and numbered by Jack Vettriano. It is a compact, joyful image, and a lovely way to bring some of that summer-night romance into a home.","edition":"Signed limited edition giclée of 350 + 35 Artist's Proofs, published 2014","medium":"Giclée on 300gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":[34.3,41],"framedSizeCm":"","reviewNotes":"","estDurationSec":57,"audioUrl":"","audioCurrent":false}},{"productId":"1be66a27-fa93-4a54-eef3-87f10a625ca1","title":"Wicked Games","price":895,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/5f58c4_0a2d3bbe8fd64c8cb90652076d40cedc~mv2.jpg","story":{"_id":"story-1be66a27-fa93-4a54-eef3-87f10a625ca1","status":"draft","transcript":"Wicked Games was published in November 2020, and it is one of the later signed editions released in Vettriano's lifetime.\n\nThe title, borrowed from the language of pop songs and film, sets up exactly the kind of story he loved to tell: a game of attraction and power between two people, played by rules only they understand. We are not told who is winning. That is left, as always, to us.\n\nHis later work kept the cinematic glamour of his earlier paintings, but it often became more intimate and pared back, and you can feel that here. It is a stylish, compact image, at home in a bedroom, a dressing room or a study.\n\nThe edition is small: just one hundred prints and ten Artist's Proofs, each signed and numbered by Jack Vettriano. That makes it relatively scarce. And for a collection weighted towards his better-known images of the 1990s, it adds real range: a glimpse of the artist in his final years.","edition":"Signed limited edition giclée of 100 + 10 Artist's Proofs, published 27 November 2020","medium":"Giclée on 300gsm museum etching paper","signed":true,"imageSizeCm":[32.5,39],"mountSizeCm":[55.5,60],"framedSizeCm":"","reviewNotes":"","estDurationSec":65,"audioUrl":"","audioCurrent":false}},{"productId":"7c4eeb6e-5e03-a00d-6ca3-6de25a181359","title":"Young Hearts","price":560,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/5f58c4_5076f2c86f664688827f4fa6dd11b480~mv2.png","story":{"_id":"story-7c4eeb6e-5e03-a00d-6ca3-6de25a181359","status":"draft","transcript":"Young Hearts takes Vettriano back to the setting he made his own: the beach.\n\nHe grew up on the Fife coast, and the shoreline returns again and again in his paintings, as a stage where people dress up, dance, or simply wait beneath skies that seem to be holding their breath. Here a couple stand together by the sea, and the mood is not the dark, noir tension of his interiors but something gentler: romance, and a touch of nostalgia.\n\nThe title points to first love, or at least the memory of it. This is the kind of picture people buy because it reminds them of someone, which is perhaps why his beach paintings have always been among his most loved.\n\nYoung Hearts is an official posthumous edition, released after the artist's death in 2025, limited to one hundred prints and ten Studio Proofs. In place of a signature, each one is numbered and embossed with the stamp of the Estate of Jack Vettriano, and it comes with a certificate of authenticity.","edition":"Posthumous limited edition of 100 + 10 Studio Proofs, numbered and embossed with the Estate stamp","medium":"300gsm museum etching paper","signed":false,"imageSizeCm":[39,30.7],"mountSizeCm":[61.5,52],"framedSizeCm":[71.7,62.4],"reviewNotes":"","estDurationSec":69,"audioUrl":"","audioCurrent":false}}], rooms: [], items: [], requests: [] };

.item { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; padding: 14px 0; border-bottom: 1px solid #efebe4; }
.item img, .pick img { width: 64px; height: 78px; object-fit: cover; border-radius: 4px; background: #e7e2d9; }
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; max-height: 520px; overflow: auto; padding: 4px; }
.pick { border: 1px solid #e7e2d9; border-radius: 10px; padding: 10px; background: #fff; display: grid; grid-template-columns: 64px 1fr; gap: 10px; }
.pick .t1 { font-weight: 600; font-size: 13px; line-height: 1.3; }
.muted { color: #6b645a; font-size: 12px; }
.note { background: #fbf4e6; border: 1px solid #f0dfbd; border-radius: 8px; padding: 8px 10px; font-size: 12px; color: #6d4c12; margin-top: 8px; }
.err { color: #a3392b; font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 8px; }
.stat { background: #faf8f4; border: 1px solid #efebe4; border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-size: 20px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1d1b18; color: #fff; padding: 10px 16px; border-radius: 8px; display: none; z-index: 10; }
.toast.show { display: block; }
.link { font-family: ui-monospace, monospace; font-size: 12px; background: #f3efe8; padding: 4px 8px; border-radius: 6px; word-break: break-all; }
audio { height: 32px; vertical-align: middle; }
.rec { color: #a3392b; font-weight: 600; }
@media (max-width: 760px) { .grid2, .grid3, .stats { grid-template-columns: 1fr; } .item { grid-template-columns: 48px 1fr; } .app { padding: 14px; } }
`;

class PvrDirector extends HTMLElement {
  static get observedAttributes() { return ['rpc-result']; }

  constructor() {
    super();
    this.root = this.attachShadow({ mode: 'open' });
    this.pending = new Map();
    // A host page may set rpcHandler before the element upgrades; keep it.
    if (!Object.prototype.hasOwnProperty.call(this, 'rpcHandler')) this.rpcHandler = null;
    this.state = { tab: 'rooms', rooms: [], requests: [], catalogue: [], room: null, storyFilter: 'all', storyQuery: '', openStory: null, pickQuery: '', pickInStock: true, reqFilter: 'pending' };
  }

  get siteUrl() { return (this.getAttribute('site-url') || 'https://www.jackvettriano.studio').replace(/\/$/, ''); }

  connectedCallback() {
    this.root.innerHTML = `<style>${STYLE}</style><div class="app" id="app"></div><div class="toast" id="toast" role="status"></div>`;
    this.root.addEventListener('click', (e) => this.onClick(e));
    this.root.addEventListener('input', (e) => this.onInput(e));
    this.root.addEventListener('change', (e) => this.onInput(e));
    this.refreshAll();
  }

  attributeChangedCallback(name, _o, value) {
    if (name !== 'rpc-result' || !value) return;
    const res = JSON.parse(value);
    const p = this.pending.get(res.id);
    if (!p) return;
    this.pending.delete(res.id);
    if (res.ok) p.resolve(res.result); else p.reject(new Error(res.error || 'Request failed'));
  }

  rpc(method, ...args) {
    if (this.rpcHandler) return this.rpcHandler(method, args);
    const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    return new Promise((resolve, reject) => {
      this.pending.set(id, { resolve, reject });
      this.dispatchEvent(new CustomEvent('pvr-rpc', { detail: { id, method, args }, bubbles: true, composed: true }));
      setTimeout(() => { if (this.pending.delete(id)) reject(new Error('Timed out. Please try again.')); }, 120000);
    });
  }

  toast(msg) {
    const t = this.root.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(this.tt);
    this.tt = setTimeout(() => t.classList.remove('show'), 3500);
  }

  async run(btn, fn, okMsg) {
    if (btn) btn.disabled = true;
    try {
      const out = await fn();
      if (okMsg) this.toast(okMsg);
      return out;
    } catch (err) {
      this.toast(err.message);
      return undefined;
    } finally {
      if (btn && btn.isConnected) btn.disabled = false;
    }
  }

  async refreshAll() {
    this.render();
    const [rooms, requests, catalogue] = await Promise.all([
      this.rpc('listRooms'), this.rpc('listRequests', ''), this.rpc('listCatalogue'),
    ]).catch((err) => { this.toast(err.message); return [[], [], []]; });
    Object.assign(this.state, { rooms, requests, catalogue });
    this.render();
  }

  // ---------- rendering ----------
  render() {
    const s = this.state;
    const pending = s.requests.filter((r) => r.status === 'pending').length;
    const app = this.root.getElementById('app');
    app.innerHTML = `
      <h1>Private Viewing Rooms</h1>
      <p class="sub">Curate rooms for individual collectors, answer their requests, and manage the story behind every print.</p>
      <div class="tabs" role="tablist">
        <button class="tab ${s.tab === 'rooms' ? 'on' : ''}" data-tab="rooms" role="tab">Rooms</button>
        <button class="tab ${s.tab === 'requests' ? 'on' : ''}" data-tab="requests" role="tab">Requests${pending ? `<span class="count">${pending}</span>` : ''}</button>
        <button class="tab ${s.tab === 'stories' ? 'on' : ''}" data-tab="stories" role="tab">Story library</button>
      </div>
      <div id="view">${s.tab === 'rooms' ? (s.room ? this.roomEditorHtml() : this.roomsHtml()) : s.tab === 'requests' ? this.requestsHtml() : this.storiesHtml()}</div>`;
  }

  roomsHtml() {
    const rows = this.state.rooms.map((r) => `<tr>
      <td><strong>${esc(r.collectorName)}</strong><div class="muted">${esc(r.collectorEmail || '')}</div></td>
      <td><span class="chip ${esc(r.status)}">${esc(r.status)}</span></td>
      <td class="num">${r.printCount}</td>
      <td class="num">${r.openCount || 0}</td>
      <td>${stamp(r.lastOpenedAt)}</td>
      <td class="num">${r.stats ? mins(r.stats.dwellSec) : '-'}</td>
      <td class="num">${r.stats && r.stats.pending ? `<span class="chip pending">${r.stats.pending}</span>` : '0'}</td>
      <td>${day(r.expiresAt)}</td>
      <td><button class="b" data-edit-room="${esc(r._id)}">Open</button></td>
    </tr>`).join('');
    return `<div class="row spread"><h2>Rooms</h2><button class="b primary" data-new-room>New room</button></div>
      <div class="card" style="overflow:auto">${this.state.rooms.length ? `<table>
        <thead><tr><th>Collector</th><th>Status</th><th class="num">Prints</th><th class="num">Visits</th><th>Last visit</th><th class="num">Time viewing</th><th class="num">Pending</th><th>Closes</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table>` : '<p class="muted">No rooms yet. Create one for your next collector.</p>'}</div>`;
  }

  storyChip(p) {
    const st = p.story;
    if (!st) return '<span class="chip none">No story</span>';
    if (st.status === 'removed') return '<span class="chip removed">Removed</span>';
    if (st.status === 'draft') return '<span class="chip draft">Story in draft</span>';
    return st.audioCurrent ? '<span class="chip approved">Story + audio</span>' : '<span class="chip warn">Approved, no audio</span>';
  }

  roomEditorHtml() {
    const r = this.state.room;
    const byId = new Map(this.state.catalogue.map((p) => [p.productId, p]));
    const items = r.items.map((it, idx) => {
      const p = byId.get(it.productId) || it.product || { title: 'Unknown print' };
      const warn = !p.story || p.story.status !== 'approved'
        ? '<div class="note">This story is not approved yet. The collector will see the print but cannot hear or read its story.</div>' : '';
      return `<div class="item">
        <img src="${esc(p.image || '')}" alt="">
        <div class="grow">
          <div class="row"><strong>${esc(p.title)}</strong> ${this.storyChip(p)} ${p.inStock === false ? '<span class="chip closed">Out of stock</span>' : ''}</div>
          <div class="muted">List price ${money(p.price)}</div>
          ${warn}
          <label class="f">Your note to the collector</label>
          <textarea class="t" data-item="${idx}" data-field="curatorNote" placeholder="Why you chose this for them">${esc(it.curatorNote || '')}</textarea>
          <div class="grid2">
            <div><label class="f">Private offer price (£, optional)</label><input class="t" type="number" min="0" step="5" data-item="${idx}" data-field="offerPrice" value="${it.offerPrice || ''}"></div>
            <div><label class="f">Offer open until</label><input class="t" type="date" data-item="${idx}" data-field="offerExpiresAt" value="${isoDate(it.offerExpiresAt)}"></div>
          </div>
        </div>
        <div class="row" style="flex-direction:column;align-items:stretch">
          <button class="b" data-move="${idx}" data-dir="-1" ${idx === 0 ? 'disabled' : ''} aria-label="Move up">↑</button>
          <button class="b" data-move="${idx}" data-dir="1" ${idx === r.items.length - 1 ? 'disabled' : ''} aria-label="Move down">↓</button>
          <button class="b danger" data-remove-item="${idx}">Remove</button>
        </div>
      </div>`;
    }).join('');

    const inRoom = new Set(r.items.map((i) => i.productId));
    const q = this.state.pickQuery.toLowerCase();
    const picks = this.state.catalogue
      .filter((p) => !inRoom.has(p.productId))
      .filter((p) => !(p.story && p.story.status === 'removed'))
      .filter((p) => !this.state.pickInStock || p.inStock)
      .filter((p) => !q || p.title.toLowerCase().includes(q))
      .map((p) => `<div class="pick"><img src="${esc(p.image)}" alt="" loading="lazy">
        <div><div class="t1">${esc(p.title)}</div><div class="muted">${money(p.price)}${p.ribbon ? ` · ${esc(p.ribbon)}` : ''}</div>
        <div style="margin:6px 0">${this.storyChip(p)}</div>
        <button class="b" data-add-item="${esc(p.productId)}" ${r.items.length >= MAX_PRINTS ? 'disabled' : ''}>Add to room</button></div></div>`).join('');

    const url = r._id ? `${this.siteUrl}${r.url}` : '';
    const a = r.analytics || {};
    const room = a._room || {};
    const totalDwell = Object.values(a).reduce((t, x) => t + (x.dwellSec || 0), 0);
    const plays = Object.values(a).reduce((t, x) => t + (x.audioPlays || 0), 0);
    const analytics = r._id ? `<div class="card"><h2>Engagement</h2>
      <div class="stats">
        <div class="stat"><span class="muted">Visits</span><b>${r.openCount || 0}</b></div>
        <div class="stat"><span class="muted">First opened</span><b style="font-size:14px">${stamp(r.firstOpenedAt)}</b></div>
        <div class="stat"><span class="muted">Time with the prints</span><b>${mins(totalDwell)}</b></div>
        <div class="stat"><span class="muted">Stories played</span><b>${plays}</b></div>
      </div>
      <table><thead><tr><th>Print</th><th class="num">Time viewed</th><th class="num">Story plays</th><th class="num">Furthest listened</th><th class="num">Read story</th><th class="num">On their wall</th></tr></thead><tbody>
      ${r.items.map((it) => { const x = a[it.productId] || {}; const p = byId.get(it.productId) || {}; return `<tr><td>${esc(p.title || '')}</td><td class="num">${mins(x.dwellSec || 0)}</td><td class="num">${x.audioPlays || 0}</td><td class="num">${x.audioMaxPct ? `${x.audioMaxPct}%` : '-'}</td><td class="num">${x.transcriptOpens || 0}</td><td class="num">${x.viewInRoom || 0}</td></tr>`; }).join('')}
      </tbody></table>${room.opens ? '' : '<p class="muted">Analytics appear once the collector opens the room.</p>'}</div>` : '';

    const reqs = (r.requests || []).map((q2) => this.requestCardHtml(q2, true)).join('');

    return `<div class="row spread">
        <div><button class="b" data-back>← All rooms</button></div>
        <div class="row">
          ${r._id ? `<span class="chip ${esc(r.status)}">${esc(r.status)}</span>
            ${r.status !== 'live' ? '<button class="b gold" data-room-status="live">Go live</button>' : ''}
            ${r.status === 'live' ? '<button class="b" data-room-status="closed">Close room</button>' : ''}
            ${r.status === 'closed' ? '<button class="b" data-room-status="draft">Back to draft</button>' : ''}
            <a class="b" style="text-decoration:none;display:inline-block;border:1px solid #cfc6b6;border-radius:8px;padding:7px 12px;color:#1d1b18;font-size:13px" href="${esc(url)}" target="_blank" rel="noopener">Preview</a>` : ''}
          <button class="b primary" data-save-room>Save room</button>
        </div>
      </div>
      ${url ? `<div class="card"><div class="row"><span class="muted">Private link</span><span class="link grow">${esc(url)}</span><button class="b" data-copy="${esc(url)}">Copy link</button></div>
        <p class="muted" style="margin:8px 0 0">${r.status === 'live' ? 'The room is live. Anyone with this link can view it until it closes.' : 'Only you can open this link until the room goes live.'}</p></div>` : ''}
      <div class="card"><h2>Collector</h2>
        <div class="grid3">
          <div><label class="f">Name (as you would greet them)</label><input class="t" data-room-field="collectorName" value="${esc(r.collectorName || '')}" placeholder="Mr & Mrs Johnson"></div>
          <div><label class="f">Email (for replies and hold confirmations)</label><input class="t" type="email" data-room-field="collectorEmail" value="${esc(r.collectorEmail || '')}"></div>
          <div><label class="f">Room open until</label><input class="t" type="date" data-room-field="expiresAt" value="${isoDate(r.expiresAt)}"></div>
        </div>
        <label class="f">Welcome note</label>
        <textarea class="t" data-room-field="greeting" placeholder="A personal note that opens the room">${esc(r.greeting || '')}</textarea>
        <label class="f">Personal voice note (optional)</label>
        <div class="row">
          ${r.greetingAudioUrl ? `<audio controls src="${esc(r.greetingAudioUrl)}"></audio><button class="b danger" data-clear-greeting>Remove</button>` : '<span class="muted">None yet.</span>'}
          <button class="b" data-record>${this.recorder ? '<span class="rec">● Stop recording</span>' : 'Record a voice note'}</button>
          <button class="b" data-upload-audio>Upload audio file</button>
          <input type="file" id="audioFile" accept="audio/mpeg,audio/mp4,audio/x-m4a,audio/wav" hidden>
        </div>
      </div>
      <div class="card"><div class="row spread"><h2>Prints in this room (${r.items.length}/${MAX_PRINTS})</h2><span class="muted">Three to five works feels personal; up to ${MAX_PRINTS} allowed.</span></div>
        ${items || '<p class="muted">No prints yet. Add some from the catalogue below.</p>'}
      </div>
      <div class="card"><div class="row spread"><h2>Add prints</h2>
        <div class="row"><input class="t" style="width:220px" placeholder="Search prints" data-pick-query value="${esc(this.state.pickQuery)}">
        <label class="muted"><input type="checkbox" data-pick-instock ${this.state.pickInStock ? 'checked' : ''}> In stock only</label></div></div>
        <div class="picker">${picks || '<p class="muted">No matching prints.</p>'}</div>
      </div>
      ${reqs ? `<div class="card"><h2>Requests from this collector</h2>${reqs}</div>` : ''}
      ${analytics}`;
  }

  requestCardHtml(r, compact) {
    const kind = { hold: '48-hour hold', question: 'Question', offer: `Accepted offer${r.offerPrice ? ` at ${money(r.offerPrice)}` : ''}` }[r.type];
    const open = r.status === 'pending';
    const actions = open ? `
      <label class="f">Reply to the collector${r.type === 'question' ? '' : ' (optional)'}</label>
      <textarea class="t" id="reply-${esc(r._id)}" placeholder="This appears in their room and is emailed to them"></textarea>
      <div class="row" style="margin-top:8px">
        ${r.type === 'hold' ? `<button class="b gold" data-respond="${esc(r._id)}" data-action="confirm">Confirm 48-hour hold</button>` : ''}
        ${r.type === 'offer' ? `<button class="b gold" data-respond="${esc(r._id)}" data-action="confirm">Confirm sale</button>` : ''}
        ${r.type === 'question' ? `<button class="b gold" data-respond="${esc(r._id)}" data-action="answer">Send reply</button>` : ''}
        ${r.type !== 'question' ? `<button class="b danger" data-respond="${esc(r._id)}" data-action="decline">Decline</button>` : ''}
      </div>` : (r.reply ? `<div class="muted" style="margin-top:6px"><strong>Your reply:</strong> ${esc(r.reply)}</div>` : '');
    return `<div class="card" style="${compact ? 'margin:10px 0;' : ''}">
      <div class="row spread"><div><strong>${esc(kind)}</strong> · ${esc(r.printTitle || '')}${compact ? '' : ` · <span class="muted">${esc(r.collectorName || '')}</span>`}</div>
      <div class="row"><span class="chip ${esc(r.status)}">${esc(r.status)}</span><span class="muted">${stamp(r._createdDate)}</span></div></div>
      ${r.message ? `<p style="margin:8px 0 0">${esc(r.message)}</p>` : ''}
      ${r.type === 'hold' && r.status === 'confirmed' && r.holdExpiresAt ? `<p class="muted">Held until ${stamp(r.holdExpiresAt)}. Released automatically afterwards.</p>` : ''}
      ${!compact && r.roomSlug ? `<p class="muted" style="margin:6px 0 0">Room: ${esc(r.roomSlug)}</p>` : ''}
      ${actions}
    </div>`;
  }

  requestsHtml() {
    const f = this.state.reqFilter;
    const list = this.state.requests.filter((r) => (f === 'pending' ? r.status === 'pending' : true));
    return `<div class="row spread"><h2>Requests</h2>
      <div class="row"><button class="b ${f === 'pending' ? 'primary' : ''}" data-req-filter="pending">Waiting for you</button><button class="b ${f === 'all' ? 'primary' : ''}" data-req-filter="all">All</button></div></div>
      ${list.map((r) => this.requestCardHtml(r, false)).join('') || '<div class="card muted">Nothing waiting. Collectors’ holds, questions and accepted offers will appear here.</div>'}`;
  }

  storiesHtml() {
    const s = this.state;
    const q = s.storyQuery.toLowerCase();
    const counts = { all: 0, approved: 0, draft: 0, none: 0, removed: 0 };
    const status = (p) => (p.story ? p.story.status : 'none');
    for (const p of s.catalogue) { counts[status(p)] += 1; if (status(p) !== 'removed') counts.all += 1; }
    const list = s.catalogue
      .filter((p) => (s.storyFilter === 'all' ? status(p) !== 'removed' : status(p) === s.storyFilter))
      .filter((p) => !q || p.title.toLowerCase().includes(q));
    const rows = list.map((p) => {
      const st = p.story;
      const open = s.openStory === p.productId;
      return `<tr>
        <td><strong>${esc(p.title)}</strong><div class="muted">${money(p.price)}${p.inStock ? '' : ' · out of stock'}${p.ribbon ? ` · ${esc(p.ribbon)}` : ''}</div></td>
        <td>${this.storyChip(p)}</td>
        <td class="num">${st && st.estDurationSec ? `${st.estDurationSec}s` : '-'}</td>
        <td>${st && st.audioUrl ? `<audio controls preload="none" src="${esc(st.audioUrl)}"></audio>${st.audioCurrent ? '' : '<div class="muted">Script changed since recording</div>'}` : '-'}</td>
        <td>${st ? `<button class="b" data-open-story="${esc(p.productId)}">${open ? 'Close' : 'Edit'}</button>`
          : `<button class="b" data-add-story="${esc(p.productId)}">Add to library</button>`}</td>
      </tr>${open && st ? `<tr><td colspan="5">${this.storyEditorHtml(p)}</td></tr>` : ''}`;
    }).join('');
    const tab = (k, label) => `<button class="b ${s.storyFilter === k ? 'primary' : ''}" data-story-filter="${k}">${label} (${counts[k]})</button>`;
    return `<div class="row spread"><h2>Story library</h2><input class="t" style="width:240px" placeholder="Search prints" data-story-query value="${esc(s.storyQuery)}"></div>
      ${s.catalogue.length && !s.catalogue.some((p) => p.story) ? `<div class="card" style="background:#fbf4e6;border-color:#f0dfbd"><div class="row spread"><div><strong>Import the starter stories</strong><div class="muted">Curator scripts for every priced print, written from the Studio's product copy. They arrive as drafts for you to check and approve.</div></div><button class="b gold" data-import-stories>Import stories</button></div></div>` : ''}
      <div class="row" style="margin-bottom:12px">${tab('all', 'In library')}${tab('approved', 'Approved')}${tab('draft', 'Drafts')}${tab('none', 'No story yet')}${tab('removed', 'Removed')}</div>
      <p class="muted">Every priced print in the store is listed. Add a print to write its story; remove one to hide it from the room builder (its story is kept and can be restored).</p>
      <div class="card" style="overflow:auto"><table><thead><tr><th>Print</th><th>Story</th><th class="num">Length</th><th>Audio</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="muted">Nothing here.</td></tr>'}</tbody></table></div>`;
  }

  storyEditorHtml(p) {
    const st = p.story;
    const id = esc(st._id);
    return `<div style="padding:8px 0 14px">
      ${st.reviewNotes ? `<div class="note"><strong>Review notes:</strong> ${esc(st.reviewNotes)}</div>` : ''}
      <label class="f">Voice-over script (about 150-200 words; paragraphs become natural pauses)</label>
      <textarea class="t script" data-story="${id}" data-sfield="transcript">${esc(st.transcript)}</textarea>
      <div class="grid3">
        <div><label class="f">Edition</label><input class="t" data-story="${id}" data-sfield="edition" value="${esc(st.edition)}"></div>
        <div><label class="f">Medium</label><input class="t" data-story="${id}" data-sfield="medium" value="${esc(st.medium)}"></div>
        <div><label class="f">Signed by the artist</label><select class="t" data-story="${id}" data-sfield="signed"><option value="true" ${st.signed ? 'selected' : ''}>Yes</option><option value="false" ${st.signed ? '' : 'selected'}>No</option></select></div>
        <div><label class="f">Image size (cm, as "w x h")</label><input class="t" data-story="${id}" data-sfield="imageSizeCm" value="${esc(sizeStr(st.imageSizeCm))}"></div>
        <div><label class="f">Mount size (cm)</label><input class="t" data-story="${id}" data-sfield="mountSizeCm" value="${esc(sizeStr(st.mountSizeCm))}"></div>
        <div><label class="f">Framed size (cm)</label><input class="t" data-story="${id}" data-sfield="framedSizeCm" value="${esc(sizeStr(st.framedSizeCm))}"></div>
      </div>
      <label class="f">Review notes</label>
      <input class="t" data-story="${id}" data-sfield="reviewNotes" value="${esc(st.reviewNotes)}">
      <div class="row" style="margin-top:12px">
        <button class="b primary" data-save-story="${id}">Save</button>
        ${st.status !== 'approved' && st.status !== 'removed' ? `<button class="b gold" data-story-status="${id}" data-status="approved">Approve</button>` : ''}
        ${st.status === 'approved' ? `<button class="b gold" data-gen-audio="${id}">${st.audioUrl ? 'Regenerate audio' : 'Generate audio'}</button>` : ''}
        ${st.status !== 'removed' ? `<button class="b" data-claude="${id}">Draft with Claude</button>` : ''}
        ${st.status === 'removed' ? `<button class="b" data-story-status="${id}" data-status="draft">Restore to library</button>`
          : `<button class="b danger" data-story-status="${id}" data-status="removed">Remove from library</button>`}
      </div>
      <p class="muted">Approve after checking every fact against the product page. Editing an approved script returns it to draft until re-approved, and its audio must be regenerated.</p>
    </div>`;
  }

  // ---------- events ----------
  findStory(storyId) { return this.state.catalogue.find((p) => p.story && p.story._id === storyId); }

  // Reload from the backend so story status and audio freshness are authoritative.
  async reloadCatalogue() {
    this.state.catalogue = await this.rpc('listCatalogue');
  }

  collectStoryChanges(storyId) {
    const changes = {};
    this.root.querySelectorAll(`[data-story="${CSS.escape(storyId)}"]`).forEach((el) => {
      changes[el.dataset.sfield] = el.dataset.sfield === 'signed' ? el.value === 'true' : el.value;
    });
    return changes;
  }

  async openRoom(id) {
    const detail = await this.run(null, () => this.rpc('getRoomDetail', id));
    if (!detail) return;
    this.state.room = {
      ...detail.room,
      items: detail.items.map((i) => ({ productId: i.productId, curatorNote: i.curatorNote, offerPrice: i.offerPrice, offerExpiresAt: i.offerExpiresAt, product: i.product })),
      requests: detail.requests,
      analytics: detail.analytics,
    };
    this.render();
  }

  async saveRoom(btn) {
    const r = this.state.room;
    const saved = await this.run(btn, async () => {
      const room = await this.rpc('saveRoom', {
        _id: r._id, collectorName: r.collectorName, collectorEmail: r.collectorEmail,
        greeting: r.greeting, greetingAudioUrl: r.greetingAudioUrl, expiresAt: r.expiresAt,
      });
      await this.rpc('setRoomItems', room._id, r.items.map((i) => ({
        productId: i.productId, curatorNote: i.curatorNote, offerPrice: i.offerPrice, offerExpiresAt: i.offerExpiresAt,
      })));
      return room;
    }, 'Room saved');
    if (!saved) return;
    this.state.rooms = await this.rpc('listRooms');
    await this.openRoom(saved._id);
  }

  async uploadAudio(blob, name) {
    const url = await this.rpc('getAudioUploadUrl', blob.type, name);
    const res = await fetch(`${url}?filename=${encodeURIComponent(name)}`, { method: 'PUT', headers: { 'Content-Type': blob.type }, body: blob });
    if (!res.ok) throw new Error(`Upload failed (${res.status})`);
    const { file } = await res.json();
    this.state.room.greetingAudioUrl = file.url;
    this.render();
    this.toast('Voice note added. Save the room to keep it.');
  }

  async toggleRecording() {
    if (this.recorder) {
      const blob = this.recorder.stop();
      this.recorder = null;
      this.render();
      await this.run(null, () => this.uploadAudio(blob, `greeting-${Date.now()}.wav`));
      return;
    }
    try {
      this.recorder = await startWavRecorder();
      this.render();
    } catch (err) {
      this.toast('Microphone unavailable. You can upload an audio file instead.');
    }
  }

  onInput(e) {
    const t = e.target;
    const s = this.state;
    if (t.dataset.roomField) s.room[t.dataset.roomField] = t.value;
    else if (t.dataset.item) {
      const v = t.dataset.field === 'offerPrice' ? (t.value ? Number(t.value) : null) : t.value;
      s.room.items[Number(t.dataset.item)][t.dataset.field] = v;
    } else if ('pickQuery' in t.dataset && e.type === 'input') { s.pickQuery = t.value; this.renderKeepFocus(t); }
    else if ('pickInstock' in t.dataset) { s.pickInStock = t.checked; this.render(); }
    else if ('storyQuery' in t.dataset && e.type === 'input') { s.storyQuery = t.value; this.renderKeepFocus(t); }
    else if (t.id === 'audioFile' && e.type === 'change' && t.files[0]) {
      const f = t.files[0];
      this.run(null, () => this.uploadAudio(f, f.name));
    }
  }

  renderKeepFocus(input) {
    const key = Object.keys(input.dataset)[0];
    const pos = input.selectionStart;
    this.render();
    const el = this.root.querySelector(`[data-${key.replace(/[A-Z]/g, (c) => `-${c.toLowerCase()}`)}]`);
    if (el) { el.focus(); el.setSelectionRange(pos, pos); }
  }

  async onClick(e) {
    const b = e.target.closest('button, [data-copy]');
    if (!b) return;
    const d = b.dataset;
    const s = this.state;
    if (d.tab) { s.tab = d.tab; s.room = null; this.render(); }
    else if ('newRoom' in d) { s.room = { collectorName: '', collectorEmail: '', greeting: '', expiresAt: new Date(Date.now() + 14 * 86400000).toISOString(), items: [] }; this.render(); }
    else if (d.editRoom) this.openRoom(d.editRoom);
    else if ('back' in d) { s.room = null; this.render(); }
    else if ('saveRoom' in d) this.saveRoom(b);
    else if (d.roomStatus) {
      const saved = await this.run(b, () => this.rpc('setRoomStatus', s.room._id, d.roomStatus), d.roomStatus === 'live' ? 'Room is live' : 'Room updated');
      if (saved) { s.rooms = await this.rpc('listRooms'); await this.openRoom(saved._id); }
    } else if (d.copy) { navigator.clipboard.writeText(d.copy).then(() => this.toast('Link copied')); }
    else if (d.addItem) {
      if (s.room.items.length >= MAX_PRINTS) return;
      s.room.items.push({ productId: d.addItem, curatorNote: '', offerPrice: null, offerExpiresAt: null });
      this.render();
      this.toast('Added. Save the room to publish the change.');
    } else if (d.removeItem) { s.room.items.splice(Number(d.removeItem), 1); this.render(); this.toast('Removed. Save the room to publish the change.'); }
    else if (d.move) {
      const i = Number(d.move);
      const j = i + Number(d.dir);
      [s.room.items[i], s.room.items[j]] = [s.room.items[j], s.room.items[i]];
      this.render();
    } else if ('record' in d) this.toggleRecording();
    else if ('uploadAudio' in d) this.root.getElementById('audioFile').click();
    else if ('clearGreeting' in d) { s.room.greetingAudioUrl = ''; this.render(); }
    else if (d.reqFilter) { s.reqFilter = d.reqFilter; this.render(); }
    else if (d.respond) {
      const reply = (this.root.getElementById(`reply-${d.respond}`) || {}).value || '';
      const saved = await this.run(b, () => this.rpc('respondToRequest', d.respond, d.action, reply), 'Collector updated');
      if (saved) {
        s.requests = await this.rpc('listRequests', '');
        if (s.room && s.room._id) await this.openRoom(s.room._id); else this.render();
      }
    } else if ('importStories' in d) {
      const res = await this.run(b, () => this.rpc('importStarterStories'));
      if (res) { await this.reloadCatalogue(); this.toast(`Imported ${res.imported} stories as drafts`); this.render(); }
    } else if (d.storyFilter) { s.storyFilter = d.storyFilter; this.render(); }
    else if (d.openStory) { s.openStory = s.openStory === d.openStory ? null : d.openStory; this.render(); }
    else if (d.addStory) {
      const saved = await this.run(b, () => this.rpc('addStory', d.addStory), 'Added to the story library');
      if (saved) { await this.reloadCatalogue(); s.openStory = saved.productId; s.storyFilter = 'all'; this.render(); }
    } else if (d.saveStory) {
      const saved = await this.run(b, () => this.rpc('saveStory', d.saveStory, this.collectStoryChanges(d.saveStory)), 'Story saved');
      if (saved) { await this.reloadCatalogue(); this.render(); }
    } else if (d.storyStatus) {
      if (d.status === 'approved') {
        const changes = this.collectStoryChanges(d.storyStatus);
        const saved = await this.run(b, () => this.rpc('saveStory', d.storyStatus, changes));
        if (!saved) return;
      }
      const saved = await this.run(b, () => this.rpc('setStoryStatus', d.storyStatus, d.status),
        { approved: 'Approved. Collectors can now read it.', removed: 'Removed from the library', draft: 'Restored to the library' }[d.status]);
      if (saved) { await this.reloadCatalogue(); if (d.status === 'removed') s.openStory = null; this.render(); }
    } else if (d.genAudio) {
      b.textContent = 'Generating… (about 20 seconds)';
      const saved = await this.run(b, () => this.rpc('generateStoryAudio', d.genAudio), 'Audio ready');
      if (saved) await this.reloadCatalogue();
      this.render();
    } else if (d.claude) {
      const st = this.findStory(d.claude).story;
      if (st.transcript && !window.confirm('Replace the current script with a new Claude draft?')) return;
      b.textContent = 'Drafting…';
      const saved = await this.run(b, () => this.rpc('draftStoryWithClaude', d.claude), 'Draft ready. Check every fact before approving.');
      if (saved) await this.reloadCatalogue();
      this.render();
    }
  }
}

// Minimal mono 16 kHz WAV recorder. Wix Media accepts WAV, unlike browser-native WebM.
async function startWavRecorder() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const ctx = new AudioContext();
  const source = ctx.createMediaStreamSource(stream);
  const node = ctx.createScriptProcessor(4096, 1, 1);
  const chunks = [];
  node.onaudioprocess = (e) => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  source.connect(node);
  node.connect(ctx.destination);
  return {
    stop() {
      node.disconnect(); source.disconnect(); stream.getTracks().forEach((t) => t.stop());
      const rate = 16000;
      const ratio = ctx.sampleRate / rate;
      const input = chunks.reduce((acc, c) => { const out = new Float32Array(acc.length + c.length); out.set(acc); out.set(c, acc.length); return out; }, new Float32Array(0));
      const len = Math.floor(input.length / ratio);
      const buf = new DataView(new ArrayBuffer(44 + len * 2));
      const str = (o, s) => [...s].forEach((ch, i) => buf.setUint8(o + i, ch.charCodeAt(0)));
      str(0, 'RIFF'); buf.setUint32(4, 36 + len * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
      buf.setUint32(16, 16, true); buf.setUint16(20, 1, true); buf.setUint16(22, 1, true);
      buf.setUint32(24, rate, true); buf.setUint32(28, rate * 2, true); buf.setUint16(32, 2, true); buf.setUint16(34, 16, true);
      str(36, 'data'); buf.setUint32(40, len * 2, true);
      for (let i = 0; i < len; i += 1) {
        const v = Math.max(-1, Math.min(1, input[Math.floor(i * ratio)]));
        buf.setInt16(44 + i * 2, v < 0 ? v * 0x8000 : v * 0x7fff, true);
      }
      ctx.close();
      return new Blob([buf], { type: 'audio/wav' });
    },
  };
}

if (!customElements.get('pvr-director')) customElements.define('pvr-director', PvrDirector);
</script>
