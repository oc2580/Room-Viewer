<script>
const db = { catalogue: [{"productId":"c9db2862-864f-6419-290a-b982bd8c4b56","title":"Afternoon Reverie","price":560,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/d9cb8c_e18604e4efea4a1c84588410fa697f2b~mv2.jpg","story":{"_id":"story-c9db2862-864f-6419-290a-b982bd8c4b56","status":"draft","transcript":"Afternoon Reverie has a gentle, unhurried title: an afternoon spent drifting into a daydream.\n\nReverie is a recurring mood in Vettriano's work. He often caught people in the pause between events, lost in thought, or lost in each other. These quieter paintings show a different side of an artist best known for drama and seduction, and many collectors will tell you they are the ones most rewarding to live with.\n\nThis is a calm, restful image. It belongs in a bedroom, a sitting room or a study, and it sits beautifully alongside his other contemplative pictures.\n\nThe edition is limited to two hundred and fifty prints and twenty-five Artist's Proofs, each signed and numbered by Jack Vettriano. It is printed on a heavier museum etching paper than many of his editions, which gives the image real depth. For anyone beginning a collection, it is one of the most approachable ways to own a signed Vettriano.","edition":"Signed limited edition of 250 + 25 Artist's Proofs","medium":"350gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":[52.7,59],"framedSizeCm":[63.3,69.6],"reviewNotes":"","estDurationSec":62,"audioUrl":"","audioCurrent":false}},{"productId":"599277a8-f61e-53fb-a52d-6aa976e4aa10","title":"Baby, Bye Bye","price":1200,"inStock":true,"ribbon":"Framed","image":"https://static.wixstatic.com/media/d9cb8c_243a7ad3632a453d875d7f86dd219bb7~mv2.jpg","story":{"_id":"story-599277a8-f61e-53fb-a52d-6aa976e4aa10","status":"draft","transcript":"Baby, Bye Bye. A woman in a robe stands at a window, a mug in her hand, looking out.\n\nIt is the morning after, or perhaps the morning of a departure. The title, with its echo of a pop-song farewell, tells us that someone has gone, or is about to. There is no drama here, no evening dress, no dance floor. Just a quiet, domestic moment that anyone who has ever said goodbye will recognise.\n\nThat is what makes it one of Vettriano's most relatable images. Painted in his later period, when his work became more intimate and understated, it shows how much he could say with very little: a pose, a window, the light of the morning.\n\nIt was published in 2015, a limited edition of two hundred and fifty prints and twenty-five Artist's Proofs, each signed and numbered by Jack Vettriano. As one of his later signed releases, it belongs to a body of work that is now complete. This example comes framed, ready for a bedroom, a kitchen or a sitting room.","edition":"Signed limited edition giclée of 250 + 25 Artist's Proofs, published 2015","medium":"Giclée on 300gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":[41,49],"framedSizeCm":"","reviewNotes":"Ribbon says Framed - confirm framed dimensions for view-in-room.","estDurationSec":70,"audioUrl":"","audioCurrent":false}},{"productId":"982ee5ac-b3bc-c002-0d8c-ae494544c7ec","title":"Beautiful Dreamer","price":995,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/d9cb8c_79d66098d55243cc9f91e9c19b4419cf~mv2.jpg","story":{"_id":"story-982ee5ac-b3bc-c002-0d8c-ae494544c7ec","status":"draft","transcript":"Beautiful Dreamer. A woman in a black dress stands beside a window, lost in her own thoughts.\n\nThe title comes from Stephen Foster's famous nineteenth-century song, and Vettriano uses it with real tenderness. Many of his finest paintings are quiet portraits of women alone: waiting, remembering, daydreaming. This is one of the most admired of them all. The light from the window and the stillness of the pose give it a calm, reflective mood that stays with you.\n\nIt is a large print, and that matters. At this scale its atmosphere can fill a wall, in a bedroom, a living room, or a quiet reading space.\n\nThe edition is printed on Hahnemühle mould-made paper. Hahnemühle has been making paper in Germany since the sixteenth century, and its soft surface gives Vettriano's colours an almost painterly finish. Each print is signed and numbered by the artist, from an edition of four hundred and ninety-five, and for its scale and quality it is one of the most impressive works on paper in our collection.","edition":"Signed limited edition of 495 + 50 Artist's Proofs","medium":"310gsm Hahnemühle mould-made paper","signed":true,"imageSizeCm":"","mountSizeCm":[78.8,96],"framedSizeCm":"","reviewNotes":"","estDurationSec":69,"audioUrl":"","audioCurrent":false}},{"productId":"f4a4ec85-bf96-4e83-9408-1ba168758012","title":"Betrayal – First Kiss","price":795,"inStock":false,"ribbon":"","image":"https://static.wixstatic.com/media/5f58c4_b096d740836245958ba1536b9bee5c42~mv2.jpg","story":{"_id":"story-f4a4ec85-bf96-4e83-9408-1ba168758012","status":"draft","transcript":"Betrayal: First Kiss. A man and a woman share a first kiss in a softly lit room, wall lights glowing on either side of them.\n\nThis painting belongs to a small group Vettriano made on the theme of betrayal, alongside Betrayal: No Turning Back, and Contemplation of Betrayal. Taken together, they read almost like the frames of a film. And this is where the story begins.\n\nNotice how much the title changes what you see. Without it, this is a tender, romantic moment. With it, the same kiss carries a shadow: somewhere outside this room, someone is about to be hurt. That tension between beauty and consequence is the very heart of Vettriano's work.\n\nThe edition is small, just one hundred prints and ten Artist's Proofs, each signed and numbered by Jack Vettriano. For a collector, the real pleasure is in the series: hung together, the Betrayal paintings tell their story in full.","edition":"Signed limited edition of 100 + 10 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":[39,32.2],"mountSizeCm":"","framedSizeCm":"","reviewNotes":"","estDurationSec":61,"audioUrl":"","audioCurrent":false}},{"productId":"10071409-8d27-c900-ff44-740f51894d86","title":"Betrayal – No Turning Back","price":795,"inStock":false,"ribbon":"","image":"https://static.wixstatic.com/media/d9cb8c_2c8e59309340415fa182d6852c079eea~mv2.jpg","story":{"_id":"story-10071409-8d27-c900-ff44-740f51894d86","status":"draft","transcript":"Betrayal: No Turning Back. A man in a dark suit holds a woman close in a dim room, her dress slipping from her shoulder.\n\nIf First Kiss is where the story begins, this is the moment it becomes irreversible. The title leaves no room for doubt. A line has been crossed, and both of them know it.\n\nVettriano was a master of this kind of moment: not the event itself, but the instant just before or just after, when everything is still charged. The dim light, the dark suit, the closeness of the figures: every element is staged with the precision of a film still.\n\nThe original oil on canvas was painted in 2001 and shown that year at the International Art and Design Fair in New York. It has since sold. This print, from an edition of only one hundred, plus ten Artist's Proofs, is signed and numbered by the artist, and it is the natural companion to Betrayal: First Kiss.","edition":"Signed limited edition of 100 + 10 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":[39,32.2],"mountSizeCm":"","framedSizeCm":"","reviewNotes":"","estDurationSec":65,"audioUrl":"","audioCurrent":false}},{"productId":"bb248dbd-e5bf-2282-bebb-4c1bd4470188","title":"Birdy","price":535,"inStock":true,"ribbon":"Artist Proof Available","image":"https://static.wixstatic.com/media/5f58c4_2561da219628494ea3ba3cd449cdea2b~mv2.jpg","story":{"_id":"story-bb248dbd-e5bf-2282-bebb-4c1bd4470188","status":"draft","transcript":"Birdy. An affectionate, slightly old-fashioned term of endearment, the kind of word that belongs to the dance halls and pubs of the post-war years Vettriano so loved to evoke.\n\nHis titles often borrow from everyday speech, from songs and films, and they give his paintings a conversational, personal quality. It is as if we are being let in on a private nickname, something said quietly between two people.\n\nBirdy is a small, intimate image, and it is a natural fit for the kind of wall many collectors build over time: a gathering of his smaller prints, mixing portraits and narrative scenes. It holds its own alone, and it sits beautifully in a group.\n\nThe edition is a modest one, one hundred and twenty-five prints and fifteen Artist's Proofs, each signed and numbered by Jack Vettriano and printed on museum etching paper. An Artist's Proof is also available. As a first signed Vettriano, or a thoughtful gift for a collector who already loves his work, it is a lovely choice.","edition":"Signed limited edition of 125 + 15 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":[20,25],"mountSizeCm":[41,48.5],"framedSizeCm":[51,58.5],"reviewNotes":"","estDurationSec":68,"audioUrl":"","audioCurrent":false}},{"productId":"692a583f-4949-f362-a009-1fb93b4128d1","title":"Black On Blonde","price":560,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/d9cb8c_79648ca3a37f4f26b9ac5cb48204549f~mv2.jpg","story":{"_id":"story-692a583f-4949-f362-a009-1fb93b4128d1","status":"draft","transcript":"Black on Blonde. It reads almost like a colour note, or a cocktail order, and that blend of style and suggestion is pure Vettriano.\n\nBlack clothing against fair hair is a contrast he returned to again and again, especially in his portraits of women. Here he puts that idea front and centre, and the title is the clue. This is a study in elegance, in contrast, and in attitude.\n\nIt was published in 2015, alongside several other editions in the same format, and it belongs to his later work: assured, pared back, and very sure of its effect.\n\nThe edition is two hundred and fifty prints and twenty-five Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper. Its moderate size makes it versatile, in a bedroom, a hallway or a study. And as one of the most accessible signed editions in our collection, it is a natural place for a new collector to begin.","edition":"Signed limited edition giclée of 250 + 25 Artist's Proofs, published 2015","medium":"Giclée on 300gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":[41,49],"framedSizeCm":[62.7,72.7],"reviewNotes":"","estDurationSec":63,"audioUrl":"","audioCurrent":false}},{"productId":"061496dd-2eb6-986f-8fa1-635b5ed3b854","title":"Cocktails & Broken Hearts","price":995,"inStock":false,"ribbon":"Silkscreen","image":"https://static.wixstatic.com/media/5f58c4_f4ebadb23e004c5a9ac94f6e50de7788~mv2.jpg","story":{"_id":"story-061496dd-2eb6-986f-8fa1-635b5ed3b854","status":"draft","transcript":"Cocktails and Broken Hearts. A late-night bar, its figures gathered at the counter in low, smoky light.\n\nThe title does the rest. It hints at the stories behind the drinks: who is waiting for whom, who has been let down, and who is about to be. Vettriano never spells it out. He sets the scene, dims the lights, and lets us eavesdrop.\n\nThe original oil on canvas was painted in 1998 and shown that year in Between Darkness and Dawn, one of his exhibitions. It was chosen again, years later, for Jack Vettriano: A Retrospective, at Kelvingrove Art Gallery and Museum in Glasgow, in 2013 and 2014. That tells you how highly it was regarded.\n\nThis edition is a silkscreen, published in 2003, limited to two hundred and seventy-five, each signed and numbered by Jack Vettriano. Silkscreens are built up colour by colour, by hand, and they have a depth and intensity all of their own. At seventy by fifty-six centimetres, it is a substantial image, made for an evening room.","edition":"Signed silkscreen, edition of 275, published 2003","medium":"Silkscreen","signed":true,"imageSizeCm":[70,56],"mountSizeCm":"","framedSizeCm":"","reviewNotes":"Source copy is brief; script stays close to it.","estDurationSec":68,"audioUrl":"","audioCurrent":false}},{"productId":"d495a8f8-0228-f488-cd01-729da205fb03","title":"Contemplation of Betrayal","price":795,"inStock":false,"ribbon":"","image":"https://static.wixstatic.com/media/5f58c4_7972d2f3184f41a39f044e2b65830549~mv2.jpg","story":{"_id":"story-d495a8f8-0228-f488-cd01-729da205fb03","status":"draft","transcript":"Contemplation of Betrayal is the quietest painting in Vettriano's betrayal sequence, and perhaps the most telling.\n\nIt is dusk, by a window. A man in a dark suit leans in to kiss a woman's cheek. She has a glass in her hand, and she is looking away.\n\nAlongside Betrayal – First Kiss and Betrayal – No Turning Back, this is the third chapter of the story, and its mood is entirely different. There is no embrace here, no line yet crossed. This is the moment of hesitation, before the decision. Everything depends on which way she turns.\n\nThat was Vettriano's great skill: finding the instant when a story could still go either way, and holding it there for us. Her averted gaze tells us more than any embrace could.\n\nThe edition is small, one hundred prints and ten Artist's Proofs, each signed and numbered by Jack Vettriano. For a collector drawn to the betrayal paintings, it completes the trilogy, and for many it is the most compelling of the three.","edition":"Signed limited edition of 100 + 10 Artist's Proofs (APs +25%)","medium":"Giclée","signed":true,"imageSizeCm":"","mountSizeCm":"","framedSizeCm":"","reviewNotes":"No sizes in product copy - add for view-in-room.","estDurationSec":68,"audioUrl":"","audioCurrent":false}},{"productId":"26a63353-95f9-3e81-604b-e8cca3006324","title":"Dancer For Money","price":3500,"inStock":false,"ribbon":"Premium Limited Edition","image":"https://static.wixstatic.com/media/d9cb8c_a915f3923cbc488c9e4ced2059fde84e~mv2_d_2746_3109_s_4_2.jpg","story":{"_id":"story-26a63353-95f9-3e81-604b-e8cca3006324","status":"draft","transcript":"Dancer for Money. The title is blunt, and deliberately so.\n\nVettriano was drawn throughout his career to the world of performers, dancers and the people who watch them: the glamour on the surface, and the transaction underneath. The title tells us exactly which side of that world we are looking at, and leaves us to feel what we will about it.\n\nIt was chosen as one of the paintings for a premium signed edition celebrating Jack Vettriano's greatest works, and that tells you how it is regarded.\n\nThis premium edition is presented very differently from a paper print. It is reproduced at the full size of the original painting, twenty-four by twenty inches, as a high-quality giclée, board mounted and finished by hand with three coats of lacquer for a satin surface. It arrives in the same style of frame used for his original work, with no border and no glass, ready to hang.\n\nThe edition is tiny: just fifty, plus five proofs, each signed and numbered by Vettriano in silver pen in the corner of the image.","edition":"Premium limited edition of 50 + 5, original size (24 x 20 in), signed in silver pen","medium":"Giclée, board mounted, hand-embellished with 3 coats of lacquer, no glass","signed":true,"imageSizeCm":[61,50.8],"mountSizeCm":"","framedSizeCm":"","reviewNotes":"Source copy has almost no detail about the painting itself - Studio may wish to add a line from the blog post.","estDurationSec":71,"audioUrl":"","audioCurrent":false}},{"productId":"73436e8f-6e6a-7fb1-36a6-d2fe34e69c5e","title":"Days of Wine and Roses","price":695,"inStock":false,"ribbon":"Framed","image":"https://static.wixstatic.com/media/d9cb8c_02fe3d8e49094b1094c8f1719bec75fd~mv2.jpg","story":{"_id":"story-73436e8f-6e6a-7fb1-36a6-d2fe34e69c5e","status":"draft","transcript":"Days of Wine and Roses. A woman in a sun hat and a floral dress sits alone at a restaurant table, laid with a white cloth and flowers. Behind her, the blinds are half drawn.\n\nIs she waiting for someone? Has someone just left? Vettriano does not say. The table is set for a celebration, and yet she is alone, and the title, borrowed from a phrase about the fleeting nature of pleasure, gives the scene a gentle note of melancholy.\n\nThis painting gave its name to Vettriano's 2010 exhibition at Kirkcaldy Galleries. For him that was a homecoming of sorts. Kirkcaldy's gallery was where, as a young man, he had taught himself to paint by studying the pictures on its walls. The same exhibition introduced Night Calls, Portrait in Black and Pearl, Morning News and The Weight.\n\nThe edition was published in 2010, two hundred and fifty prints plus twenty-five Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper.","edition":"Signed limited edition giclée of 250 + 25 Artist's Proofs, published 2010","medium":"Giclée on 350gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":[64,54.5],"framedSizeCm":"","reviewNotes":"","estDurationSec":66,"audioUrl":"","audioCurrent":false}},{"productId":"0820eab4-1380-e3b8-53f4-007939b89335","title":"Dr Connolly I Presume","price":3500,"inStock":false,"ribbon":"Customer Sale","image":"https://static.wixstatic.com/media/5f58c4_90af829bb14a47cc9894d708414d3a81~mv2.webp","story":{"_id":"story-0820eab4-1380-e3b8-53f4-007939b89335","status":"draft","transcript":"Dr Connolly, I Presume is a portrait of a Scottish legend by a Scottish legend.\n\nJack Vettriano was one of three artists, alongside John Byrne and Rachel Maclean, commissioned to portray the comedian Billy Connolly. Their portraits were reproduced as enormous murals in Glasgow, celebrating one of the city's most beloved sons.\n\nVettriano's answer was characteristically his own. Connolly stands in a long coat on a beach, the setting Vettriano returned to throughout his career, and the title borrows the most famous line of Victorian exploration with a wink. It is a portrait with all the style and theatre of his figure paintings, and a real sense of affection for its subject.\n\nThis edition was published in 2017, limited to one hundred giclée prints, each signed and numbered by Jack Vettriano. It is a small, jewel-like image, and as a meeting of two great Scottish personalities it holds a particular place in any collection of his work.","edition":"Signed and numbered giclée, edition of 100, published 2017","medium":"Giclée","signed":true,"imageSizeCm":[20,25],"mountSizeCm":[41,47.5],"framedSizeCm":"","reviewNotes":"Product copy mentions both a 1994 'World Tour of Scotland' series and the People's Palace murals - Studio to confirm the commission history before recording. Script keeps to the safest facts.","estDurationSec":63,"audioUrl":"","audioCurrent":false}},{"productId":"374bdc00-545e-43b9-4d82-b6df5693ac56","title":"Edinburgh Afternoon","price":560,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/d9cb8c_8ce4c467da9a46b8a37551372c5dcdfc~mv2.jpg","story":{"_id":"story-374bdc00-545e-43b9-4d82-b6df5693ac56","status":"draft","transcript":"Edinburgh Afternoon brings Vettriano's world home, to the Scottish capital.\n\nEdinburgh is closely tied to his story. It was at the Royal Scottish Academy, in 1988, that a self-taught painter from Fife submitted two pictures to the annual exhibition, and saw both of them sell on the very first day. That was the moment his career began.\n\nMost of his paintings take place in imagined settings: a bar, a ballroom, a beach that could be anywhere. So a title that names a real city gives this image a rare sense of place, and it has become a favourite with collectors who know and love Edinburgh.\n\nAnd the afternoon of the title sets a slower, more relaxed mood than his night scenes. This is Vettriano in daylight.\n\nThe edition is two hundred and fifty prints and twenty-five Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper. It makes a wonderful gift for anyone with a connection to the city, and it is an approachable first signed Vettriano.","edition":"Signed limited edition of 250 + 25 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":[52.1,62.1],"framedSizeCm":[62.7,72.7],"reviewNotes":"","estDurationSec":68,"audioUrl":"","audioCurrent":false}},{"productId":"56263ef1-c0c1-e770-2926-ad8bf52a5700","title":"Evening of Ritual","price":1250,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/5f58c4_e53e0622d0484ea3be83ad7823f88fe5~mv2.jpg","story":{"_id":"story-56263ef1-c0c1-e770-2926-ad8bf52a5700","status":"draft","transcript":"Evening of Ritual returns to one of Vettriano's favourite themes: the formalities, and the private ceremonies, of the night.\n\nIn his world the evening has its own codes. Codes of dress, of behaviour, and of what is left unsaid. His figures seem to follow them with great care. The title suggests a scene that has been played many times before, where everyone knows their part. And yet there is always the possibility that tonight, this evening, will turn out differently.\n\nIt is one of the most atmospheric images in our collection, and it rewards a place where it can be looked at often: a living room, a study, a bedroom. It is the kind of picture that seems to change with the light, and with your mood.\n\nThe edition is one of the smallest among his signed releases, just one hundred prints and ten Artist's Proofs, each signed and numbered by Jack Vettriano. Small editions like this are always the first to become hard to find, all the more so now that no new signed prints can ever be made.","edition":"Signed limited edition of 100 + 10 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":[39,31],"mountSizeCm":[62,52],"framedSizeCm":"","reviewNotes":"","estDurationSec":72,"audioUrl":"","audioCurrent":false}},{"productId":"29120bb5-682a-d9a4-3247-2f5d9632fa4d","title":"Exit Eden","price":765,"inStock":true,"ribbon":"Artist Proof Available","image":"https://static.wixstatic.com/media/d9cb8c_185e67220fda410288efaa50f480c177~mv2.png","story":{"_id":"story-29120bb5-682a-d9a4-3247-2f5d9632fa4d","status":"draft","transcript":"Exit Eden is one of Vettriano's most literary titles. It draws on the oldest story of temptation and loss there is: the expulsion from the Garden of Eden.\n\nIn his hands that ancient idea becomes modern and personal. It is about the moment innocence ends, or the moment a relationship crosses a line that cannot be uncrossed. So many of his paintings deal with desire and its consequences. This is the one whose title says so outright.\n\nIt is also one of the larger images among his signed editions on paper, more than fifty centimetres across, and it has real presence on a wall. Above a fireplace, or as the focal point of a living room, it holds the eye.\n\nThe edition is one hundred and seventy-five prints and twenty Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper, and an Artist's Proof is available. For a collector who wants a statement piece on paper, without moving up to the premium board-mounted editions, it is a compelling choice.","edition":"Signed limited edition of 175 + 20 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":[51.5,40.5],"mountSizeCm":[74.5,61.5],"framedSizeCm":[85.5,72.5],"reviewNotes":"","estDurationSec":69,"audioUrl":"","audioCurrent":false}},{"productId":"a40f6c22-3067-f84d-275c-025fd182f1ad","title":"Fetish","price":1100,"inStock":false,"ribbon":"Framed","image":"https://static.wixstatic.com/media/d9cb8c_dc36eec07ec54b98a6737c63ec2d4274~mv2.jpg","story":{"_id":"story-a40f6c22-3067-f84d-275c-025fd182f1ad","status":"draft","transcript":"Fetish is Vettriano up close.\n\nA man in a dark suit draws on a cigarette. Across the foreground stretches a woman's stockinged leg. That is all we are given, and it is more than enough.\n\nThis is one of his charged, close-cropped studies of desire, where what is half-seen says as much as anything shown. He was a master of the edge of the frame, of letting the viewer's imagination complete the picture. Here, the cropping is the story. We see the man, his composure, his cigarette. Of her, we see only what he sees.\n\nIt is a bold, cinematic image, very much from the noir side of his work, and it belongs in a private space: a study, a dressing room, a bedroom.\n\nThe edition was published in 2016, one hundred and seventy-five prints and twenty Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper. This example comes mounted and framed, ready to hang.","edition":"Signed limited edition giclée of 175 + 20 Artist's Proofs, published 2016, mounted and framed","medium":"Giclée on 300gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":[48.5,41],"framedSizeCm":"","reviewNotes":"","estDurationSec":64,"audioUrl":"","audioCurrent":false}},{"productId":"d26ba0eb-cb70-bee6-57b1-a424fcabb39b","title":"Heat Wave","price":565,"inStock":true,"ribbon":"Artist Proof Available","image":"https://static.wixstatic.com/media/5f58c4_8eeccfe2338b4d0bab3acbf03a809c40~mv2.png","story":{"_id":"story-d26ba0eb-cb70-bee6-57b1-a424fcabb39b","status":"draft","transcript":"Heat Wave. The kind of sultry, airless day that slows everything down.\n\nA woman holds a cold bottle to her forehead against the heat. It is the simplest of gestures, and Vettriano turns it into a whole study of mood and atmosphere. His summer paintings are rarely just about the weather. The heat becomes a backdrop for restlessness, for boredom, or for temptation, and the stillness of the scene leaves plenty of room for the imagination.\n\nThe palette is strong and warm, and there is a relaxed sensuality to it. It suits a living room or a bedroom, and it pairs beautifully with his beach and summer pictures.\n\nThe edition is one hundred and seventy-five prints and twenty Artist's Proofs, each signed and numbered by Jack Vettriano, and an Artist's Proof is available. It is printed on museum etching paper and set in a generous mount, which gives the image space to breathe and real presence on the wall.","edition":"Signed limited edition of 175 + 20 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":[39,31],"mountSizeCm":[72,62],"framedSizeCm":"","reviewNotes":"","estDurationSec":64,"audioUrl":"","audioCurrent":false}},{"productId":"c6b56789-4c97-b603-b4c5-e0e4b92ad350","title":"Her Secret Life","price":950,"inStock":false,"ribbon":"Framed","image":"https://static.wixstatic.com/media/d9cb8c_daa3f4fa391a4f4eabc024784b298017~mv2.jpg","story":{"_id":"story-c6b56789-4c97-b603-b4c5-e0e4b92ad350","status":"draft","transcript":"Her Secret Life. A woman in a black dress makes a call from a seaside phone box, bunting fluttering in the breeze outside.\n\nWho is on the other end of the line? That is the question the title asks, and it is the question Vettriano wants us to carry away with us. The bunting suggests a holiday, a seaside town in its best clothes. And she has slipped away from it all, to make one private call.\n\nIt is a perfect example of how he worked. A single, ordinary moment, a phone box on a promenade, becomes a whole hidden story, simply by giving it the right title and the right light. We are not told what her secret is. We are only told that she has one.\n\nThe painting was shown in Love, Devotion and Surrender, Vettriano's exhibition of June 2006.\n\nThis framed edition was published in 2006, limited to two hundred and ninety-five giclée prints, each signed and numbered by Jack Vettriano.","edition":"Signed limited edition giclée of 295, published 2006, framed","medium":"Giclée","signed":true,"imageSizeCm":[50.8,40.6],"mountSizeCm":"","framedSizeCm":"","reviewNotes":"","estDurationSec":66,"audioUrl":"","audioCurrent":false}},{"productId":"e722c9b0-b96b-e8ca-4f56-907a2d4b691b","title":"In Thoughts Of You","price":300,"inStock":false,"ribbon":"","image":"https://static.wixstatic.com/media/d9cb8c_e2045db04b06478ca78f364f22a211a2~mv2.jpg","story":{"_id":"story-e722c9b0-b96b-e8ca-4f56-907a2d4b691b","status":"draft","transcript":"In Thoughts of You. A woman in black sits on a white-draped chair, before a tall window, lost in thought.\n\nIt is one of Vettriano's stillest images. Nothing is happening, and that is precisely the point. The black of her dress against the white of the chair, the height of the window, the quiet of the room: everything draws us towards her, and towards whoever it is she is thinking of. The title addresses that person directly. In thoughts of you.\n\nVettriano painted many women alone like this, waiting, remembering, daydreaming, and these quiet portraits are among the most loved of all his work. They are pictures people choose to live with every day.\n\nThis image has been released in more than one limited edition over the years. This one is printed on Hahnemühle mould-made paper, whose soft surface suits the gentle tones of the scene, in an edition of three hundred and fifty, plus forty Artist's Proofs, each signed and numbered by Jack Vettriano. It is an intimate size, perfect for a bedroom or a reading corner.","edition":"Signed limited edition giclée of 350 + 40 Artist's Proofs","medium":"Giclée on 300gsm Hahnemühle mould-made paper","signed":true,"imageSizeCm":"","mountSizeCm":[34,40],"framedSizeCm":"","reviewNotes":"","estDurationSec":71,"audioUrl":"","audioCurrent":false}},{"productId":"14fccf88-569f-1ea9-41eb-beb4fd4008a4","title":"Jack Vettriano Portrait by Ian McIlgorm","price":375,"inStock":false,"ribbon":"","image":"https://static.wixstatic.com/media/d9cb8c_c2a32d522e0143a585bf62910dad1a82~mv2.jpg","story":{"_id":"story-14fccf88-569f-1ea9-41eb-beb4fd4008a4","status":"draft","transcript":"This piece turns the camera around. For once, Jack Vettriano is not the one creating the image. He is the subject.\n\nThe portrait was made by the acclaimed photographer Ian McIlgorm, during a sitting at the artist's London home. It is a rare, direct encounter with the man behind some of the most recognisable paintings of our time: the self-taught painter from Fife whose cinematic scenes of romance and intrigue found an audience around the world.\n\nThe photograph was shortlisted for the prestigious Taylor Wessing Photographic Portrait Prize in November 2017, and was subsequently exhibited at the National Portrait Gallery in London.\n\nThe edition is tiny: just fifty numbered giclée prints, and each one is signed by both of them, the photographer and the artist. That double signature makes it unusual in any collection of Vettriano's work. For a collector who already owns his paintings, it is a wonderful way to bring the artist himself into the room.","edition":"Limited edition of 50 giclée prints, signed by both Jack Vettriano and Ian McIlgorm","medium":"Giclée on 300gsm museum etching paper","signed":true,"imageSizeCm":[52.5,34],"mountSizeCm":[77.5,57],"framedSizeCm":"","reviewNotes":"Photograph of the artist by Ian McIlgorm, not a Vettriano painting - script reflects this.","estDurationSec":63,"audioUrl":"","audioCurrent":false}},{"productId":"b8929944-7a73-9987-1462-daaaa6ad10a5","title":"An Imperfect Past","price":1750,"inStock":true,"ribbon":"Limited Edition Silkscreen","image":"https://static.wixstatic.com/media/d9cb8c_45e56363b13041af9a32244de5a74799~mv2.jpg","story":{"_id":"story-b8929944-7a73-9987-1462-daaaa6ad10a5","status":"draft","transcript":"An Imperfect Past brings together two of Vettriano's great loves: the cinema, and the femme fatale.\n\nA woman smokes beside a film projector. The machine suggests old films being replayed, and with them old memories, and the title hints at a history she would perhaps rather forget. It is moody and atmospheric, and it is one of his most admired noir-influenced images.\n\nWhat makes this particular print special is how it was made. This is a silkscreen. Rather than being printed in a single pass, the image is built up one colour at a time, each pushed by hand through its own fine screen. The result is a layered surface, with flat, intense colour that a giclée cannot quite reproduce, and it is why collectors seek out his silkscreens in particular.\n\nThe edition was published in 2003, two hundred and seventy-five prints on heavyweight French Arches paper, and it sold out many years ago. The example we hold is number two hundred and forty, signed and numbered by the artist. Sold-out silkscreens like this one rarely come back to market.","edition":"Signed silkscreen, edition of 275 + 25 Artist's Proofs, published 2003 - this example numbered 240/275","medium":"Silkscreen on 400gsm Velin Arches Blanc","signed":true,"imageSizeCm":[74,58],"mountSizeCm":[90,75],"framedSizeCm":"","reviewNotes":"","estDurationSec":72,"audioUrl":"","audioCurrent":false}},{"productId":"666d1c91-4127-d060-1a59-6daf4adf5260","title":"Angel","price":465,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/5f58c4_bff7583b29d244fca73ce19fe1e84fc7~mv2.jpeg","story":{"_id":"story-666d1c91-4127-d060-1a59-6daf4adf5260","status":"draft","transcript":"Angel. A single word, and the kind of title Vettriano chose when he wanted you to bring your own meaning to the picture.\n\nAngels, fallen and otherwise, appear more than once in his work. His collection Fallen Angels gave its name to one of his best-known books. In his hands, the word is rarely innocent. It carries affection, and a hint of irony too, and the figures he painted under such titles tend to be rather more complicated than their names suggest.\n\nAngel works beautifully on its own, or as part of a group of his figure studies. It is a moderate size, which makes it adaptable: a bedroom, a study, or a quieter corner of a living room where it can be looked at closely.\n\nThe edition is just one hundred prints and ten Artist's Proofs, one of the smaller runs among his signed releases, each signed and numbered by Jack Vettriano. As one of our more accessible signed editions, it is a lovely way into his work.","edition":"Signed limited edition of 100 + 10 Artist's Proofs","medium":"Giclée on fine art paper","signed":true,"imageSizeCm":[39,34],"mountSizeCm":[61.5,55],"framedSizeCm":"","reviewNotes":"","estDurationSec":68,"audioUrl":"","audioCurrent":false}},{"productId":"44e7f6a7-0958-1a2a-5051-b06c4e2d018d","title":"Arrangement In Red, White and Blue","price":1495,"inStock":true,"ribbon":"Premium Limited Edition","image":"https://static.wixstatic.com/media/5f58c4_64540278538a4500bb7435b81fbcfc9b~mv2.jpg","story":{"_id":"story-44e7f6a7-0958-1a2a-5051-b06c4e2d018d","status":"draft","transcript":"Arrangement in Red, White and Blue borrows its title from the language of fine art.\n\nPainters such as Whistler named their pictures in just this way, Arrangement in Grey and Black, treating them as harmonies of colour as much as portraits of people. Vettriano's title nods to that tradition with a knowing smile. The red, the white and the blue are the key to the whole composition, and the title invites you to look at the picture as a study in colour as well as a scene.\n\nThat palette gives the image a crisp, graphic quality. It is confident and contemporary, and it holds its own in a modern interior just as well as a traditional one.\n\nThis is a Premium Limited Edition, and it is presented very differently from a paper print. It is reproduced at the same size as the original painting, board mounted, then finished by hand with three coats of lacquer for a satin surface, closer to canvas than paper. It arrives in the same style of frame used for his original work, with no border and no glass. The edition is one hundred and twenty-five, plus fifteen Artist's Proofs, each signed and numbered by Vettriano in silver pen.","edition":"Premium limited edition of 125 + 15 Artist's Proofs, signed in silver pen; original-size, board-mounted, hand-lacquered","medium":"Giclée, board mounted, hand-embellished with 3 coats of lacquer, no glass","signed":true,"imageSizeCm":[38.1,30.5],"mountSizeCm":"","framedSizeCm":[59.2,51.6],"reviewNotes":"","estDurationSec":81,"audioUrl":"","audioCurrent":false}},{"productId":"3f7de79f-e526-8bf4-ca05-5717d4559504","title":"At Last, My Lovely","price":1750,"inStock":true,"ribbon":"Artist Proof","image":"https://static.wixstatic.com/media/d9cb8c_432afed5d17f48999f2abfc9d3e6b960~mv2.jpg","story":{"_id":"story-3f7de79f-e526-8bf4-ca05-5717d4559504","status":"draft","transcript":"At Last, My Lovely. It has the warmth of a song lyric, and the relief of a long wait finally over.\n\nThis is a title about reunion: the person you have been waiting for, at last walking through the door. Vettriano's paintings so often hover between romance and melancholy. This one leans, quite openly, towards romance.\n\nThe print you are looking at is something special. It is an Artist's Proof. The edition comprised one hundred and twenty-five prints, plus just fifteen proofs, traditionally set aside for the artist himself. That scarcity is why collectors prize them, and this one is signed by Jack Vettriano and comes with its certificate of authenticity.\n\nIt is a compact image, printed on heavy museum etching paper, which makes it a lovely choice for a bedroom, or as a gift for someone who has been worth the wait. And it sits very comfortably within a group of his smaller prints.","edition":"Artist's Proof from an edition of 125 + 15 Artist's Proofs, signed","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":[20.5,25.5],"mountSizeCm":[41.5,48.4],"framedSizeCm":"","reviewNotes":"","estDurationSec":62,"audioUrl":"","audioCurrent":false}},{"productId":"ef6e2e1e-5830-185f-b28b-17685b88f636","title":"Bird On The Wire","price":1650,"inStock":true,"ribbon":"Framed","image":"https://static.wixstatic.com/media/d9cb8c_19ae50643a36421ea13bfedbeaf2ebc8~mv2.jpg","story":{"_id":"story-ef6e2e1e-5830-185f-b28b-17685b88f636","status":"draft","transcript":"Bird on the Wire takes its title from Leonard Cohen's celebrated song, a song about freedom, longing, and imperfect love.\n\nVettriano often borrowed his titles from music he admired. They add a second layer of meaning to the paintings, and invite you to bring the mood of the song to the image. Hum a few bars of Cohen as you look at this one, and you will see what he meant.\n\nThis is a statement piece. At ninety-seven by seventy-nine centimetres, it is one of the largest prints in our collection, with the presence to command a living-room wall, or the main wall of a hallway or a stairwell.\n\nAnd it is a silkscreen. Each colour was laid down separately, pushed by hand through its own fine screen, building a layered surface with flat, intense colour that a giclée cannot quite reproduce. It was published in 2003, in an edition of two hundred and seventy-five, plus thirty Artist's Proofs, each signed and numbered by Jack Vettriano, on heavyweight French Arches paper, much loved by printmakers.","edition":"Signed silkscreen, edition of 275 + 30 Artist's Proofs, published 2003","medium":"Silkscreen on 400gsm Velin Arches Blanc","signed":true,"imageSizeCm":"","mountSizeCm":[97,79],"framedSizeCm":"","reviewNotes":"","estDurationSec":70,"audioUrl":"","audioCurrent":false}},{"productId":"6e9e1a5d-ed72-99b5-23b7-711c4847ee51","title":"Bluebird at Bonneville","price":7350,"inStock":true,"ribbon":"Premium Limited Edition","image":"https://static.wixstatic.com/media/5f58c4_4a153cba72414f1c8201b36d0fdfee6b~mv2.jpeg","story":{"_id":"story-6e9e1a5d-ed72-99b5-23b7-711c4847ee51","status":"draft","transcript":"Bluebird at Bonneville is one of Vettriano's most ambitious, and most distinctive, paintings.\n\nIt takes us to the golden age of the land speed record. Sir Malcolm Campbell brought his Blue Bird to the Bonneville Salt Flats in Utah, and in 1935 he became the first person to drive at more than three hundred miles an hour. Vettriano was fascinated by that era, its daring, its engineering, its glamour. And the vast white expanse of the salt flats gives this picture a scale and an openness that is rare in his work.\n\nIt is loved by motor-racing enthusiasts as much as by Vettriano collectors, and it has a companion in Pendine Beach, another of his paintings set at a famous land speed venue.\n\nThis premium edition was released as a celebration of his greatest works. It is reproduced at the full size of the original painting, twenty-four by forty inches, board mounted and finished by hand with three coats of lacquer, then framed exactly as an original would be, with no border and no glass. Just seventy-five were made, plus seven Artist's Proofs, each signed and numbered by Vettriano in silver pen. It is one of the most significant premium editions he ever released.","edition":"Premium limited edition of 75 + 7 Artist's Proofs, original size (24 x 40 in), signed in silver pen","medium":"Giclée, board mounted, hand-embellished with 3 coats of lacquer, no glass","signed":true,"imageSizeCm":[61,101.6],"mountSizeCm":"","framedSizeCm":"","reviewNotes":"","estDurationSec":82,"audioUrl":"","audioCurrent":false}},{"productId":"acd35c06-6607-fff2-fe55-ebeea69fa396","title":"Heaven Or Hell","price":1950,"inStock":true,"ribbon":"Framed","image":"https://static.wixstatic.com/media/d9cb8c_32d57889b5174aadaf1a29cc3f33a9b6~mv2.jpg","story":{"_id":"story-acd35c06-6607-fff2-fe55-ebeea69fa396","status":"draft","transcript":"Heaven or Hell comes from the most sensual chapter of Vettriano's work.\n\nIts full title is Heaven or Hell: the Sweetest Choice, and it belongs to the imagery of The Red Room Collection, a folio of five of his most daring paintings, published as signed limited editions in 2014. The title captures the dilemma at the heart of all of them: desire that promises bliss, and risks the consequences, in the very same moment.\n\nVettriano never shied away from sensuality, and the Red Room images are among his boldest. This is a picture for a private space, a bedroom or a dressing room, and for the collector who appreciates the more daring side of his art.\n\nThis is a rare signed limited edition, offered on its own, separately from the five-print folio, which is also in our collection. It is signed by Jack Vettriano and comes with a certificate of authenticity. And since his death in 2025, no new signed prints can be made. The supply of this edition is fixed, and it will not grow.","edition":"Signed limited edition (from the 2014 Red Room imagery), offered individually","medium":"Giclée","signed":true,"imageSizeCm":"","mountSizeCm":"","framedSizeCm":"","reviewNotes":"Edition size and dimensions not in product copy - add for provenance panel and view-in-room. Mature theme; suggest only including for collectors who've shown interest in the Red Room works.","estDurationSec":70,"audioUrl":"","audioCurrent":false}},{"productId":"a067f80c-d8df-40e2-072d-149be9a2c08f","title":"Lucky Seven","price":535,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/5f58c4_79eb88fd128a4dbe92d7e7c969443a4d~mv2.jpg","story":{"_id":"story-a067f80c-d8df-40e2-072d-149be9a2c08f","status":"draft","transcript":"Lucky Seven. A gambler's title, the kind Vettriano loved, with its suggestion of chance, of risk, and of an evening that might turn either way.\n\nGames, wagers and risk recur all through his work, from card tables to dance halls. But his figures rarely seem to be playing for money. The stakes are emotional. And the number seven, traditionally the lucky one, gives the title a hopeful ring, one his paintings seldom let us take entirely at face value.\n\nIt is a smaller image, and it suits a study, a dressing room, or a group of his prints hung together. It is also one of the more accessible signed editions in our collection, a sensible place to begin, or a thoughtful gift for someone who already loves his work.\n\nThe edition is just one hundred prints and ten Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper. An edition of one hundred is small by the standards of his published prints, and now that no new signed editions can ever be produced, its supply is fixed.","edition":"Signed limited edition of 100 + 10 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":[25,21],"mountSizeCm":[47.5,42],"framedSizeCm":[57.9,52.4],"reviewNotes":"","estDurationSec":72,"audioUrl":"","audioCurrent":false}},{"productId":"e80713f0-af3f-f323-8d35-9b15a3da16b8","title":"Lunchtime Lovers","price":1400,"inStock":true,"ribbon":"Framed","image":"https://static.wixstatic.com/media/5f58c4_b863172b6fda4dc991799adb60318092~mv2.jpg","story":{"_id":"story-e80713f0-af3f-f323-8d35-9b15a3da16b8","status":"draft","transcript":"Lunchtime Lovers. Few of Vettriano's titles are quite so suggestive.\n\nIt conjures the stolen hour in the middle of the working day. The arrangement kept secret from colleagues and from partners. The thrill of meeting when no one is watching, and the clock ticking back towards the office.\n\nSecret liaisons run all through his work, and he never painted them with judgement. He treated them with a novelist's curiosity about what people actually feel: excitement, guilt and longing, in equal measure. That is why his pictures feel so human. Nobody in them is simply a villain or a victim.\n\nThis is one of the images collectors associate most closely with his narrative style: a whole short story in a single frame. It belongs in a private room, a study or a bedroom.\n\nThe edition is one hundred and twenty-five prints and fifteen Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper, and this example is framed. Its value reflects not only the size of the edition, but the enduring demand for this image.","edition":"Signed limited edition of 125 + 15 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":[39,31],"mountSizeCm":[62,52],"framedSizeCm":"","reviewNotes":"","estDurationSec":71,"audioUrl":"","audioCurrent":false}},{"productId":"4b8795fc-5beb-54ff-8595-2a6f3ef27a0a","title":"Night Calls - Artist Proof 1/10","price":4000,"inStock":true,"ribbon":"Artist Proof 1/10","image":"https://static.wixstatic.com/media/d9cb8c_010e947063a34593b1bc1db6e2657cb2~mv2.png","story":{"_id":"story-4b8795fc-5beb-54ff-8595-2a6f3ef27a0a","status":"draft","transcript":"Night Calls belongs to the after-dark side of Vettriano's work: the telephone, the late hour, the closed door, and something private about to happen.\n\nThe title suggests a call that should not be made, or an arrangement made under cover of night. This is Vettriano at his most noir. Low light, a heavy sense of mood, and a story told through glances and gestures rather than spelled out.\n\nBut the print in front of you is something rarer than the image alone. It is not from the main edition. It is an Artist's Proof, and it is numbered one of ten.\n\nArtist's Proofs are the small group of prints traditionally set aside from an edition for the artist himself. They are among the most sought-after prints a collector can own. The main edition of Night Calls was limited to one hundred prints, which means only ten proofs exist in the world, and this is the first of them.\n\nIt is signed and numbered by Jack Vettriano, on museum etching paper, and comes with its certificate of authenticity. For a serious collector of his work, a proof numbered one is a very special thing.","edition":"Artist's Proof numbered 1 of 10 (main edition 100), signed","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":[39,31.5],"mountSizeCm":[62,53.5],"framedSizeCm":[73,64.5],"reviewNotes":"","estDurationSec":77,"audioUrl":"","audioCurrent":false}},{"productId":"678c5ed0-7d61-d6cc-ce57-e5ea1a613a32","title":"Night-Time Rituals","price":1450,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/5f58c4_32988047f7e14ec0b2a3e134d39f5594~mv2.jpg","story":{"_id":"story-678c5ed0-7d61-d6cc-ce57-e5ea1a613a32","status":"draft","transcript":"Night-Time Rituals explores a theme Vettriano returned to all through his career: the private habits and ceremonies that come with the evening.\n\nDressing. Undressing. Pouring a drink. Waiting for a knock at the door. In his paintings these ordinary acts become charged and theatrical, lit as though for a film. The word ritual suggests something familiar, repeated many times. But it also suggests something with its own rules, and that tension lies at the heart of his intimate interiors.\n\nThis painting belongs to the more sensual strand of his work, and it is best enjoyed close up, in a private room: a bedroom, or a dressing room.\n\nIt is also a Premium Limited Edition, which means it is presented very differently from a paper print. It is reproduced at the exact size of the original painting, board mounted and finished by hand with three coats of lacquer, for a satin surface closer to canvas than paper. It arrives in the same style of frame Vettriano used for his originals, with no border and no glass, and each one is signed and numbered by him in silver pen. A premium edition is the closest a print can come to the presence of the original canvas.","edition":"Premium limited edition, original size (12 x 15 in), signed in silver pen","medium":"Giclée, board mounted, hand-embellished with 3 coats of lacquer, no glass","signed":true,"imageSizeCm":[30.5,38.1],"mountSizeCm":"","framedSizeCm":"","reviewNotes":"Edition size not in product copy - add for provenance panel.","estDurationSec":82,"audioUrl":"","audioCurrent":false}},{"productId":"fc67cb0b-4d3b-2a1d-9c05-224107d4562a","title":"On Parade","price":3750,"inStock":true,"ribbon":"Rare Print - Studio Proof","image":"https://static.wixstatic.com/media/5f58c4_ac038f6343464d01b9ac08b5e242578a~mv2.jpg","story":{"_id":"story-fc67cb0b-4d3b-2a1d-9c05-224107d4562a","status":"draft","transcript":"On Parade shows Vettriano's gift for the dramatic entrance.\n\nA woman in a striking red jacket steps through a doorway. The whole painting is about that moment of arrival: the confidence of the pose, the strong colour against a darker setting, and the unmistakable sense that she knows exactly the effect she is having. The title says it all. Display, performance, and the pleasure of being seen.\n\nRed was one of Vettriano's most powerful tools. He often used it to draw the eye to a single figure in an otherwise restrained palette, and On Parade is one of the boldest examples of that. You notice her first, and you keep coming back to her.\n\nThis is a picture with real presence. It is a large print, and it makes a natural focal point for a hallway, a dining room, or any wall where you want a painting to make a statement.\n\nThe edition was published in 2008, limited to two hundred and fifty, each signed and numbered by Jack Vettriano. Editions from nearly two decades ago are increasingly hard to find in good condition. This example comes framed, in a dark frame that suits the drama of the image.","edition":"Signed limited edition giclée of 250, published 2008 (this example listed as a Studio Proof), dark frame","medium":"Giclée","signed":true,"imageSizeCm":[63.5,50.5],"mountSizeCm":[88.5,73.5],"framedSizeCm":"","reviewNotes":"Ribbon says 'Studio Proof' but copy describes the 250 edition - Studio to confirm which this example is before recording.","estDurationSec":80,"audioUrl":"","audioCurrent":false}},{"productId":"66203236-7c4d-8fb8-5267-f840f9188863","title":"Pincer Movement","price":1500,"inStock":true,"ribbon":"Framed","image":"https://static.wixstatic.com/media/d9cb8c_d591cc5bc06a4a939f9d03b83f9679cd~mv2.jpg","story":{"_id":"story-66203236-7c4d-8fb8-5267-f840f9188863","status":"draft","transcript":"Pincer Movement borrows its title from military strategy: the manoeuvre in which an opponent is surrounded from two sides at once.\n\nVettriano applies the idea, with typical wit, to the battlefield of romance and seduction. His titles often cast relationships as games, or campaigns, and this one suggests a carefully planned approach. But as in any campaign, the outcome is far from certain. Who is surrounding whom? And who will surrender first?\n\nIt is a later image, published in 2012, and its clever title and strong composition make it a real talking point. Hang it in a living room or a study, and wait for your guests to ask about the name.\n\nThe edition is one of the smaller runs among his signed prints: just one hundred, plus ten Artist's Proofs, each signed and numbered by Jack Vettriano, on heavyweight museum etching paper. This example is framed and ready to hang.","edition":"Signed limited edition giclée of 100 + 10 Artist's Proofs, published 2012","medium":"Giclée on 350gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":[51,42],"framedSizeCm":"","reviewNotes":"","estDurationSec":60,"audioUrl":"","audioCurrent":false}},{"productId":"101027d8-6821-fb1d-bd79-5f04309a0e84","title":"Portrait In Black and Pearl","price":2100,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/5f58c4_d113ab92ed6f45848cb6119921a06b4a~mv2.jpg","story":{"_id":"story-101027d8-6821-fb1d-bd79-5f04309a0e84","status":"draft","transcript":"Portrait in Black and Pearl is one of Vettriano's most elegant single-figure paintings.\n\nA woman in a cloche hat and a fur collar, pictured with all the poise of a society portrait from the nineteen-twenties or thirties, the era whose fashions and manners he so loved to recreate. The black and the pearl of the title set the palette: restrained, polished and glamorous, with her face as the point of focus.\n\nVettriano painted many women, but his formal portraits have a particular stillness compared with his narrative scenes. There is no second figure here, and no implied drama. Just presence, and style.\n\nIt was first shown in 2010, at his exhibition Days of Wine and Roses in Kirkcaldy, and published that same year in an edition of two hundred and fifty, with twenty-five Artist's Proofs, each signed and numbered by Jack Vettriano.\n\nWe have a single example, supplied framed. Framed examples from an edition more than fifteen years old do not come up often. It suits a formal room, a dining room or a bedroom, and it pairs beautifully with his other portraits of women.","edition":"Signed limited edition of 250 + 25 Artist's Proofs, published 2010, supplied framed","medium":"350gsm museum etching paper","signed":true,"imageSizeCm":[36,29],"mountSizeCm":[58.5,50],"framedSizeCm":[69.5,60.5],"reviewNotes":"","estDurationSec":74,"audioUrl":"","audioCurrent":false}},{"productId":"987c56d4-d78b-993a-7733-a56bfce5ef29","title":"The Missing Man II","price":2750,"inStock":true,"ribbon":"Premium Limited Edition","image":"https://static.wixstatic.com/media/5f58c4_ac158f2439694be1a04913f9104c5052~mv2.jpg","story":{"_id":"story-987c56d4-d78b-993a-7733-a56bfce5ef29","status":"draft","transcript":"The Missing Man II returns to one of Vettriano's best-known titles.\n\nThe original Missing Man, published as a silkscreen in 1998, is one of his classic beach scenes. This second painting comes back to the idea at its heart: absence. Someone who should be there, and is not. And the people left behind, waiting, or wondering.\n\nIt is a wonderful device, and Vettriano used it brilliantly. With a single title, an ordinary gathering becomes a mystery. We find ourselves scanning the picture for the one person we cannot see, and asking where he has gone, and why.\n\nThe Missing Man II was released on the twenty-fifth of September 2020, as part of a celebration of Jack Vettriano's greatest works. It is reproduced at the full size of the original painting, thirty by twenty-four inches, board mounted and finished by hand with three coats of lacquer for a satin surface. It comes in the same style of frame as an original, with no border and no glass.\n\nThe edition is just seventy-five, plus five Artist's Proofs, each signed and numbered by Vettriano in silver pen. It has the scale to anchor a room, and the story to hold your attention for years.","edition":"Premium limited edition of 75 + 5 Artist's Proofs, original size (30 x 24 in), signed in silver pen, released 25 Sept 2020","medium":"Giclée, board mounted, hand-embellished with 3 coats of lacquer, no glass","signed":true,"imageSizeCm":[76.2,61],"mountSizeCm":"","framedSizeCm":"","reviewNotes":"","estDurationSec":80,"audioUrl":"","audioCurrent":false}},{"productId":"3ac11ed9-6f5b-89f1-b126-6e52ba6fdde8","title":"Yesterday's Dreams","price":2750,"inStock":true,"ribbon":"Framed","image":"https://static.wixstatic.com/media/5f58c4_5ebd9cd8417141ff8c95d7d954ab7100~mv2.jpeg","story":{"_id":"story-3ac11ed9-6f5b-89f1-b126-6e52ba6fdde8","status":"draft","transcript":"Yesterday's Dreams. It is a reflective, bittersweet title, and it sums up so much of Vettriano's appeal.\n\nHis paintings are steeped in memory and nostalgia: for a style of dressing, of dancing and of romance that belongs to another era, and for the hopes people once had for themselves. This title suggests someone looking back on a life, or a love, and wondering quietly what became of it.\n\nIt is a contemplative picture rather than a dramatic one, and it invites a second look, and then a third.\n\nThis is a Premium Limited Edition, reproduced at the full size of the original painting, twenty-four by twenty inches. It is board mounted and finished by hand with three coats of lacquer, giving a satin surface much closer to canvas than paper, and it is presented in the same style of frame used for his original work, with no glass. The edition is tiny: just seventy-five prints and seven Artist's Proofs, each signed and numbered by Vettriano in silver pen. At this size, it holds a living room or dining room with ease.","edition":"Premium limited edition of 75 + 7 Artist's Proofs, signed in silver pen; original-size, board-mounted, hand-lacquered","medium":"Giclée, board mounted, hand-embellished with 3 coats of lacquer, no glass","signed":true,"imageSizeCm":[61,50.8],"mountSizeCm":"","framedSizeCm":"","reviewNotes":"Framed size not in product copy - confirm for view-in-room.","estDurationSec":72,"audioUrl":"","audioCurrent":false}},{"productId":"e0762be1-68d4-cddc-5262-9407895d4949","title":"The Red Room Collection","price":7995,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/d9cb8c_095555575adf44ccbdd8686c1ea59bea~mv2.jpg","story":{"_id":"story-e0762be1-68d4-cddc-5262-9407895d4949","status":"draft","transcript":"The Red Room Collection is a folio of five of Jack Vettriano's most daring images, published together for the first time as signed limited editions in 2014.\n\nThe five are Devotion; The Great Poet; Heaven or Hell: the Sweetest Choice; 'Round Midnight; and Scarlet Ribbons. Together they represent the most private side of his art, built around desire, around power, and around the theatre of seduction.\n\nVettriano never shied away from sensuality, and these are the paintings where he went furthest. They are not for every wall. But for the collector who appreciates this side of his work, they are among the most compelling pictures he ever made.\n\nWhat makes this a significant piece is that it is the complete folio. Owning all five together gives you the series exactly as Vettriano intended it to be seen, and complete sets are considerably scarcer than single prints from the series.\n\nThe edition is limited to one hundred and fifty sets, plus thirty Artist's Proofs, each print signed and numbered by Jack Vettriano, on Hahnemühle museum etching paper. Framed identically and hung as a group, they transform a private room.","edition":"Folio of five signed giclées, edition of 150 sets + 30 Artist's Proofs, published 2014","medium":"Giclée on 300gsm Hahnemühle museum etching paper (x5)","signed":true,"imageSizeCm":[30,24.5],"mountSizeCm":[41,34.5],"framedSizeCm":[65,58.5],"reviewNotes":"Product copy says 'Price on application' but listing is priced at GBP 7,995 - Studio to reconcile. Mature theme. View-in-room should show five frames.","estDurationSec":75,"audioUrl":"","audioCurrent":false}},{"productId":"0a3569c2-6e81-5aee-c7ad-4bf5de982c0e","title":"Just The Way It Is","price":1200,"inStock":true,"ribbon":"Framed","image":"https://static.wixstatic.com/media/d9cb8c_f3b937540d4f46f1a8566f03f1db6e77~mv2.jpg","story":{"_id":"story-0a3569c2-6e81-5aee-c7ad-4bf5de982c0e","status":"draft","transcript":"Just the Way It Is. The title says it all.\n\nThis is one of Vettriano's frank, unadorned figure studies: a nude woman seated on a chair, painted without pretence and without apology. The seated nude is one of the oldest subjects in Western painting, and Vettriano takes his place in that long tradition, bringing to it his own clean lines and his cinematic way with light.\n\nWhat is striking is the calm. This is a confident image rather than a provocative one. The figure is presented simply as she is, just the way it is, and there is a quiet dignity in that directness.\n\nIt is printed on Hahnemühle mould-made paper. Hahnemühle has been making paper in Germany since the sixteenth century, and the fine, gently textured surface suits the soft tones of the figure particularly well.\n\nThe edition is three hundred and fifty prints and forty Artist's Proofs, each signed and numbered by Jack Vettriano. This example is framed, and it belongs in a bedroom or a private study.","edition":"Signed limited edition giclée of 350 + 40 Artist's Proofs","medium":"Giclée on 350gsm Hahnemühle mould-made paper","signed":true,"imageSizeCm":"","mountSizeCm":[40,48.5],"framedSizeCm":"","reviewNotes":"Nude figure study - consider audience.","estDurationSec":68,"audioUrl":"","audioCurrent":false}},{"productId":"9a04f59e-107f-15c8-6245-d14ad579638e","title":"Love Italia","price":1250,"inStock":false,"ribbon":"Artist Proof","image":"https://static.wixstatic.com/media/5f58c4_b1dedfc984a24ad3a104ce47d0eff8ee~mv2.jpeg","story":{"_id":"story-9a04f59e-107f-15c8-6245-d14ad579638e","status":"draft","transcript":"Love Italia is Vettriano on holiday.\n\nA couple ride a white scooter. She wears a white dress with a red sash, he wears a blazer, and behind them stands a large red number seven. It is one of his brightest and most carefree images, full of sunshine and holiday romance.\n\nSo much of Vettriano's world happens at night, in smoky bars and dimly lit rooms, under heavy skies. Love Italia is the other side of him: playful, colourful, and unashamedly joyful. The white scooter, the flash of red, the sense of movement: you can almost feel the warm air.\n\nAnd notice the seven. It appears elsewhere in his work too, the lucky number, and here it seems to promise that luck is on this couple's side.\n\nThis is an Artist's Proof, from an edition of one hundred and seventy-five prints with just twenty proofs set aside, signed by Jack Vettriano. Artist's Proofs are prized for their scarcity. It is a compact image, and it brings a burst of Mediterranean light to any room.","edition":"Artist's Proof from an edition of 175 + 20 Artist's Proofs, signed","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":[20,25.5],"mountSizeCm":[41,48.5],"framedSizeCm":"","reviewNotes":"","estDurationSec":69,"audioUrl":"","audioCurrent":false}},{"productId":"8f9b8973-a31f-d686-52b7-e23fe81e1715","title":"Mad Dogs","price":950,"inStock":false,"ribbon":"Framed","image":"https://static.wixstatic.com/media/d9cb8c_4415413e386447cca6505430d205a980~mv2.jpg","story":{"_id":"story-8f9b8973-a31f-d686-52b7-e23fe81e1715","status":"draft","transcript":"Mad Dogs is one of the paintings that made Jack Vettriano's name.\n\nHe painted it in 1991, early in his professional career. Fashionably dressed figures with umbrellas stand on a beach, in strong, dramatic light. The title comes from Noël Coward's famous quip, that only mad dogs and Englishmen go out in the midday sun, and the painting shares Coward's wit: people determined to keep up appearances, whatever the weather.\n\nIt is witty, stylish and beautifully composed, everything that made his early beach paintings so loved. Years later, it was chosen for the major retrospective of his work at Kelvingrove Art Gallery and Museum in Glasgow, and it remains one of the images collectors ask us for most often.\n\nThis signed edition is limited to three hundred and fifty prints, with forty Artist's Proofs, each signed and numbered by Jack Vettriano, on Hahnemühle mould-made paper. It is a wonderful way to own a signed version of one of his most celebrated paintings. And it belongs on a bright wall.","edition":"Signed limited edition giclée of 350 + 40 Artist's Proofs","medium":"Giclée on 350gsm Hahnemühle mould-made paper","signed":true,"imageSizeCm":"","mountSizeCm":[40,48.5],"framedSizeCm":"","reviewNotes":"A separate POA listing exists for signed/AP Mad Dogs (8fce8fa9) - not in this list as it has no price.","estDurationSec":68,"audioUrl":"","audioCurrent":false}},{"productId":"667b4ae6-0803-2adc-8fd5-cc8480831b3e","title":"Man of Mystery","price":610,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/d9cb8c_d6acf807a2234fa9b75fdf3d82d29de2~mv2.jpg","story":{"_id":"story-667b4ae6-0803-2adc-8fd5-cc8480831b3e","status":"draft","transcript":"Man of Mystery. A woman in a white robe takes a drink from a man's hand.\n\nWe see the gesture, but not the story behind it. And that is exactly the point. The man remains a mystery, to us, and perhaps to her as well. Is this a moment of trust, or of temptation? Vettriano will not tell us.\n\nHe was a master of the half-told story, and this painting rests entirely on a single, charged moment. Everything is in the hands: the glass offered, the glass taken.\n\nThe white of her robe against the darker surroundings gives the picture a strong, clear focus. Your eye goes straight to her, and then to the hand reaching into the frame.\n\nThis is a limited edition of two hundred and fifty giclée prints, each signed and numbered by Jack Vettriano, presented in a generous mount that gives it real presence on the wall. Like all his signed editions, its supply is now fixed. It is a favourite with collectors who love the more intimate, narrative side of his work.","edition":"Signed limited edition giclée of 250","medium":"Giclée","signed":true,"imageSizeCm":"","mountSizeCm":[62.2,73],"framedSizeCm":"","reviewNotes":"","estDurationSec":71,"audioUrl":"","audioCurrent":false}},{"productId":"83b1e547-40bc-1f9f-241b-8a3566643bff","title":"Master of Ceremonies","price":465,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/5f58c4_ff0c14e69c21426e97bd68e769980042~mv2.gif","story":{"_id":"story-83b1e547-40bc-1f9f-241b-8a3566643bff","status":"draft","transcript":"Master of Ceremonies. The figure who runs the evening.\n\nThe compère. The host. The man who decides when the music starts, and who is introduced to whom. Vettriano was fascinated by social ritual, at the dance hall, the bar, the formal dinner, and the people who orchestrate these occasions have a natural place in his world.\n\nThe title carries his familiar note of theatre, as though this scene were one act in a much longer performance, and we have walked in partway through.\n\nThe painting belongs to the strand of his work that celebrates evening wear, ceremony, and a wonderfully old-fashioned sense of occasion. It is a natural choice for a dining room, or anywhere you entertain, and it sits well with his other dance-hall and nightlife images.\n\nThe edition is just one hundred prints and ten Artist's Proofs, one of the smaller runs among his signed releases, each signed and numbered by Jack Vettriano. It is also one of the most accessible signed Vettriano editions we offer.","edition":"Signed limited edition of 100 + 10 Artist's Proofs","medium":"Giclée","signed":true,"imageSizeCm":[32.3,39],"mountSizeCm":[60,55.3],"framedSizeCm":"","reviewNotes":"","estDurationSec":67,"audioUrl":"","audioCurrent":false}},{"productId":"3f71056b-811b-92a9-2813-edbf795db4ae","title":"Model In Westwood","price":560,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/d9cb8c_50fdec76f0e34a44b2aebeb98fddf767~mv2.jpg","story":{"_id":"story-3f71056b-811b-92a9-2813-edbf795db4ae","status":"draft","transcript":"Model in Westwood brings fashion to the forefront.\n\nClothes were always central to Vettriano's art. The cut of a suit, the line of a dress, the way a stocking or a glove catches the light: in his paintings, what people wear tells you who they are, or who they want to be. Here, the clothes are the subject, and the title names them.\n\nThis painting belongs to his series of studio and model pictures, which explore the relationship between the painter, his sitter, and the costume. The model becomes a figure of style and attitude, posed and aware of being looked at.\n\nIt was published in 2015, one of his later editions, in an edition of two hundred and fifty prints and twenty-five Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper.\n\nIt is one of the most accessible signed editions we offer, and with its stylish subject, it is a wonderful choice for a bedroom, a dressing room, or a study.","edition":"Signed limited edition giclée of 250 + 25 Artist's Proofs, published 2015","medium":"Giclée on 300gsm museum etching paper","signed":true,"imageSizeCm":"","mountSizeCm":[41,49],"framedSizeCm":[62.7,72.7],"reviewNotes":"","estDurationSec":66,"audioUrl":"","audioCurrent":false}},{"productId":"7e368157-4957-88d1-3f93-666715d69add","title":"Morning News","price":1250,"inStock":false,"ribbon":"","image":"https://static.wixstatic.com/media/d9cb8c_ab2342c0409e4f15b0167e71d7db2ece~mv2.jpg","story":{"_id":"story-7e368157-4957-88d1-3f93-666715d69add","status":"draft","transcript":"Morning News. A woman in a blue dress reads the morning paper at an outdoor café table, a classic car parked beside her.\n\nIt is a picture of pure, unhurried pleasure. Coffee, the newspaper, the morning sun, and a beautiful car waiting at the kerb. If so many of Vettriano's paintings are about the drama of the night, this one is about the calm of the morning after, when there is nowhere to be and nothing to hurry for.\n\nAnd yet, he is Vettriano. We cannot help wondering what she is reading, whose car it is, and whether the news on the page has anything to do with her.\n\nMorning News was first shown in 2010, in Days of Wine and Roses, the exhibition at Kirkcaldy Museum and Art Gallery. That was the gallery where, as a young man, he had taught himself to paint. The original painting has since sold.\n\nThis limited edition giclée was published in 2012, each print signed and numbered by Jack Vettriano.","edition":"Signed limited edition giclée, published 2012","medium":"Giclée","signed":true,"imageSizeCm":[35.6,27.9],"mountSizeCm":"","framedSizeCm":"","reviewNotes":"Edition size not in product copy - add for provenance panel.","estDurationSec":67,"audioUrl":"","audioCurrent":false}},{"productId":"592c3959-942c-7952-4c3c-76266258f6d7","title":"Narcissistic Bathers","price":660,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/5f58c4_75fab7a521ab43908efb49d8026c0eb0~mv2.jpg","story":{"_id":"story-592c3959-942c-7952-4c3c-76266258f6d7","status":"draft","transcript":"Narcissistic Bathers is one of the most significant Vettriano releases of recent years, and not only because of the image.\n\nIt belongs to a small group of previously unreleased editions that Jack Vettriano signed by hand before his death in March 2025. That makes it one of the very last editions anywhere to carry his original pencil signature. When it was released in September 2026, there was never any doubt that collectors would take notice.\n\nThe title is pure Vettriano: knowing, a little provocative, suggesting figures more absorbed in themselves, and in how they look, than in anything around them. Bathers by the sea are one of the oldest subjects in painting. Vettriano brings his own theatrical, cinematic sense of style to it, and turns a simple seaside scene into something charged with self-regard and quiet drama.\n\nThe edition is limited to one hundred and twenty-five prints and fifteen Artist's Proofs, each signed and numbered. Signed editions released after an artist's death are rare by definition. There will be no more of them.","edition":"Signed limited edition of 125 + 15 Artist's Proofs (hand-signed before March 2025, released Sept 2026)","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":[38,31],"mountSizeCm":[61,52],"framedSizeCm":[71.8,62.8],"reviewNotes":"Cannot ship to EU or Northern Ireland (GPSR) - director should check collector location.","estDurationSec":69,"audioUrl":"","audioCurrent":false}},{"productId":"e67c8c86-4494-ad8c-c1cb-5a410b5c8130","title":"Night Calls","price":560,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/d9cb8c_010e947063a34593b1bc1db6e2657cb2~mv2.png","story":{"_id":"story-e67c8c86-4494-ad8c-c1cb-5a410b5c8130","status":"draft","transcript":"Night Calls belongs to the after-dark side of Vettriano's work.\n\nThe telephone. The late hour. The closed door. Together, they set the scene for something private. The title alone suggests a call that should not be made, or an arrangement made under cover of night.\n\nThese interiors are where his love of film noir shows most clearly: the low light, the strong sense of mood, and a story told through glances and gestures rather than spelled out. He gives us the atmosphere, and lets us write the plot.\n\nIt is a picture for the collector who prefers the darker, more cinematic strand of his work to the sunlit beaches, and it brings real atmosphere to a wall.\n\nThe edition is just one hundred prints and ten Artist's Proofs, each signed and numbered by Jack Vettriano, on museum etching paper. An edition of one hundred is small by the standards of his published prints, and now that no new signed editions can be made, the supply is fixed. If you are looking for something rarer still, we also hold an Artist's Proof of this same image.","edition":"Signed limited edition of 100 + 10 Artist's Proofs","medium":"300gsm museum etching paper","signed":true,"imageSizeCm":[39,31.5],"mountSizeCm":[62,53.5],"framedSizeCm":[73,64.5],"reviewNotes":"","estDurationSec":74,"audioUrl":"","audioCurrent":false}},{"productId":"119a373c-23b7-06af-3613-192d5db80225","title":"Night Geometry","price":1650,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/d9cb8c_f83c6aca56b24f4db858675b42a8ee37~mv2.jpg","story":{"_id":"story-119a373c-23b7-06af-3613-192d5db80225","status":"draft","transcript":"Night Geometry is one of Vettriano's most cinematic compositions.\n\nA couple embrace beside a window at night. And the title asks us to notice something we might otherwise only feel: how carefully the whole picture has been built. The lines of the window, the angles of the two bodies, the play of light and shadow, all fit together like a film set, lit and framed for a single shot.\n\nVettriano often spoke of the influence of film noir on his work, and here the debt is plain to see. This is a love scene composed like a frame from a black-and-white thriller, but in his own rich colour.\n\nIt captures a private moment, set against the city outside, a theme that runs through his night-time interiors: two people, and the whole world held at bay beyond the glass. The mood is sophisticated and urban, and it suits a living room or a bedroom.\n\nEach print in the edition is signed and numbered by Jack Vettriano, and like all his signed editions, the supply is now fixed. We can tell you the edition number of the example we hold.","edition":"Signed and numbered limited edition (example-specific)","medium":"Giclée","signed":true,"imageSizeCm":"","mountSizeCm":"","framedSizeCm":"","reviewNotes":"Product copy says 'Price on application' but the listing is priced at GBP 1,650 - Studio to reconcile. Edition number/size of the held example needed for provenance panel.","estDurationSec":75,"audioUrl":"","audioCurrent":false}},{"productId":"ef7cc510-0dab-e2a7-caad-07113ec75267","title":"Night In The City","price":1450,"inStock":true,"ribbon":"Framed","image":"https://static.wixstatic.com/media/d9cb8c_4c32b6d5143d44e6a5a0ed843f885d24~mv2.jpg","story":{"_id":"story-ef7cc510-0dab-e2a7-caad-07113ec75267","status":"draft","transcript":"Night in the City. A couple in a room high above the city, the lights of the streets spread out beyond the window.\n\nIt is one of Vettriano's most atmospheric urban paintings, and it combines two things he did brilliantly: the intimacy of a private room, and the scale and glamour of the city at night.\n\nThe view is part of the story. It reminds us of the world this couple have shut out, or the life they have stepped away from, just for this evening. Down there are the streets, the traffic, everyone else. Up here, there are only the two of them.\n\nThe painting has the polished, cinematic quality of his finest night scenes, and its moody palette makes it a striking presence in a living room, a bedroom or a study.\n\nIt was published in 2006 as a limited edition giclée, each print signed and numbered by Jack Vettriano. The image is a generous size, which suits the panoramic feel of the composition, and this example is framed. Twenty years on, the edition is well established, and good examples are increasingly sought after.","edition":"Signed limited edition giclée, published 2006","medium":"Giclée","signed":true,"imageSizeCm":[51,40.5],"mountSizeCm":"","framedSizeCm":"","reviewNotes":"Edition size not in product copy - add for provenance panel.","estDurationSec":74,"audioUrl":"","audioCurrent":false}},{"productId":"b0afab77-2ad4-3ad3-abd9-59ddd1593e83","title":"Queen of the Waltzers","price":535,"inStock":true,"ribbon":"","image":"https://static.wixstatic.com/media/5f58c4_55c1e37592944c458d17c1471d5eaa7f~mv
